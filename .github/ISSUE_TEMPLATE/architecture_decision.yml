name: Architecture decision
description: Propose or change an architecture decision.
title: "[ADR]: "
labels:
  - architecture
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What decision is needed, and why now?
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: Include operational, security, cost, and migration tradeoffs.
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Required gates
      options:
        - label: Contract impact is documented.
          required: true
        - label: SQL Safety / permission impact is documented.
          required: true
        - label: Eval and regression impact is documented.
          required: true
        - label: CTO approval is required before implementation.
          required: true
