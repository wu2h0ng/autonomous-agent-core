name: Feature request
description: Propose a scoped product or engineering change.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user, engineering, or governance problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - required for Trusted Loop
        - P1 - useful after MVP path is stable
        - P2 - future platform capability
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - contracts
        - os_core
        - sql_safety
        - evidence_chain
        - eval
        - domain_pack
        - provider
        - connector
        - api
        - workspace
        - docs
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary checks
      options:
        - label: This does not put domain-specific logic into `packages/os_core/`.
          required: true
        - label: This does not bypass SQL Safety, EvidenceChain, Eval, Trace, or review.
          required: true
        - label: This does not make R4/R5 actions automatic in MVP.
          required: true
