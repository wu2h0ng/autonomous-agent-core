name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # Real PostgreSQL for the AGENT_OS_DATABASE_URL-gated integration tests.
    # Plain postgres:16 has no pgvector, so CI also permanently exercises the
    # 0004 graceful-skip guard (AR-20260611).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agent_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_OS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/agent_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # http + postgres extras so the skip-guarded suites (HTTP e2e, SQL
        # retrieval/uow, PG integration, OpenAPI drift gate) run in CI instead
        # of silently skipping (AR-20260611).
        run: python -m pip install -e ".[dev,http,postgres]"
      - name: Run full CI parity
        run: make ci-local-full PYTHON=python
