# docker-compose.dev.yml — Development overrides
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Mounts source code as volumes for hot reload, adds debug ports,
# and uses relaxed environment for local development.

services:
  # ── API Server (dev) ─────────────────────────────────────────────────────
  api_server:
    build:
      context: .
      dockerfile: Dockerfile
    # Override CMD with uvicorn reload mode
    command: >
      python -m uvicorn agent_os_api.http_app:create_app
        --factory
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/packages
        --reload-dir /app/apps/api_server
        --reload-dir /app/action_connectors
        --reload-dir /app/domain_packs
    volumes:
      # Mount source directories for live editing
      - ./packages/contracts/src:/app/packages/contracts/src
      - ./packages/os_core/src:/app/packages/os_core/src
      - ./packages/persistence/src:/app/packages/persistence/src
      - ./packages/sdk/src:/app/packages/sdk/src
      - ./apps/api_server/src:/app/apps/api_server/src
      - ./action_connectors:/app/action_connectors
      - ./domain_packs:/app/domain_packs
    environment:
      # Use in-memory stores for fast dev iteration (override to postgres to test durability)
      AGENT_OS_STORE_BACKEND: ${AGENT_OS_STORE_BACKEND:-memory}
      AGENT_OS_EXECUTOR: ${AGENT_OS_EXECUTOR:-static}
      # Disable health check start period for faster feedback
      AGENT_OS_API_KEY: dev-internal-key
      AGENT_OS_EXTERNAL_API_KEY: dev-external-key
      AGENT_OS_OPERATOR_API_KEY: dev-operator-key
    ports:
      - "${API_PORT:-8000}:8000"
      # Python debugger port
      - "${DEBUG_PORT:-5678}:5678"

  # ── Frontend (dev) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: apps/workspace/frontend
      dockerfile: Dockerfile
      target: deps
    # Override: run next dev instead of the production build
    command: npm run dev
    volumes:
      - ./apps/workspace/frontend/src:/app/src
      - ./apps/workspace/frontend/public:/app/public
      - ./apps/workspace/frontend/next.config.ts:/app/next.config.ts
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_RUN_KEY: ${NEXT_PUBLIC_RUN_KEY:-dev-internal-key}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

  # ── PostgreSQL (dev: expose on host for local tools) ────────────────────
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
