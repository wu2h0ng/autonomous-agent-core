name: gmv
display_name: GMV
definition: Gross merchandise value over paid orders in the selected time window.
owner: revenue_ops
unit: CNY
allowed_schemas:
  - sales
dimensions:
  - order_date
quality_contract:
  freshness: 24h
  null_rate: "<0.01"
  owner: data_platform@company.com
verified_queries:
  - template_id: gmv_daily
    metric_name: gmv
    sql: |
      SELECT order_date, SUM(paid_amount) AS gmv
      FROM sales.orders
      WHERE order_date >= :start_date AND order_date < :end_date
      GROUP BY order_date
      LIMIT 1000
    required_parameters:
      - start_date
      - end_date
    required_time_parameters:
      - start_date
      - end_date
    default_limit: 100
    max_limit: 1000
action_candidates:
  - id: investigate_gmv_drop
    trigger: gmv < baseline * 0.9
    risk_level: R2
    description: Investigate when GMV drops below 90% of baseline.
feedback_metric: weekly_gmv_recovery
