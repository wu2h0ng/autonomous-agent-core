<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
      text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}
      .title{fill:#f8fafc;font-size:20px;font-weight:700}.subt{fill:#94a3b8;font-size:11px}
      .label{fill:#f8fafc;font-size:12px;font-weight:700}.sub{fill:#94a3b8;font-size:9px}
      .tiny{fill:#cbd5e1;font-size:8px}.yes{fill:#34d399;font-size:9px;font-weight:700}.no{fill:#fb7185;font-size:9px;font-weight:700}
      .region{fill:#fbbf24;font-size:10px;font-weight:700}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
    <marker id="red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="1180" height="1220" fill="#0f172a"/><rect width="1180" height="1220" fill="url(#grid)"/>
  <text x="40" y="46" class="title">AI Native Business Data Agent OS · Trusted Loop</text>
  <text x="40" y="67" class="subt">业务意图 → 可信数据证据 → 受治理业务行动；产品 Core 自研，外部 Agent 框架只作非生产参考</text>

  <rect x="330" y="98" width="410" height="920" rx="16" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="350" y="92" class="region">ai-native-business-data-agent-os Product Core Runtime</text>
  <rect x="780" y="350" width="250" height="360" rx="14" fill="none" stroke="#fb7185" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="800" y="374" fill="#fb7185" font-size="10" font-weight="700">Human / Governance Boundary</text>
  <rect x="70" y="300" width="220" height="380" rx="14" fill="none" stroke="#60a5fa" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="90" y="324" fill="#60a5fa" font-size="10" font-weight="700">Domain Pack / Customer-0</text>

  <line x1="535" y1="178" x2="535" y2="226" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan)"/>
  <line x1="535" y1="286" x2="535" y2="334" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan)"/>
  <line x1="535" y1="394" x2="535" y2="442" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan)"/>
  <line x1="535" y1="502" x2="535" y2="558" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="536" class="yes">pass</text>
  <path d="M595 592 L800 592 L800 438" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#red)"/><text x="650" y="583" class="no">blocked</text>
  <line x1="535" y1="626" x2="535" y2="674" stroke="#22d3ee" stroke-width="2" marker-end="url(#cyan)"/>
  <line x1="535" y1="734" x2="535" y2="790" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="550" y="770" class="yes">complete</text>
  <path d="M595 824 L900 824 L900 630" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#red)"/><text x="695" y="815" class="no">weak evidence</text>
  <line x1="535" y1="858" x2="535" y2="914" stroke="#34d399" stroke-width="2" marker-end="url(#green)"/>
  <path d="M640 948 L830 948 L830 610" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/><text x="690" y="938" class="tiny">R4/R5 human gate</text>
  <path d="M430 950 L180 950 L180 680" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#cyan)"/><text x="230" y="940" class="tiny">feedback updates pack</text>

  <rect x="110" y="360" width="140" height="58" rx="6" fill="#0f172a"/><rect x="110" y="360" width="140" height="58" rx="6" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="180" y="384" class="label" text-anchor="middle">MetricContract</text><text x="180" y="402" class="sub" text-anchor="middle">口径 / owner</text>
  <rect x="110" y="468" width="140" height="58" rx="6" fill="#0f172a"/><rect x="110" y="468" width="140" height="58" rx="6" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="180" y="492" class="label" text-anchor="middle">SQLTemplate</text><text x="180" y="510" class="sub" text-anchor="middle">参数 / limit</text>
  <rect x="110" y="576" width="140" height="58" rx="6" fill="#0f172a"/><rect x="110" y="576" width="140" height="58" rx="6" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.4"/>
  <text x="180" y="600" class="label" text-anchor="middle">ProviderContract</text><text x="180" y="618" class="sub" text-anchor="middle">能力 / 权限</text>
  <path d="M250 389 L415 364" fill="none" stroke="#60a5fa" marker-end="url(#cyan)"/><path d="M250 497 L415 592" fill="none" stroke="#60a5fa" marker-end="url(#cyan)"/><path d="M250 605 L415 472" fill="none" stroke="#60a5fa" marker-end="url(#cyan)"/>

  <rect x="415" y="118" width="240" height="60" rx="22" fill="#0f172a"/><rect x="415" y="118" width="240" height="60" rx="22" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="535" y="143" class="label" text-anchor="middle">BusinessIntent</text><text x="535" y="161" class="sub" text-anchor="middle">自然语言问题</text>
  <rect x="415" y="226" width="240" height="60" rx="6" fill="#0f172a"/><rect x="415" y="226" width="240" height="60" rx="6" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="535" y="251" class="label" text-anchor="middle">IntentParser</text><text x="535" y="269" class="sub" text-anchor="middle">metric / time / filters</text>
  <rect x="415" y="334" width="240" height="60" rx="6" fill="#0f172a"/><rect x="415" y="334" width="240" height="60" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="535" y="359" class="label" text-anchor="middle">Semantic Runtime</text><text x="535" y="377" class="sub" text-anchor="middle">MetricContract resolution</text>
  <rect x="415" y="442" width="240" height="60" rx="6" fill="#0f172a"/><rect x="415" y="442" width="240" height="60" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="535" y="467" class="label" text-anchor="middle">Provider Registry</text><text x="535" y="485" class="sub" text-anchor="middle">choose data capability</text>
  <g transform="translate(535 592)"><polygon points="0,-48 68,0 0,48 -68,0" fill="#0f172a"/><polygon points="0,-48 68,0 0,48 -68,0" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/><text y="-4" class="label" text-anchor="middle">SQL Safety</text><text y="15" class="sub" text-anchor="middle">safe?</text></g>
  <rect x="415" y="674" width="240" height="60" rx="6" fill="#0f172a"/><rect x="415" y="674" width="240" height="60" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="535" y="699" class="label" text-anchor="middle">Query Runtime</text><text x="535" y="717" class="sub" text-anchor="middle">read-only sandbox</text>
  <g transform="translate(535 824)"><polygon points="0,-48 68,0 0,48 -68,0" fill="#0f172a"/><polygon points="0,-48 68,0 0,48 -68,0" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/><text y="-4" class="label" text-anchor="middle">Evidence</text><text y="15" class="sub" text-anchor="middle">complete?</text></g>
  <rect x="415" y="914" width="240" height="66" rx="6" fill="#0f172a"/><rect x="415" y="914" width="240" height="66" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="535" y="940" class="label" text-anchor="middle">ActionProposal</text><text x="535" y="958" class="sub" text-anchor="middle">risk / approval / metrics</text>

  <rect x="825" y="410" width="160" height="62" rx="6" fill="#0f172a"/><rect x="825" y="410" width="160" height="62" rx="6" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/><text x="905" y="436" class="label" text-anchor="middle">Data Steward</text><text x="905" y="454" class="sub" text-anchor="middle">补口径 / 修模板</text>
  <rect x="825" y="580" width="160" height="62" rx="6" fill="#0f172a"/><rect x="825" y="580" width="160" height="62" rx="6" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/><text x="905" y="606" class="label" text-anchor="middle">Approval Lite</text><text x="905" y="624" class="sub" text-anchor="middle">人工确认</text>

  <rect x="90" y="1070" width="1000" height="80" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="112" y="1096" fill="#f8fafc" font-size="11" font-weight="700">MVP Observability</text>
  <text x="112" y="1122" class="tiny">TraceEvent 回放执行步骤；TelemetryEvent 输出 business / quality / cost / system 四维指标；OpenTelemetry-compatible，但不强制部署完整平台。</text>
</svg>
