<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>外部世界学习知识地图 · AI / Data / Agent</title>
<style>
  :root{
    --bg:#0b1020; --panel:#111a36; --panel2:#0c1430;
    --ink:#e8edff; --muted:#9aa6cf; --line:#1e2b54; --accent:#5b8cff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 800px at 70% -10%,#16224a 0%,var(--bg) 55%);color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #app{display:flex;height:100vh;width:100vw}
  #side{width:344px;min-width:344px;height:100%;background:linear-gradient(180deg,var(--panel) 0%,var(--panel2) 100%);
    border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .brand{padding:18px 18px 12px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:15px;margin:0 0 5px;letter-spacing:.2px}
  .brand p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.55}
  .search{padding:12px 16px 6px}
  .search input{width:100%;background:#0a1228;border:1px solid var(--line);color:var(--ink);
    padding:9px 12px;border-radius:8px;font-size:13px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .sect-title{padding:10px 18px 4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .legend{padding:2px 12px 8px;overflow-y:auto}
  .leg{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer;user-select:none;font-size:12.5px;transition:.15s}
  .leg:hover{background:#16224a}
  .leg.act{background:#16224a;border:1px solid rgba(91,140,255,.45)}
  .leg.off{opacity:.38}
  .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .leg .n{margin-left:auto;font-size:11px;color:var(--muted)}
  .paths{padding:0 12px 10px;overflow-y:auto;max-height:168px}
  .path-btn{width:100%;text-align:left;margin:0 0 7px;padding:9px 10px;border:1px solid var(--line);background:#0a1228;border-radius:8px;cursor:pointer;color:var(--ink);transition:.15s}
  .path-btn:hover{border-color:#5b8cff}
  .path-btn.active{border-color:#5b8cff;background:#16224a;box-shadow:0 0 0 1px rgba(91,140,255,.25)}
  .path-btn b{display:block;font-size:12.5px;margin-bottom:3px}
  .path-btn span{display:block;font-size:11px;color:var(--muted);line-height:1.45}
  .foot{margin-top:auto;padding:12px 18px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.6}
  .foot b{color:var(--ink)}
  .edge-leg{margin-top:8px;line-height:1.9}
  .edge-leg span{display:inline-flex;align-items:center;gap:6px;margin-right:10px}
  .edge-leg i{display:inline-block;width:20px;height:0;flex:none}
  #stage{position:relative;flex:1;height:100%}
  canvas{display:block;width:100%;height:100%;cursor:grab}
  canvas:active{cursor:grabbing}
  .hud{position:absolute;top:14px;left:16px;display:flex;gap:8px;flex-wrap:wrap;z-index:5}
  .chip{background:rgba(13,20,44,.82);border:1px solid var(--line);color:var(--muted);padding:6px 11px;border-radius:20px;
    font-size:11.5px;cursor:pointer;backdrop-filter:blur(6px);transition:.15s}
  .chip:hover{color:var(--ink);border-color:var(--accent)}
  .chip.act{color:#fff;border-color:var(--accent);background:rgba(91,140,255,.22)}
  .ctrls{position:absolute;bottom:16px;left:16px;display:flex;gap:8px;z-index:5}
  .ctrls button{width:34px;height:34px;border-radius:9px;background:rgba(13,20,44,.85);border:1px solid var(--line);
    color:var(--ink);font-size:16px;cursor:pointer;backdrop-filter:blur(6px)}
  .ctrls button:hover{border-color:var(--accent)}
  #detail{position:absolute;top:0;right:0;height:100%;width:430px;background:linear-gradient(180deg,#101935 0%,#0b1430 100%);
    border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:20;display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.4)}
  #detail.open{transform:translateX(0)}
  .d-head{padding:20px 22px 16px;border-bottom:1px solid var(--line)}
  .d-cat{display:inline-flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);margin-bottom:9px;
    padding:3px 10px;border-radius:20px;border:1px solid var(--line)}
  .d-star{display:inline-block;margin-left:7px;color:#ffd166;font-size:11px}
  .d-head h2{margin:0;font-size:18px;line-height:1.3}
  .d-body{padding:8px 22px 28px;overflow-y:auto}
  .d-block{margin-top:18px}
  .d-block .lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;font-weight:600}
  .d-block .txt{font-size:13px;line-height:1.66;color:#d4ddff}
  .d-block ul.txt{margin:0;padding-left:18px}
  .d-block ul.txt li{margin:4px 0}
  .d-block code{background:#0a1228;border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:11.5px;color:#9fd0ff}
  .rel{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
  .rel a{font-size:12px;color:#bcd0ff;background:#0a1228;border:1px solid var(--line);padding:5px 10px;border-radius:7px;
    cursor:pointer;transition:.15s;text-decoration:none}
  .rel a:hover{border-color:var(--accent);color:#fff}
  .d-close{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--muted);font-size:22px;line-height:1;background:none;border:none}
  .d-close:hover{color:#fff}
  .tip{position:absolute;pointer-events:none;background:rgba(8,14,32,.95);border:1px solid var(--line);color:var(--ink);
    padding:6px 10px;border-radius:7px;font-size:12px;z-index:30;display:none;max-width:240px;line-height:1.4;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  @media(max-width:900px){#side{width:240px;min-width:240px}#detail{width:300px}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <h1>外部世界学习知识地图</h1>
      <p>面向<b style="color:#e8edff">当今世界的公开知识体系</b>：基础原理、技术前沿、行业玩家与商业动态。<b style="color:#9fd0ff">不含项目内文档</b>。每节点：学什么 · 为什么 · 局限 · 业界方向 · 突破思路 · 外部资料。⭐ = 优先必修。</p>
    </div>
    <div class="search"><input id="q" placeholder="搜索：LangGraph / NL2SQL / 可观测性 / 局限"/></div>
    <div class="sect-title">学习路径 · 点击高亮</div>
    <div class="paths" id="paths"></div>
    <div class="sect-title">学习领域 · 点击筛选 · Ctrl 多选</div>
    <div class="legend" id="legend"></div>
    <div class="foot">
      <b>用法</b>：按 1→5 路径顺序学。领域：单击单选，Ctrl+单击多选，再点已选项取消。<br/>
      <b>连线</b>：
      <div class="edge-leg">
        <span><i style="border-top:2px solid rgba(77,208,225,.7)"></i>前置</span>
        <span><i style="border-top:1px solid rgba(120,140,200,.35)"></i>关联</span>
        <span><i style="border-top:1px dashed rgba(255,107,107,.55)"></i>对照</span>
      </div>
    </div>
  </aside>

  <div id="stage">
    <div class="hud">
      <div class="chip act" data-view="all">全部</div>
      <div class="chip" data-view="tech">技术认知</div>
      <div class="chip" data-view="industry">行业格局与动态</div>
      <div class="chip" data-view="biz">商业·融资·组织</div>
      <div class="chip" data-view="deep">技术深潜</div>
      <div class="chip" data-view="priority">⭐ 优先必修</div>
    </div>
    <canvas id="cv"></canvas>
    <div class="ctrls">
      <button id="zin" title="放大">＋</button>
      <button id="zout" title="缩小">－</button>
      <button id="reset" title="复位">⟳</button>
    </div>
    <div class="tip" id="tip"></div>

    <div id="detail">
      <button class="d-close" id="dclose">×</button>
      <div class="d-head">
        <span class="d-cat" id="dcat"></span>
        <h2 id="dtitle"></h2>
      </div>
      <div class="d-body" id="dbody"></div>
    </div>
  </div>
</div>

<script>
// ====== 学习领域（颜色 + 视图分组）======
const CATS = {
  ai:    {name:"AI / LLM 技术素养", color:"#5b8cff", group:"tech"},
  data:  {name:"数据与语义基础设施", color:"#4dd0e1", group:"tech"},
  entai: {name:"企业级 AI 落地", color:"#06d6a0", group:"tech"},
  land:  {name:"行业格局 / 玩家认知", color:"#ff6b6b", group:"industry"},
  mkt:   {name:"市场动态与时机判断", color:"#a0e060", group:"industry"},
  buyer: {name:"企业买家与采购", color:"#f4a261", group:"biz"},
  gtm:   {name:"GTM 与品类设计", color:"#e0aaff", group:"biz"},
  fund:  {name:"融资与投资人叙事", color:"#ffd166", group:"biz"},
  org:   {name:"组织与人才", color:"#ff8fa3", group:"biz"},
  mind:  {name:"战略思维 / 心智模型", color:"#b388ff", group:"biz"},
  stack: {name:"关键技术栈深潜", color:"#ff9f43", group:"tech"},
};

// deep:true = 「技术深潜」视图专用节点

// p:true = ⭐ 优先必修。how 仅含外部公开资料，不含任何项目内文档。limits/frontier/breakthrough=局限·方向·突破
const N = [
  // ---------- AI / LLM 技术素养 ----------
  {id:"ai_taxonomy", c:"ai", p:1, r:13, l:"AI 技术路线总览",
   def:"AI 是更大学科集合：符号 AI、搜索与规划、机器学习、深度学习、强化学习、生成式 AI、基础模型、Agent。LLM 只是其中一条路线。",
   why:"把 AI 等同于 LLM 会误判技术选型、成本结构与竞争边界。必须先建立全景再深入子领域。",
   limits:"学科庞杂易迷失；非 LLM 路线常被忽视；「AI=大模型」叙事掩盖规则/优化/传统 ML 的适用场景。",
   frontier:"复合架构成主流：LLM+检索+工具+规则+优化+workflow，而非单模型包打天下。",
   breakthrough:"按任务选技术：预测/分类用 ML，规划用搜索+规则，理解生成用 LLM，执行用 workflow+网关。先问任务类型再问模型。",
   how:"Berkeley AIMA 资源；Deep Learning Book；Stanford AI Index；Karpathy《Intro to LLMs》作 LLM 子集入门。",
   req:[],
   rel:["llm_cap","model_landscape","agent_arch","decision_engine","macro_ai"]},
  {id:"llm_cap", c:"ai", p:1, r:15, l:"LLM 能力与边界",
   req:["ai_taxonomy"],
   def:"Transformer 直觉、上下文窗口、涌现能力、采样/温度；尤其搞清 LLM 擅长什么、必然不擅长什么（确定性计算、最新事实、严格口径）。",
   why:"企业级 AI 可信能力全建立在『LLM 不可单独信任』之上。不懂边界就会过度承诺或被技术叙事忽悠。",
   limits:"概率生成非计算引擎；上下文贵且会遗忘；知识有 cutoff；口径/权限需外挂系统；多步推理错误累积。",
   frontier:"推理模型(o1类)、工具调用、长上下文、小模型端侧、LLM+检索+规则复合架构成主流。",
   breakthrough:"LLM 定位成『理解+编排+解释』层，计算/决策/执行交给语义层+决策引擎+执行网关。用 Eval 约束而非盲目堆模型。",
   how:"Karpathy《Intro to LLMs》《Let's build GPT》(YouTube)；3Blue1Brown 神经网络系列；Anthropic / OpenAI 官方文档；《这就是 ChatGPT》(Wolfram)。",
   rel:["reliability","agent_arch","eval_sci","model_landscape","decision_engine"]},
  {id:"agent_arch", c:"ai", p:1, r:14, l:"Agent 架构与设计模式",
   req:["llm_cap","context_eng"],
   def:"ReAct、规划/反思、工具调用、多 Agent 协作、记忆与状态机；以及『何时不该用 Agent』。",
   why:"Data/Business Agent 是 2024-2026 最热赛道。必须能判断架构取舍，识别真平台与套壳框架的差异。",
   limits:"① Demo 强、生产弱：多数框架缺权限/审计/回滚。② 过度自治：LLM 当决策者不可复现、不可追责。③ 框架锁死：治理与证据链难贯穿。④ 成本失控：多步 loop token 爆炸。⑤ 有 trace 不等于有业务回归门禁。",
   frontier:"业界从 prompt agent 转向 Agent OS / governed autonomy / durable execution / MCP / trace-driven ops。代表：OpenAI Agents SDK、LangGraph、Temporal、Palantir AIP。",
   breakthrough:"Agent = 受控推理+工具编排层，非独立智能体。三层分离：洞察(分析/语义层)、决策(规则+优化)、执行(受治理网关)。反模式：能 workflow 不用 agent loop；能规则不用 LLM 决策；能单 Agent 不多 Agent 扯皮。",
   how:"Anthropic《Building Effective Agents》(必读)；Lilian Weng《LLM Powered Autonomous Agents》；LangGraph/Temporal 文档只学概念不绑定；对比 OpenAI Practical Guide to Building Agents。",
   rel:["llm_cap","mcp_interop","agent_gov","dev_paradigm","langgraph_ref","agent_runtime_os","paradigm_innovation","agent_obs","nl2sql","computer_use"]},
  {id:"context_eng", c:"ai", r:11, l:"Context Engineering / RAG",
   req:["llm_cap"],
   def:"检索增强、chunking、rerank、长上下文管理、结构化检索 vs 向量近似检索的边界。",
   why:"决定企业知识是真资产还是向量碎片。RAG 的局限推动了结构化语义层与 hybrid retrieval 的业界演进。",
   how:"Eugene Yan 博客；Jason Liu (instructor/RAG)；Chip Huyen《AI Engineering》检索章节；Anthropic Contextual Retrieval 文章。",
   rel:["vector_search","semantic_layer","reliability"]},
  {id:"eval_sci", c:"ai", p:1, r:14, l:"评测科学 (Evals)",
   def:"离线/在线评测、LLM-as-judge、golden set、回归集、人类标注、统计显著性；如何度量『更准了』。",
   why:"Hamel Husain 等业界共识：没有 Eval 就没有可商业化的 AI。企业采购的核心门槛之一。",
   limits:"LLM-as-judge 有偏见；golden set 腐化；评测覆盖≠生产安全；组件评测漏掉流程级失败；商业承诺难用单一分数表达。",
   frontier:"agent trace eval、tool-call 正确性评测、业务 KPI 挂钩 eval、CI 门禁化、红队对抗评测。",
   breakthrough:"三层评测：组件(检索/SQL)→流程(agent run)→业务(KPI)。失败样本沉淀为回归集。Eval 是产品能力，不是研发附属品。",
   how:"Hamel Husain《Your AI product needs evals》(必读)；Chip Huyen《AI Engineering》eval 章；OpenAI Evals 仓库；关注 Eugene Yan。",
   rel:["llm_cap","eval_driven","reliability","saas_metrics","agent_runtime_os"]},
  {id:"inference_econ", c:"ai", r:11, l:"推理成本与 AI 经济学",
   def:"token 成本结构、上下文/输出成本、prompt 缓存、批处理、蒸馏、单位经济(每次问答成本)。",
   why:"决定毛利率与定价可行性。投资人会问单位经济；私有化客户会问算力账。不懂成本就定不出价、算不出 ROI。",
   how:"Latent Space 播客；a16z《LLMflation》；Artificial Analysis(模型性价比对比)；各模型厂定价页对比；自己建一张『单次闭环成本』测算表。",
   rel:["model_landscape","pricing","roi","saas_metrics"]},
  {id:"model_landscape", c:"ai", r:11, l:"模型版图与选型",
   def:"闭源(Claude/GPT/Gemini) vs 开源(Llama/Qwen/DeepSeek)、国产模型、serving(vLLM/Ollama)、能力-成本-合规权衡。",
   why:"企业 AI 需要模型可替换与 BYO 能力。国产化、私有化场景尤其敏感。懂选型逻辑比记参数重要。",
   how:"LMArena 排行榜；Artificial Analysis；Hugging Face；机器之心/量子位追国产模型；vLLM 文档了解 serving。",
   rel:["llm_cap","inference_econ","procurement","regulation"]},
  {id:"reliability", c:"ai", r:11, l:"幻觉 · 可靠性 · 可解释",
   def:"幻觉成因、grounding、置信度校准、可解释性的真实边界(不要神化)。",
   why:"企业决策 AI 的核心问题是『答案为什么可信』。必须懂可靠性边界，识别『假装可解释』的营销话术。",
   how:"Anthropic 可解释性研究博客；各家 System Card / Model Card；Simon Willison 博客；关注 hallucination benchmark。",
   rel:["llm_cap","eval_sci","evidence_xai"]},
  {id:"finetune", c:"ai", r:10, l:"微调 vs 提示 vs 检索",
   def:"何时该微调、何时 RAG、何时纯 prompt；成本、维护负担与收益对比。",
   why:"避免团队陷入『动不动就微调』的资源黑洞；也避免对客户过度承诺『为你训练专属模型』。",
   how:"OpenAI / Anthropic 微调指南；Chip Huyen《AI Engineering》；Hamel Husain 关于 fine-tuning 的实战文章。",
   rel:["llm_cap","context_eng","inference_econ"]},

  // ---------- 数据与语义基础设施 ----------
  {id:"semantic_layer", c:"data", p:1, r:14, l:"语义层 / 指标层",
   def:"Metrics Layer、headless BI、指标一致性、口径治理；语义层正成为 Agent 时代的公共上下文协议。",
   why:"语义层是 Agent 时代的关键基础设施。dbt/Cube/ThoughtSpot OSI 等玩家的主战场，不懂就无法评估任何数据 AI 产品。",
   how:"dbt Semantic Layer 文档；Cube.dev 博客；Benn Stancil (substack《benn.substack》)；ThoughtSpot Open Semantic Interchange 资料。",
   rel:["data_fabric","lineage_gov","read_aloudata","mcp_interop","nl2sql"]},
  {id:"data_fabric", c:"data", r:11, l:"数据编织 / NoETL / 虚拟化",
   def:"Data Fabric、data virtualization、联邦查询、NoETL、自适应物化；让数据『不搬家也能用』。",
   why:"Data Fabric/NoETL 是 2023-2026 数据栈最热叙事之一。懂它在解决什么才能判断是真创新还是营销造词。",
   how:"Gartner《Data Fabric》报告摘要；Aloudata 官网白皮书/发布稿；Denodo 资料；对比 NoETL 与传统 ETL。",
   rel:["semantic_layer","lakehouse","read_aloudata"]},
  {id:"lakehouse", c:"data", r:10, l:"湖仓 / 现代数据栈",
   def:"Lakehouse、Iceberg/Delta、Snowflake/Databricks 架构、Modern Data Stack 全景。",
   why:"企业大多已有 Snowflake/Databricks/传统数仓。任何数据 AI 产品都需理解在位栈才能谈接入与上位。",
   how:"Databricks / Snowflake 技术博客；《Designing Data-Intensive Applications》(DDIA，数据系统圣经)；a16z《Emerging Architectures for Modern Data Infra》。",
   rel:["data_fabric","hyperscaler","lineage_gov"]},
  {id:"lineage_gov", c:"data", r:10, l:"数据血缘与治理",
   def:"lineage、active metadata、data contract、catalog、数据质量；算子级血缘是 Aloudata BIG 的卖点。",
   why:"证据链/可追溯的底层依赖血缘。也是企业治理采购的硬指标。",
   how:"OpenLineage 文档；《Data Mesh》(Zhamak Dehghani)；Monte Carlo / Atlan 博客；了解 data contract 运动。",

  {id:"agent_runtime_os", c:"stack", p:1, deep:1, r:15, l:"Agent Runtime / Agent OS 本质",
   req:["agent_arch","agent_obs"],
   def:"Agent OS = 状态+记忆+工具+权限+计划+执行+审计+回滚+HITL 的可治理运行时；不是聊天 UI，也不是某个 Python 框架的包名。",
   why:"判断企业 AI 终局形态的基础。不懂 Runtime 与框架的区别，就无法评估 Palantir/Snowflake/开源框架各自做到了哪一层。",
   limits:"① 开源框架常与 LangChain 生态绑死，替换成本高。② 权限/审批/证据链/审计非框架一等公民。③ 有 trace 不等于有治理(审批/幂等/回滚)。④ 多 Agent 协作复杂度指数上升。⑤ 托管 SaaS Runtime 难满足私有化/气隙部署。",
   frontier:"durable agent、computer use、tool sandbox、MCP 工具标准、trace-driven ops。Palantir AIP / Snowflake Cortex 争的是 enterprise control plane。",
   breakthrough:"OS 内核思维：Runtime+Policy+Trace 是内核，Domain/Connector 是外围，图编排是可替换 adapter。Contract-first：每次工具调用可 schema 校验+eval 回归。新范式：企业 Agent = governed execution environment，不是 chatbot wrapper。",
   how:"OpenAI《A Practical Guide to Building Agents》；Anthropic《Building Effective Agents》；Palantir AIP 文档；Temporal durable execution 概念；LangGraph workflows 文档(只学设计模式)。",
   rel:["agent_arch","langgraph_ref","durable_exec","exec_gateway","decision_engine","agent_gov","eval_sci"]},

  {id:"langgraph_ref", c:"stack", p:1, deep:1, r:14, l:"LangGraph 与 Agent 框架",
   req:["agent_runtime_os"],
   cmp:["openai_agents_sdk"],
   def:"LangGraph 是 LangChain 系的 Agent/工作流状态图框架：节点=步骤、边=转移，支持 checkpoint、HITL、子图与持久执行。",
   why:"2024-2026 最流行的 Agent 编排框架之一。必须懂其能力与硬局限，才能判断何时借鉴、何时自建。",
   limits:"① 与 LangChain/LangSmith 深度耦合。② 企业治理(权限/审批/审计)需大量自建。③ 复杂图难回归评测与版本迁移。④ 长流程 token 成本高。⑤ 幂等/补偿/跨系统事务非开箱。⑥ 『有框架=快』常变后期重写。",
   frontier:"durable execution、interrupt/resume、MCP 集成、hosted platform、supervisor 多 Agent。平行物：OpenAI Agents SDK(更轻)、Temporal(基础设施)、Inngest(事件驱动)。趋势：框架变薄，治理变厚。",
   breakthrough:"提取三模式：状态机、checkpoint、HITL interrupt——可迁入任何自研 Runtime。分层：图只调度，Policy/Evidence/Eval 在图外拦截。核心问题：企业要 agent graph，还是 decision lineage + governed action？",
   how:"LangGraph 官方 docs(workflows/durable execution/HITL)；GitHub issues 看生产痛点；LangChain Blog；对比 OpenAI Agents SDK 设计差异。",
   rel:["agent_runtime_os","durable_exec","openai_agents_sdk","agent_arch","dev_paradigm"]},

  {id:"openai_agents_sdk", c:"stack", deep:1, r:12, l:"OpenAI Agents SDK / 多框架横评",
   cmp:["langgraph_ref"],
   def:"OpenAI Agents SDK、CrewAI、AutoGen、PydanticAI、Microsoft Agent Framework 等：定义 agent、handoff、tool、guardrail 的快速构建层。",
   why:"建立横向判断力，避免被单一 vendor 或『多 Agent 角色扮演』叙事绑架。",
   limits:"① handoff/tool call 易学，企业治理难补。② CrewAI/AutoGen demo 强、生产稳定性弱。③ 与模型/API 生态绑定。④ 不管指标口径、SQL 安全、血缘。⑤ tool poisoning、excessive agency 需自建防护。",
   frontier:"轻量 SDK + 强 trace + MCP 兼容 + 托管 runtime。竞争焦点转向企业工具链集成，而非 agent 角色数量。",
   breakthrough:"框架价值在设计模式，不在依赖。横向比：tracing、HITL、tool schema、guardrail、持久执行、私有化。用 domain tool 封装业务能力，而非用 Crew 模拟组织架构。",
   how:"OpenAI Agents SDK 官方文档；Microsoft AutoGen 文档；CrewAI docs；快速 demo 后自问：SOC2 审批链、幂等执行框架提供了什么？",
   rel:["langgraph_ref","agent_runtime_os","mcp_interop","agent_gov"]},

  {id:"durable_exec", c:"stack", deep:1, r:13, l:"持久执行 Temporal / 长流程",
   def:"Durable execution：工作流状态持久化、故障恢复、定时/重试/补偿、saga；代表 Temporal、Cadence、AWS Step Functions、LangGraph checkpoint。",
   why:"企业 Agent 多是跨天、跨系统、需审批的长流程。无持久执行则难以生产落地。",
   limits:"① Temporal 等集群运维成本高。② 确定性 workflow 与 LLM 不确定性交界难测。③ workflow 代码升级兼容性难。④ 业务方难读懂代码级 workflow。⑤ 只保执行可靠性，不保推理正确性。",
   frontier:"Temporal 成 agentic workflow 底层；LangGraph/Inngest 借鉴其语义；AI step as activity 模式成熟；云厂商托管 durable runtime。",
   breakthrough:"分层：LLM 步骤=短事务+幂等工具调用；业务流程=durable workflow。AI 失败可重试+HITL，不污染 saga。durability 是执行层属性，不是智能属性。",
   how:"Temporal 官方 docs(workflow/activity/saga)；Cadence 文档；LangGraph durable execution；Stripe/Netflix Temporal 案例分享。",
   rel:["langgraph_ref","exec_gateway","three_layer_loop","agent_gov"]},

  {id:"p1",title:"1. 判断力底座",desc:"AI谱系、LLM边界、模型版图、可靠性、评测、宏观趋势",nodes:["ai_taxonomy","llm_cap","model_landscape","reliability","eval_sci","macro_ai"]},
  {id:"p2",title:"2. 数据与 Agent 核心",desc:"语义层、RAG、NL2SQL、Agent架构、MCP、治理、可观测",nodes:["semantic_layer","context_eng","nl2sql","vector_search","agent_arch","mcp_interop","agent_gov","agent_obs","eval_driven"]},
  {id:"p3",title:"3. 技术深潜",desc:"Runtime、LangGraph、三层架构、决策/执行、Computer Use",nodes:["agent_runtime_os","langgraph_ref","durable_exec","three_layer_loop","decision_engine","exec_gateway","computer_use","paradigm_innovation"]},
  {id:"p4",title:"4. 行业格局",desc:"Palantir、数据云、BI、国内玩家、开源、垂直场景",nodes:["read_palantir","ontology","hyperscaler","bi_incumbents","read_aloudata","oss_eco","controlplane_war","industry_verticals","quad_target"]},
  {id:"p5",title:"5. 商业化闭环",desc:"预算、时机、采购、POC、ROI、定位、融资",nodes:["ai_budget","timing","how_ent_buy","poc_paid","roi","positioning","category","vc_thesis","saas_metrics"]},
];

// ====== 边类型：requires(前置) / related(关联) / competes(对照) ======
const EDGE_STYLES={
  requires:{color:"rgba(77,208,225,.55)",width:2,dash:[],alpha:1},
  related:{color:"rgba(120,140,200,.22)",width:1,dash:[],alpha:.85},
  competes:{color:"rgba(255,107,107,.42)",width:1.2,dash:[6,4],alpha:.9},
};
const edges=[]; const edgeSeen=new Set();
function pushEdge(from,to,type){
  if(from===to)return; const k=type+"|"+from+"|"+to; if(edgeSeen.has(k))return; edgeSeen.add(k);
  edges.push({from,to,type});
}
const idset=new Set(N.map(n=>n.id));
N.forEach(n=>{
  (n.req||[]).forEach(r=>{ if(idset.has(r)) pushEdge(r,n.id,"requires"); });
  (n.rel||[]).forEach(r=>{ if(idset.has(r)) pushEdge(n.id,r,"related"); });
  (n.cmp||[]).forEach(r=>{ if(idset.has(r)) pushEdge(n.id,r,"competes"); });
});

const PRIORITY=new Set(N.filter(n=>n.p).map(n=>n.id));
const DEEP=new Set(N.filter(n=>n.deep).map(n=>n.id));

// ====== 按领域固定布局 ======
const LAYOUT={
  ai:[0.20,0.23], data:[0.37,0.21], stack:[0.56,0.23], entai:[0.74,0.30],
  land:[0.22,0.62], mkt:[0.44,0.48], buyer:[0.12,0.46], gtm:[0.33,0.78],
  fund:[0.50,0.74], org:[0.66,0.58], mind:[0.54,0.38]
};
const CLUSTER_R={land:0.12,gtm:0.11,default:0.095};

const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W,H,DPR;
function resize(){ DPR=window.devicePixelRatio||1; W=cv.clientWidth; H=cv.clientHeight; cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); initLayout(); }
const nodes=N.map(n=>({...n,x:W/2,y:H/2}));
const nmap=Object.fromEntries(nodes.map(n=>[n.id,n]));

function initLayout(){
  if(!W||!H)return;
  const byCat={};
  nodes.forEach(n=>(byCat[n.c]=byCat[n.c]||[]).push(n));
  Object.entries(byCat).forEach(([cat,arr])=>{
    arr.sort((a,b)=>(b.r||10)-(a.r||10));
    const [cx,cy]=LAYOUT[cat]||[0.5,0.5];
    const baseX=cx*W, baseY=cy*H;
    const radius=Math.min(W,H)*(CLUSTER_R[cat]||CLUSTER_R.default);
    arr.forEach((n,i)=>{
      const angle=(2*Math.PI*i/Math.max(arr.length,1))-Math.PI/2;
      const scale=0.82+0.18*((n.r||10)/15);
      n.x=baseX+Math.cos(angle)*radius*scale;
      n.y=baseY+Math.sin(angle)*radius*scale;
    });
  });
}

let view="all", activePath=null, catFocus=new Set(), selected=null, hover=null, dim=null;
let cam={x:0,y:0,k:1}, target={x:0,y:0,k:1};
const pathNodeSet=()=>activePath?new Set((PATHS.find(p=>p.id===activePath)||{}).nodes||[]):null;

function nodeVisible(n){
  if(catFocus.size && !catFocus.has(n.c)) return false;
  const g=CATS[n.c].group;
  if(view==="tech" && g!=="tech") return false;
  if(view==="industry" && g!=="industry") return false;
  if(view==="biz" && g!=="biz") return false;
  if(view==="priority" && !PRIORITY.has(n.id)) return false;
  if(view==="deep" && !DEEP.has(n.id) && n.c!=="stack") return false;
  return true;
}

function edgeVisible(e){
  const a=nmap[e.from], b=nmap[e.to];
  return a&&b&&nodeVisible(a)&&nodeVisible(b);
}

function pathEdgeHot(e){
  if(!activePath)return false;
  const nodes=PATHS.find(p=>p.id===activePath).nodes;
  const si=nodes.indexOf(e.from), ti=nodes.indexOf(e.to);
  return (si>=0&&ti>=0) && (Math.abs(si-ti)===1 || e.type==="requires");
}

let dragging=null;
function tick(){
  cam.x+=(target.x-cam.x)*0.12; cam.y+=(target.y-cam.y)*0.12; cam.k+=(target.k-cam.k)*0.12;
}
function toScreen(n){ return {x:(n.x-W/2)*cam.k+W/2+cam.x, y:(n.y-H/2)*cam.k+H/2+cam.y}; }
function toWorld(px,py){ return {x:(px-W/2-cam.x)/cam.k+W/2, y:(py-H/2-cam.y)/cam.k+H/2}; }

const neigh={}; nodes.forEach(n=>neigh[n.id]=new Set());
edges.forEach(e=>{ neigh[e.from].add(e.to); neigh[e.to].add(e.from); });

function drawClusterLabels(){
  ctx.save();
  ctx.font='11px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign="center"; ctx.textBaseline="middle";
  Object.entries(LAYOUT).forEach(([cat,[cx,cy]])=>{
    if(catFocus.size && !catFocus.has(cat))return;
    const c=CATS[cat]; if(!c)return;
    const has=nodes.some(n=>n.c===cat&&nodeVisible(n));
    if(!has)return;
    const x=cx*W*cam.k+(W/2)*(1-cam.k)+cam.x, y=cy*H*cam.k+(H/2)*(1-cam.k)+cam.y-radiusOffset(cat);
    ctx.fillStyle="rgba(154,166,207,.55)";
    ctx.fillText(c.name,x,y);
  });
  ctx.restore();
}
function radiusOffset(cat){ return (CLUSTER_R[cat]||CLUSTER_R.default)*Math.min(W,H)*cam.k+18; }

function drawEdge(e){
  const a=nmap[e.from], b=nmap[e.to];
  const A=toScreen(a), B=toScreen(b);
  const st=EDGE_STYLES[e.type]||EDGE_STYLES.related;
  const conn=dim&&(dim===e.from||dim===e.to);
  const pathHot=pathEdgeHot(e);
  const faded=dim&&!conn;
  const pathDim=activePath&&!pathHot&&!conn;
  ctx.save();
  ctx.globalAlpha=faded?0.05:pathDim?0.12:conn||pathHot?1:st.alpha;
  ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y);
  ctx.strokeStyle=conn?"rgba(120,160,255,.7)":pathHot?"rgba(130,220,255,.75)":st.color;
  ctx.lineWidth=(conn||pathHot)?st.width+0.6:st.width;
  ctx.setLineDash(st.dash);
  ctx.stroke();
  if(e.type==="requires"&&!faded&&!pathDim){
    const ang=Math.atan2(B.y-A.y,B.x-A.x), ax=B.x-Math.cos(ang)*14, ay=B.y-Math.sin(ang)*14;
    ctx.beginPath(); ctx.moveTo(B.x,B.y); ctx.lineTo(ax-Math.cos(ang-0.45)*6,ay-Math.sin(ang-0.45)*6);
    ctx.moveTo(B.x,B.y); ctx.lineTo(ax-Math.cos(ang+0.45)*6,ay-Math.sin(ang+0.45)*6);
    ctx.strokeStyle=conn||pathHot?"rgba(130,220,255,.9)":"rgba(77,208,225,.75)";
    ctx.lineWidth=1.5; ctx.setLineDash([]); ctx.stroke();
  }
  ctx.restore();
}

function draw(){
  ctx.clearRect(0,0,W,H);
  ["related","competes","requires"].forEach(t=>edges.filter(e=>e.type===t&&edgeVisible(e)).forEach(drawEdge));
  drawClusterLabels();
  const ps=pathNodeSet();
  nodes.forEach(n=>{
    if(!nodeVisible(n))return;
    const P=toScreen(n), col=CATS[n.c].color;
    const conn=dim&&(dim===n.id||neigh[n.id].has(dim));
    const pathIn=ps&&ps.has(n.id);
    const faded=dim&&!conn;
    const pathDim=activePath&&!pathIn&&!conn;
    const r=n.r*cam.k*(n.id===hover?1.18:1);
    ctx.globalAlpha=faded?0.15:pathDim?0.28:1;
    ctx.beginPath(); ctx.arc(P.x,P.y,r+6,0,7); ctx.fillStyle=col+"22"; ctx.fill();
    ctx.beginPath(); ctx.arc(P.x,P.y,r,0,7);
    ctx.fillStyle=(n.id===selected)?"#fff":pathIn&&activePath?col:col; ctx.fill();
    if(n.p){ ctx.lineWidth=2; ctx.strokeStyle="#ffd166"; ctx.beginPath(); ctx.arc(P.x,P.y,r,0,7); ctx.stroke(); }
    if(pathIn&&activePath){ ctx.lineWidth=2; ctx.strokeStyle="#82d7ce"; ctx.beginPath(); ctx.arc(P.x,P.y,r+1,0,7); ctx.stroke(); }
    if(n.id===selected){ ctx.lineWidth=3; ctx.strokeStyle=col; ctx.beginPath(); ctx.arc(P.x,P.y,r+2,0,7); ctx.stroke(); }
    if(cam.k>0.45||n.r>=12||n.id===hover||conn||pathIn){
      ctx.globalAlpha=faded?0.25:pathDim?0.35:1;
      ctx.fillStyle=faded?"#6b78a8":"#dde6ff";
      ctx.font=`${Math.max(10,Math.min(13,11*cam.k))}px "PingFang SC","Microsoft YaHei",sans-serif`;
      ctx.textAlign="center"; ctx.textBaseline="top";
      const lbl=(n.p?"⭐":"")+(n.l.length>15?n.l.slice(0,14)+"…":n.l);
      ctx.fillText(lbl,P.x,P.y+r+3);
    }
    ctx.globalAlpha=1;
  });
}
function loop(){ tick(); draw(); requestAnimationFrame(loop); }

// ====== 交互 ======
let dragMoved=false, panStart=null;
function pickNode(px,py){ for(let i=nodes.length-1;i>=0;i--){ const n=nodes[i]; if(!nodeVisible(n))continue;
  const P=toScreen(n), r=n.r*cam.k+4; if((px-P.x)**2+(py-P.y)**2<=r*r) return n; } return null; }
cv.addEventListener("mousedown",e=>{ const r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  const n=pickNode(px,py); dragMoved=false; if(n)dragging=n; else panStart={x:e.clientX,y:e.clientY,cx:target.x,cy:target.y}; });
window.addEventListener("mousemove",e=>{ const r=cv.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top;
  if(dragging){ const w=toWorld(px,py); dragging.x=w.x; dragging.y=w.y; dragging.vx=0;dragging.vy=0; dragMoved=true; return; }
  if(panStart){ target.x=panStart.cx+(e.clientX-panStart.x); target.y=panStart.cy+(e.clientY-panStart.y); dragMoved=true; return; }
  const n=pickNode(px,py); hover=n?n.id:null; dim=hover; cv.style.cursor=n?"pointer":"grab";
  const tip=document.getElementById("tip");
  if(n){ tip.style.display="block"; tip.style.left=(px+16)+"px"; tip.style.top=(py+12)+"px";
    tip.innerHTML=`<b style="color:${CATS[n.c].color}">${n.p?"⭐ ":""}${n.l}</b><br><span style="color:#9aa6cf;font-size:11px">${CATS[n.c].name}</span>`;
  } else tip.style.display="none"; });
window.addEventListener("mouseup",()=>{ if(dragging&&!dragMoved)openDetail(dragging); else if(panStart&&!dragMoved)closeDetail();
  dragging=null; panStart=null; });
cv.addEventListener("wheel",e=>{ e.preventDefault(); const f=e.deltaY<0?1.12:0.89; target.k=Math.max(0.3,Math.min(3,target.k*f)); },{passive:false});
zin.onclick=()=>target.k=Math.min(3,target.k*1.25);
zout.onclick=()=>target.k=Math.max(0.3,target.k*0.8);

// ====== 详情面板 ======
function openDetail(n){
  selected=n.id; dim=n.id;
  document.getElementById("detail").classList.add("open");
  const c=CATS[n.c];
  document.getElementById("dcat").innerHTML=`<span class="dot" style="background:${c.color};color:${c.color}"></span>${c.name}`;
  document.getElementById("dtitle").innerHTML=n.l+(n.p?'<span class="d-star">⭐ 优先必修</span>':'');
  const linkBtn=(id,lbl,col)=>`<a data-go="${id}" style="border-color:${col}55">${lbl}</a>`;
  const reqs=(n.req||[]).filter(r=>nmap[r]).map(r=>linkBtn(r,nmap[r].l,"#4dd0e1")).join("");
  const rels=(n.rel||[]).filter(r=>nmap[r]).map(r=>linkBtn(r,nmap[r].l,"#9aa6cf")).join("");
  const cmps=(n.cmp||[]).filter(r=>nmap[r]).map(r=>linkBtn(r,nmap[r].l,"#ff6b6b")).join("");
  const blk=(lbl,col,txt)=>txt?`<div class="d-block"><div class="lbl" style="color:${col}">${lbl}</div><div class="txt">${esc(txt)}</div></div>`:"";
  document.getElementById("dbody").innerHTML=`
    ${blk("学什么","#4dd0e1",n.def)}
    ${blk("为什么重要","#06d6a0",n.why)}
    ${blk("局限与陷阱","#ff6b6b",n.limits)}
    ${blk("业界方向","#5b8cff",n.frontier)}
    ${blk("突破思路 · 新范式","#b388ff",n.breakthrough)}
    ${blk("怎么学 · 外部资源","#ffd166",n.how)}
    ${reqs?`<div class="d-block"><div class="lbl" style="color:#4dd0e1">前置依赖</div><div class="rel">${reqs}</div></div>`:""}
    ${rels?`<div class="d-block"><div class="lbl" style="color:#9aa6cf">关联主题</div><div class="rel">${rels}</div></div>`:""}
    ${cmps?`<div class="d-block"><div class="lbl" style="color:#ff6b6b">对照/竞品</div><div class="rel">${cmps}</div></div>`:""}
    ${!reqs&&!rels&&!cmps?'<div class="d-block"><div class="lbl" style="color:#9aa6cf">关联</div><div class="rel"><span style="color:#6b78a8;font-size:12px">—</span></div></div>':""}`;
  document.querySelectorAll(".rel a").forEach(a=>a.onclick=()=>{ const t=nmap[a.dataset.go]; if(t){ openDetail(t);
    target.x=-((t.x-W/2)*target.k); target.y=-((t.y-H/2)*target.k);} });
}
function closeDetail(){ document.getElementById("detail").classList.remove("open"); selected=null; dim=hover; }
document.getElementById("dclose").onclick=closeDetail;
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/`([^`]+)`/g,"<code>$1</code>"); }

function syncLegend(){
  document.querySelectorAll(".leg").forEach(el=>{
    const k=el.dataset.cat;
    el.classList.toggle("act", catFocus.has(k));
    el.classList.toggle("off", catFocus.size>0 && !catFocus.has(k));
  });
}
function focusCategories(){
  const pts=nodes.filter(n=>catFocus.has(n.c));
  if(!pts.length)return;
  const mx=pts.reduce((s,n)=>s+n.x,0)/pts.length, my=pts.reduce((s,n)=>s+n.y,0)/pts.length;
  target.x=-((mx-W/2)*target.k); target.y=-((my-H/2)*target.k);
}
// ====== 图例（单击单选 · Ctrl 多选）======
const legend=document.getElementById("legend");
Object.entries(CATS).forEach(([k,c])=>{
  const cnt=nodes.filter(n=>n.c===k).length;
  const el=document.createElement("div"); el.className="leg"; el.dataset.cat=k;
  el.innerHTML=`<span class="dot" style="background:${c.color};color:${c.color}"></span><span>${c.name}</span><span class="n">${cnt}</span>`;
  el.onclick=(e)=>{
    activePath=null; dim=null;
    document.querySelectorAll(".path-btn").forEach(x=>x.classList.remove("active"));
    view="all";
    document.querySelectorAll(".chip").forEach(ch=>ch.classList.toggle("act",ch.dataset.view==="all"));
    const multi=e.ctrlKey||e.metaKey;
    if(multi){
      if(catFocus.has(k)) catFocus.delete(k);
      else catFocus.add(k);
    } else if(catFocus.size===1 && catFocus.has(k)){
      catFocus.clear();
    } else {
      catFocus.clear();
      catFocus.add(k);
    }
    if(catFocus.size) focusCategories();
    syncLegend();
  };
  legend.appendChild(el);
});

function focusPath(pathId){
  const p=PATHS.find(x=>x.id===pathId); if(!p)return;
  const pts=p.nodes.map(id=>nmap[id]).filter(Boolean);
  if(!pts.length)return;
  const mx=pts.reduce((s,n)=>s+n.x,0)/pts.length, my=pts.reduce((s,n)=>s+n.y,0)/pts.length;
  target.x=-((mx-W/2)*target.k); target.y=-((my-H/2)*target.k);
}

// ====== 学习路径 ======
const pathsEl=document.getElementById("paths");
PATHS.forEach(p=>{
  const b=document.createElement("button"); b.className="path-btn"; b.dataset.path=p.id;
  b.innerHTML=`<b>${p.title}</b><span>${p.desc}</span>`;
  b.onclick=()=>{
    document.querySelectorAll(".path-btn").forEach(x=>x.classList.remove("active"));
    if(activePath===p.id){ activePath=null; dim=null; syncLegend(); target={x:0,y:0,k:1}; return; }
    activePath=p.id; view="all"; catFocus.clear(); dim=null;
    document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("act",c.dataset.view==="all"));
    syncLegend(); b.classList.add("active"); focusPath(p.id);
  };
  pathsEl.appendChild(b);
});

// ====== 视图切换 ======
document.querySelectorAll(".chip").forEach(ch=>ch.onclick=()=>{
  document.querySelectorAll(".chip").forEach(c=>c.classList.remove("act"));
  ch.classList.add("act"); view=ch.dataset.view; activePath=null; catFocus.clear();
  document.querySelectorAll(".path-btn").forEach(x=>x.classList.remove("active"));
  syncLegend(); target={x:0,y:0,k:1}; });

// ====== 搜索 ======
const qel=document.getElementById("q");
qel.addEventListener("input",e=>{ const q=e.target.value.trim().toLowerCase();
  if(!q){ dim=null; return; }
  activePath=null; catFocus.clear(); syncLegend();
  document.querySelectorAll(".path-btn").forEach(x=>x.classList.remove("active"));
  const hit=nodes.find(n=>nodeVisible(n)&&[n.l,n.def,n.why,n.limits,n.frontier,n.breakthrough,n.how].join(" ").toLowerCase().includes(q));
  if(hit){ dim=hit.id; target.x=-((hit.x-W/2)*target.k); target.y=-((hit.y-H/2)*target.k); } });
qel.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const q=e.target.value.trim().toLowerCase();
  const hit=nodes.find(n=>n.l.toLowerCase().includes(q)); if(hit)openDetail(hit); } });

reset.onclick=()=>{ target={x:0,y:0,k:1}; activePath=null; catFocus.clear(); dim=null; view="all";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("act",c.dataset.view==="all"));
  document.querySelectorAll(".path-btn").forEach(x=>x.classList.remove("active"));
  syncLegend(); initLayout(); };

window.addEventListener("resize",resize);
resize();
loop();
</script>
</body>
</html>
