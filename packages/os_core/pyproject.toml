[project]
name = "agent-os-core"
version = "0.1.0"
description = "Governed task and run kernel for Agent OS."
requires-python = ">=3.11"
dependencies = [
    "agent-os-contracts==0.1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
