[project]
name = "agent-os-contracts"
version = "0.1.0"
description = "Canonical versioned contracts for Agent OS."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13,<3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
