[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canonical-lib"
version = "0.1.0"
description = "A small canonical Python library fixture for R-SRL-1."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/canonical_lib"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["src"]
