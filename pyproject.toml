[project]
name = "autonomous-agent-core"
version = "0.0.1"
description = "Agent OS dual-track monorepo: product runtime plus evidence-gated autonomous-agent research."
requires-python = ">=3.11"
dependencies = [
    "agent-os-contracts==0.1.0",
    "agent-os-core==0.1.0",
    "sqlglot==30.13.0",
]

[project.scripts]
agent-os-runtime = "apps.runtime_daemon.__main__:main"
agent-os-work = "apps.cli.__main__:main"

[project.optional-dependencies]
product-test = [
    "pydantic>=2.10,<3",
    "pytest>=9,<10",
    "pyright>=1.1.410,<2",
    "pyyaml>=6,<7",
    "ruff>=0.14,<1",
    # Test-time only: powers the optional, default-off Ed25519 signature
    # verification scaffold (packages/os_core/.../distribution/signature_verify.py)
    # and its hermetic test. NOT a runtime dependency of the installed tool.
    "cryptography>=43,<56",
]
# Optional OS-keychain backend for the terminal provider credential store
# (no argv exposure). Without it the runtime falls back to the `security` CLI
# and then to the environment.
keyring = [
    "keyring>=24,<26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aac*", "envs*", "apps*", "domain_packs*"]
exclude = ["packages*", "tests*", "product_evals*", "research*"]

[tool.setuptools.package-data]
"apps.api_server" = ["*.html"]

[tool.uv.workspace]
members = ["packages/contracts", "packages/os_core"]

[tool.uv.sources]
agent-os-contracts = { workspace = true }
agent-os-core = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
    "packages/contracts/src",
    "packages/os_core/src",
]
# `quarantine(reason=...)` marks an offline-deterministic test that cannot run in this
# repo's CI because it depends on an asset this repo does not materialize (a live provider
# key, a Docker daemon + pinned image, or the cross-repo runner worktree pinned at a
# commit). The conftest hook turns each such mark into a skip that ALWAYS carries its
# reason; there is no bare skip and no deleted test. Un-quarantine only when the named
# asset is available and the test re-confirms green.
markers = [
    "quarantine: offline test gated on an asset this repo does not ship; reason= states what is missing and when it can be lifted",
]

[tool.pyright]
pythonVersion = "3.11"
include = [
    "domain_packs/developer_agent/shell_denial.py",
    "packages/contracts/src",
    "packages/os_core/src",
    "product_evals/srl_e2e_falsifier",
    "product_evals/terminal_agent_eval",
    "tests/product",
    "tests/product_eval/test_srl_e2e_contracts.py",
    "tests/product_eval/test_srl_e2e_harness.py",
    "tests/product_eval/test_srl_docker_exec.py",
    "tests/product_eval/test_srl_e2e_falsifier_docker_exec_wiring.py",
    "tests/product_eval/test_terminal_agent_eval.py",
    "tests/product_eval/test_terminal_agent_eval_l1.py",
    "tests/product_eval/test_terminal_agent_eval_live.py",
    "tests/product_eval/test_terminal_coding_eval.py",
    "tests/product_eval/test_terminal_coding_eval_live.py",
    "tests/research/r_srl_1",
]
extraPaths = [
    "packages/contracts/src",
    "packages/os_core/src",
]
