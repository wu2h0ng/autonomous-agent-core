[project]
name = "autonomous-agent-core"
version = "0.0.1"
description = "Agent OS dual-track monorepo: product runtime plus evidence-gated autonomous-agent research."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
product-core = [
    "pydantic>=2.13,<3",
]
product-test = [
    "pytest>=9,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "src",
    "packages/contracts/src",
    "packages/os_core/src",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
    "packages/contracts/src",
    "packages/os_core/src",
]

[tool.pyright]
pythonVersion = "3.11"
include = [
    "packages/contracts/src",
    "packages/os_core/src",
    "tests/product",
]
extraPaths = [
    "packages/contracts/src",
    "packages/os_core/src",
]
