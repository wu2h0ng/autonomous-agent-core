version: 3
date: "2026-08-11"
status: "G7_LOCAL_BOUNDED_INTEGRATION_CANDIDATE / UNPUSHED / UNMERGED / UNRELEASED"
task_id: "T-P-OS-SPINE-1"
depends_on: "T-P-OS-SPINE-0_ACCEPTED"
authority:
  product_blueprint: "docs/AGENT-OS-PRODUCT-BLUEPRINT.md"
  architecture_packet: "docs/architecture/T-P-OS-SPINE-0-ARCHITECTURE-PACKET.md"
  cross_repository_adr: "docs/adr/ADR-0054-one-time-data-agent-history-migration.md"
  research_audit: "docs/research/AGENT-OS-RESEARCH-GAP-AND-BOTTLENECK-AUDIT-2026-07-10.md"

decision:
  selected_option: "B"
  strategy: "history_safe_one_time_subtree_then_modular_monolith_extraction"
  runtime_topology: "single Agent OS monorepo; no cross-repo runtime imports"
  scope: "SPINE-1 successor; not a SPINE-0 acceptance requirement"
  implementation_authorized: true
  migration_authorized: true
  push_authorized: false
  main_merge_authorized: false
  release_authorized: false

donor:
  repository: "ai-native-business-data-agent-os"
  local_design_time_path: "../ai-native-business-data-agent-os"
  observed_design_time_short_ref: "a406508"
  execution_ref: "94e2b5918d12d6592f34f3b14c44c29038a74029"
  import_prefix: "_migration/data-agent-os"
  import_mode: "direct no-squash subtree only after full-history PASS; otherwise filtered migration mirror or ABORT"
  provenance_manifest: "REQUIRED_BEFORE_IMPORT"
  history_safety_report: "REQUIRED_BEFORE_IMPORT"
  staging_runtime_imports_allowed: false

execution_result:
  history_safety_verdict: PASS
  import_commit: "78f4f6134bf9c1620ba5a1ef70000355f9c88ac8"
  post_extraction_verification: "docs/migration/SPINE-1-POST-EXTRACTION-VERIFICATION.yaml"
  staging_removal_commit: "43ccbec54d603c3022ecb517f8936f0ffa849e64"
  retained_data_capabilities:
    - "data.query.safe"
    - "data.report.observe"
    - "data.action.propose"
  parked_without_live_consumer:
    - "donor advanced semantic catalog and natural-language intent runtime"
    - "donor knowledge lifecycle"
    - "donor Customer-0/content-commerce assets"
    - "business action execution connectors"
  claim_boundary: "Local bounded candidate only; no push, merge, release, production, commercial or autonomy claim."

history_safety:
  scan_scope:
    - "All commits, trees and blobs reachable from the pinned donor ref and every ref selected for migration."
    - "Deleted historical files remain in scope."
  required_checks:
    - "Secret, token, credential and high-entropy material scan with pinned scanner/config versions."
    - "Customer data, PII and sensitive raw-data inventory."
    - "Oversized binary and Git LFS object inventory."
    - "License and provenance exceptions relevant to redistribution."
  report_fields:
    - "donor full SHA and scanned refs"
    - "scanner commands, versions and configuration digests"
    - "finding paths/object ids without reproducing secret values"
    - "false-positive adjudicator identity and rationale"
    - "report digest"
    - "verdict: PASS, REMEDIATE or ABORT"
  dispositions:
    PASS: "Direct no-squash import from the scanned donor ref is eligible."
    REMEDIATE: "Rotate/revoke exposed credentials, construct a filtered migration mirror, record old-to-new commit mapping, rescan, and import only after PASS."
    ABORT: "Do not import donor history; return to founder/CTO for a new decision."
  invariant: "No donor commit or blob becomes reachable from the Agent OS repository before PASS."

target:
  apps:
    - "apps/api_server"
    - "apps/worker"
    - "apps/workspace"
    - "apps/cli"
  packages:
    - "packages/contracts"
    - "packages/os_core"
    - "packages/persistence"
    - "packages/sdk"
  domain_packs:
    - "domain_packs/data_agent"
    - "domain_packs/developer_agent"
    - "domain_packs/personal"
  research_paths_preserved:
    - "src/aac"
    - "experiments"

mapping:
  - id: "M-CONTRACTS-GENERIC"
    disposition: "PROMOTE_AFTER_RECONCILIATION"
    source_capability_families:
      - "AgentRunContext and generic runtime identity/context contracts"
      - "ToolSpec and generic capability metadata"
      - "approval, trace, feedback and operation envelope contracts"
      - "tenant/user/workspace identifiers without business-data semantics"
    target: "packages/contracts"
    conditions:
      - "Reconcile naming and versioning with Goal, Commitment, WorkflowGraph, AgentRun, ActionContract and Outcome contracts."
      - "Remove Metric, SemanticObject, DataProduct, SQL and business-operation fields from generic types."
      - "Characterization and canonical round-trip tests pass."

  - id: "M-RUNTIME-GENERIC"
    disposition: "PROMOTE_AFTER_RECONCILIATION"
    source_capability_families:
      - "agent runtime lifecycle"
      - "checkpoint and resume behavior"
      - "runtime policy gate"
      - "corrigibility and pause/override behavior"
      - "approval and trace services"
      - "tenant/RBAC and usage boundaries"
      - "workflow persistence"
    target: "packages/os_core"
    conditions:
      - "Split advisory DecisionPolicy from deterministic PolicyKernel."
      - "Bind correction epoch, worker lease fence, action digest and policy version."
      - "No domain-specific branch or data contract remains in os_core."
      - "Real call path, denial path and bypass-sensitive tests exist."

  - id: "M-PERSISTENCE"
    disposition: "PROMOTE_AND_SIMPLIFY"
    source_capability_families:
      - "PostgreSQL repositories"
      - "workflow and checkpoint storage"
      - "runtime traces and feedback persistence"
    target: "packages/persistence"
    conditions:
      - "Adopt append-only TaskEvent, projections, leases, fencing, idempotency and transactional outbox."
      - "Store CredentialRef metadata only; no secret bytes."
      - "Cross-tenant query isolation tests pass."

  - id: "M-API"
    disposition: "REUSE_SHELL_REBIND_TO_AGENT_OS_CONTRACTS"
    source_capability_families:
      - "FastAPI application shell"
      - "runtime/task endpoints"
      - "public resume and trace surfaces where policy-safe"
    target: "apps/api_server"
    conditions:
      - "API calls packages/os_core rather than donor runtime modules."
      - "Auth, tenant, policy and redaction remain non-bypassable."
      - "No Data Agent product identity is hard-coded into generic routes."

  - id: "M-WORKER"
    disposition: "EXTRACT_AND_HARDEN"
    source_capability_families:
      - "background runtime/checkpoint execution"
      - "provider/tool dispatch patterns"
    target: "apps/worker"
    conditions:
      - "PostgreSQL lease/fencing and restart recovery are authoritative."
      - "Unknown external outcomes are reconciled rather than blindly retried."
      - "CapabilityBroker is the only side-effect dispatch path."

  - id: "M-WORKSPACE"
    disposition: "REUSE_PRODUCT_SHELL"
    source_capability_families:
      - "Next.js application shell"
      - "task/run/approval/trace views"
    target: "apps/workspace"
    conditions:
      - "Default entry becomes persistent Task Workspace, not a Data Agent-only dashboard."
      - "UI consumes public Agent OS API and real runtime state."
      - "Data-specific views register through domain-pack extension slots."

  - id: "M-SDK"
    disposition: "EXTRACT_GENERIC_AUTHORING_SURFACE"
    source_capability_families:
      - "tool/provider/connector contracts"
      - "workflow and domain extension interfaces"
    target: "packages/sdk"
    conditions:
      - "SDK cannot write policy, approval or correction authority."
      - "All registered capabilities declare schema, risk, idempotency, credentials and side-effect guarantees."

  - id: "M-DATA-AGENT"
    disposition: "MOVE_TO_DOMAIN_PACK"
    source_capability_families:
      - "trusted business-data loop"
      - "MetricContract and SemanticObject"
      - "ProviderContract and DataProduct"
      - "SQL Safety and query planning"
      - "EvidenceChain and business action proposals"
      - "data-specific connectors, evaluators and workflow templates"
    target: "domain_packs/data_agent"
    conditions:
      - "Use shared Goal, Commitment, WorkflowGraph, AgentRun, policy, correction, event and outcome contracts."
      - "Map Data Agent EvidenceChain into generic Agent OS evidence primitives; SQL, MetricContract, QueryResult and DataProduct fields stay data_agent-scoped."
      - "Preserve existing SQL safety, evidence and approval negative-path tests."
      - "No forked provider, task runtime, identity or credential subsystem remains."

  - id: "M-DEVELOPER-AGENT"
    disposition: "CONSUME_ACCEPTED_SPINE_0_NO_DONOR_MAPPING"
    source_capability_families:
      - "none required from donor"
    target: "domain_packs/developer_agent"
    conditions:
      - "SPINE-0 developer golden path is already accepted before migration begins."
      - "No donor file is promoted into developer_agent by implication."

  - id: "M-GOVERNANCE-DOCS"
    disposition: "KEEP_IN_GIT_PROVENANCE_BY_DEFAULT"
    source_capability_families:
      - "release plans, branch gates, internal workflow and historical product definitions"
    target: "git history; selectively re-home only behavior-explanatory records"
    conditions:
      - "Do not copy the complete legacy governance tree into current authoritative docs."
      - "Re-home only decisions required to explain retained implementation behavior."
      - "Do not present internal development workflow as Agent OS customer capability."
      - "Every re-homed superseded identity record carries HISTORICAL_NON_AUTHORITY metadata."

  - id: "M-RESEARCH-QUARANTINE"
    disposition: "KEEP_IN_RESEARCH_TRACK"
    source_capability_families:
      - "src/aac/execution_bridge.py"
      - "src/aac/production_entry.py"
      - "src/aac/product_api.py"
      - "src/aac/product_engine.py"
      - "src/aac/planner.py"
      - "src/aac/commitment_ledger.py"
    target: "existing Research Track paths"
    conditions:
      - "No Product Track import."
      - "Historical results and names are not rewritten."
      - "Any future use requires ResearchCandidateManifest and product reimplementation/revalidation."

sequence_gates:
  - id: "G0-AUTHORITY-RECONCILIATION"
    requires:
      - "Parent/root product identity no longer conflicts with the final Agent OS Blueprint."
      - "C7 safety language uses non-writable/non-bypassable external authority, not unmodelability."
      - "Parent AGENTS.md, CLAUDE.md, .agent, docs/GOAL-BLUEPRINT.md and code_index.md cite the bounded ADR-0054 exception before migration execution."
      - "G0 completion is a scoped parent-repository commit; chat agreement alone is insufficient."
  - id: "G1-CROSS-REPOSITORY-AUTHORIZATION"
    requires:
      - "ADR-0054 remains Accepted and founder/CTO approved."
      - "Founder accepts the remediated architecture packet and this SPINE-1 migration map."
      - "T-P-OS-SPINE-0 acceptance evidence is complete."
  - id: "G2-DONOR-PIN-AND-HISTORY-SAFETY"
    requires:
      - "Full donor SHA recorded."
      - "Donor worktree clean or unrelated changes explicitly excluded."
      - "Provenance manifest prepared."
      - "All selected donor refs and reachable history scanned before any import."
      - "History-safety report and digest recorded without reproducing secret values."
      - "History-safety verdict is PASS; REMEDIATE must rescan a filtered mirror, and ABORT stops migration."
  - id: "G3-CHARACTERIZATION"
    requires:
      - "Donor generic/runtime and Data Agent safety tests captured before moves."
      - "Generic-vs-domain ownership inventory reviewed before import/extraction."
      - "Generated artifacts and current-worktree secret material excluded from the migration plan."
  - id: "G4-HISTORY-IMPORT"
    requires:
      - "Accepted direct donor ref or PASS-filtered mirror imported on an isolated Product Track branch."
      - "Imported ancestry, file inventory and old-to-new commit map where applicable are verified."
      - "No push or merge has occurred."
  - id: "G5-GENERIC-EXTRACTION"
    requires:
      - "Dependency direction checks pass."
      - "No domain-specific contract or conditional remains in os_core."
      - "No runtime import from staging."
  - id: "G6-DATA-PACK-EXTRACTION"
    requires:
      - "Data Agent behavior and safety characterization remain green."
      - "Data Agent uses the shared Agent OS spine."
  - id: "G7-STAGING-REMOVAL"
    requires:
      - "All retained code has target ownership and provenance."
      - "Repository-wide search finds no _migration runtime import/reference."
      - "Git history exposes only the approved donor or filtered-mirror ancestry."

verification_gates:
  provenance:
    - "Imported approved history is reachable and the original donor full SHA is documented."
    - "Filtered imports include an old-to-new commit mapping and safety-report digest."
    - "Moved files retain attributable approved history where practical."
  product_boundary:
    - "Product Track has no import from src/aac, experiments or _migration."
    - "os_core has no import from domain_packs."
  domain_independence:
    - "Core contracts contain no Metric, SQL, DataProduct or business-action semantics."
    - "Second domain registration requires no core conditional."
  behavior:
    - "Developer golden path and Data Agent seam pass the same runtime/policy/outcome path."
    - "Existing Data Agent SQL safety, evidence, approval and trace negative cases remain effective."
  security:
    - "Full reachable donor history received PASS before direct import, or the PASS-filtered mirror was imported instead."
    - "No known donor secret/customer-data blob becomes reachable in Agent OS history."
    - "No new secret file/value enters Git history, events, traces, prompts or artifacts."
    - "Tenant, approval, policy and correction bypass tests pass."
  git:
    - "Migration commits are scoped and reviewable."
    - "No direct merge/push to main without explicit founder approval."

rollback:
  before_history_import: "Delete the isolated implementation branch/worktree; no repository truth changes."
  ordinary_failure_after_safe_import: "Revert the scoped extraction/import work on the unpublished feature branch; preserve review artifacts and approved provenance."
  secret_or_sensitive_blob_after_import: "STOP and prohibit push; rotate/revoke affected credentials; remove imported refs; build and rescan a filtered mirror; reconstruct the unpublished branch. A git revert is not secret removal."
  contaminated_history_already_pushed: "Escalate to founder/Security incident handling and coordinated remote history remediation before resuming."
  during_extraction: "Revert only the failed extraction commit; do not rewrite donor or Research Track history."
  after_product_acceptance: "Use normal schema/code rollback and package-level revert; never restore cross-repo runtime coupling."

completion_claim:
  allowed_after_all_gates: "Approved Data Agent history and code have been migrated into one Agent OS monorepo with generic spine/domain-pack separation."
  forbidden:
    - "Product Done"
    - "Codex parity"
    - "general autonomous intelligence achieved"
    - "research mechanism promoted"
    - "production security proven"
