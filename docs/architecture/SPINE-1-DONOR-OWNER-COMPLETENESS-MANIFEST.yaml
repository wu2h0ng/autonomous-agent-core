# Disposition enum (maps to ADR-0054 §1 and the retirement ADR draft):
#   EXTRACTED               already present in the monorepo (a)
#   EXTRACT_TO_PACKAGE      domain-neutral -> packages/contracts or packages/os_core (b)
#   EXTRACT_TO_DOMAIN_PACK  domain-specific -> domain_packs/data_agent (b')
#   RETAIN_AS_HISTORY       stays with the donor archive as history/evidence (c)
#   DROP_SUPERSEDED         intentionally not carried forward; superseded (d)
#   DROP_OPERATIONAL        build/CI/ops scaffolding, not product behavior (d)
# status: MACHINE_VERIFIED | REVIEWED | PROPOSED_UNREVIEWED
#   MACHINE_VERIFIED  only valid for disposition EXTRACTED and only when the target path exists
#   REVIEWED          requires a `reviewed_by` identity distinct from the drafter
#   The retirement gate requires every entry to be MACHINE_VERIFIED or REVIEWED, every EXTRACT*
#   target to exist, the donor pin to match, and no REVIEWED entry without `reviewed_by`.
#   Enforced by scripts/check_spine1_donor_manifest.py --strict.

