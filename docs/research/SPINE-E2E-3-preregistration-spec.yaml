cases:
  path: product_evals/spine_e2e_3/frozen_cases.json
  digest: raw_file_sha256
  case_ids:
    - st_reverse
    - st_title
    - st_trim_lower
    - nr_sum
    - nr_max
    - nr_factorial
    - val_email
    - val_palindrome
    - val_positive_int
    - fmt_json
    - fmt_csv
    - fmt_table

contracts:
  contract_time: internally sampled once per case during prepare, shared across both arms, and persisted in prepare payload
  goal:
    fields: [goal_id, tenant_id, workspace_id, created_by, created_at, statement]
    scope: {tenant_id: "tenant:local", workspace_id: "workspace:local", created_by: "user:local"}
  commitment:
    deliverables: [subject.py patch]
    acceptance_criteria: [python -m pytest exits 0]
    authority_scopes: ["workspace:read", "workspace:write"]
    budget: {max_cost_usd: "10", max_duration_seconds: 3600, max_provider_tokens: 100000, max_tool_calls: 100}
    risk_tier: 1
    exit_conditions: [verified]
  request_inputs: {target_path: subject.py, test_command: python -m pytest}
  workflow:
    version: 1
    policy_version: policy-1
    max_replans: 0
    evaluator_refs: ["evaluator:pytest:1"]
    nodes: [read, provider, approve, apply, tests, evaluate, done]
    edges:
      - [read, provider]
      - [provider, approve]
      - [approve, apply]
      - [apply, tests]
      - [tests, evaluate]
      - [evaluate, done]
  outcome:
    evaluator_type: pytest
    evaluator_version: "1"
    threshold: 1.0
    observation_window_seconds: 3600
    evidence_requirements: [pytest-report, apply-receipt, final-workspace-digest]
  storage:
    case_root_template: evaluation/cases/{case_id}/{arm}
    workspace_template: evaluation/cases/{case_id}/{arm}/workspace
    database_template: evaluation/cases/{case_id}/{arm}/state/agent-os.sqlite3
    in_memory_database_forbidden: true

provider:
  bank_path: product_evals/spine_e2e_3/provider_responses.json
  digest: raw_file_sha256
  protocol: OpenAI-compatible local loopback
  model: spine-e2e-3-frozen
  temperature: "0"
  expected_calls_per_case_digest: 2
  rejected_attempts: exactly 0
  unknown_request: fail_closed
  deterministic_fallback: forbidden
  ambient_credentials_cleared: [OPENAI_API_KEY, AGENT_OS_RUNTIME_PROVIDER_KEY]
  semantic_headers: [authorization, content-type]
  ignored_transport_headers: [host, content-length, connection, accept-encoding, user-agent]

instrument_qualification:
  template_path: product_evals/spine_e2e_3/request_template.json
  bank_path: product_evals/spine_e2e_3/provider_responses.json
  receipt_path: product_evals/spine_e2e_3/instrument_qualification_receipt.json
  identity_source: product_evals/spine_e2e_3/identity.py
  generator_owns: [provider_model, request_digest]
  template_forbids: [model, digest, numbered_spine_identity_literal]
  canary: [wrong_bearer_rejected, derived_bearer_accepted]
  canary_ledgers: scratch_only
  formal_ledger_alias: fail_closed
  receipt_source_binding:
    - bank_generator.py
    - instrument_qualification.py
    - provider_bank.py
    - spine_identity.py
  receipt_reverification: rerun_canary_and_compare_exact_receipt

recovery:
  lease_seconds: 300
  interrupt_seam: literal stop_after_node=apply
  probe_recover_stale_lease: false
  resume_recover_stale_lease: false
  terminal_replay_recover_stale_lease: false
  duplicate_provider_calls_allowed: 0
  duplicate_apply_receipts_allowed: 0

timing:
  evidence_level: local_same_boot_monotonic_self_attestation_v1
  probe:
    anchor: interrupt_batch_started.mono_before_ns
    sample: probe_active_lease_completed.mono_after_ns
    maximum_seconds: 60
  resume_minimum:
    anchor: interrupt_batch_completed.mono_after_ns
    sample: resume_started.mono_before_ns
    minimum_seconds: 360
  resume_maximum:
    anchor: prepare_started.mono_before_ns
    sample: resume_completed.mono_after_ns
    maximum_seconds: 1800
  no_clock_injection: true
  no_threshold_override: true
  utc_fallback: forbidden

platform_identity:
  Darwin:
    boot: sysctl -n kern.bootsessionuuid
    host: IOPlatformExpertDevice.IOPlatformUUID
  Linux:
    boot: /proc/sys/kernel/random/boot_id
    host: /etc/machine-id
  persistence: context-salted lowercase SHA-256 only
  raw_identity_persistence: forbidden
  continuity: [boot_hash, host_hash, monotonic_implementation, adjustability, resolution]
  unsupported_or_missing: fail_closed

context_binding:
  algorithm: canonical_sha256(exact_16_key_mapping)
  keys:
    - schema
    - experiment_id
    - run_id
    - target_head
    - prereg_lock_sha256
    - spec_sha256
    - mechanism_manifest_sha256
    - corpus_sha256
    - provider_bank_sha256
    - provider_template_sha256
    - qualification_receipt_sha256
    - evaluator_sha256
    - runner_common_dir
    - runner_head
    - request_row_sha256
    - approval_row_sha256
  mechanism_manifest_sha256: canonical_sha256(sorted lock mechanism_files mapping)
  corpus_sha256: raw SHA-256 of frozen_cases.json
  provider_bank_sha256: raw SHA-256 of provider_responses.json
  provider_template_sha256: raw SHA-256 of request_template.json
  qualification_receipt_sha256: raw SHA-256 of instrument_qualification_receipt.json
  evaluator_sha256: raw SHA-256 of protocol.py
  target_head_source: prereg.lock
  spec_sha256_source: prereg.lock

