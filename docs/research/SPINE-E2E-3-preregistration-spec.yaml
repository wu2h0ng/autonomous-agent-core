phase_protocol:
  order: [prepare, interrupt_batch, probe_active_lease, resume, adjudicate]
  ledger_records_per_phase: [started, completed]
  failed_record_terminal: true
  partial_or_replay: INVALID_PARTIAL_PHASE
  payload_write: O_EXCL write-once before completed record
  prepare_has_no_prior_anchor: true
  later_side_effect_requires_prior_exact_runner_anchor: true
  adjudication_payload_completed_phases: [prepare, interrupt_batch, probe_active_lease, resume]
  finalize_verifies_adjudicate_completion_and_anchor: true
  finalize_product_side_effects: forbidden

anchors:
  schema_version: spine-e2e-3-anchor-request-v1
  event_type: EVIDENCE_APPENDED
  agent_id: codex-cto
  summary: SPINE_PHASE_ANCHOR phase=<phase> request_sha256=<64hex>
  artifact_equals_evidence_ref: true
  fields:
    - phase_record_head_sha256
    - phase_ledger_sha256
    - provider_ledger_head_sha256
    - provider_ledger_sha256
    - payload_sha256
    - boot_id_sha256
    - host_id_sha256
    - context_sha256
    - runner_common_dir
    - runner_branch
    - runner_head
    - approval_request_id
    - permission_action
    - request_row_sha256
    - approval_row_sha256

adjudication:
  result_verdicts: [PASS, NOT_PASS, INVALID]
  pass_rule: all 12 cases PASS and no invalidity code
  invalidity_precedence: true
  reason_codes:
    - INPUT_SCHEMA
    - INPUT_SCHEMA_VERSION
    - CASE_MANIFEST
    - CASE_COVERAGE
    - BINDINGS_SCHEMA
    - BINDING_DRIFT
    - PHASE_SCHEMA
    - PHASE_DRIFT
    - RUNNER_ANCHOR_COVERAGE
    - RUNNER_ANCHOR_DRIFT
    - RECOVERY_CONFIGURATION
    - MISSING_CASE:<case_id>
    - CASE_SCHEMA:<case_id>
    - CASE_INSTRUMENTATION:<case_id>
    - SNAPSHOT_SCHEMA:<case_id>
    - PROBE_MUTATION:<case_id>
    - PROVIDER_COUNT:<case_id>
    - WORKFLOW_RELATION:<case_id>
    - TARGET_RELATION:<case_id>
    - WORKSPACE_RELATION:<case_id>
    - LEASE_FENCE:<case_id>
    - DUPLICATE_EFFECT:<case_id>
    - TERMINAL_REPLAY:<case_id>
    - PRODUCT_FAILURE:<case_id>
  phase_failure_codes:
    - INVALID_GIT_STATE
    - INVALID_CONTEXT
    - INVALID_BINDING
    - INVALID_PERMISSION
    - INVALID_RUNNER_ANCHOR
    - INVALID_PLATFORM_IDENTITY
    - INVALID_TIMING
    - INVALID_PARTIAL_PHASE
    - INVALID_PROVIDER
    - INVALID_PRODUCT_PROTOCOL
    - INVALID_WRITE_ONCE
    - INVALID_INTERNAL_ERROR
  unknown_exception_mapping: INVALID_INTERNAL_ERROR

result_contract:
  path: evaluation/result.json
  write_once: true
  required_integrity: [spec_sha256, prereg_lock_sha256, context_sha256, phase_ledger_sha256, provider_ledger_sha256]
  external_final_check: workflow runner prereg verify --result
  rerun_or_rescue: forbidden
  preserve_not_pass_or_invalid: true

review_and_freeze:
  sequence:
    - founder approved_session permission decision
    - clean candidate commit
    - RR-0031 controlled delta review and verify
    - exact-content manifest verify
    - independent content review
    - independent architecture review
    - freeze by identity distinct from reviewer
    - prereg verify
    - one real run
  builder_reviewer_distinct: true
  reviewer_freezer_distinct: true
  frozen_gate_edit_after_run_start: invalidates_result


successor_instrument:
  predecessor_result: immutable_INVALID_not_authority
  observation_variable: ordered_workspace_apply_patch_idempotency_keys
  receipt_filter:
    event_type: ACTION_RECEIPT_RECORDED
    connector_id: workspace.apply_patch
    idempotency_key: required_non_empty_string
    malformed_identity: fail_closed
  interrupt_relation: prior_sequence_exact_prefix_and_exactly_one_new_key
  resume_relation: complete_apply_key_sequence_byte_for_byte_equal
  allowed_non_apply_change: workspace.run_tests_receipt_may_increase_total_receipt_count
  forbidden: [second_apply, replaced_apply_key_equal_count, missing_connector, missing_or_blank_apply_key]

evaluation_genesis_preflight:
  before_first_phase_ledger_write: true
  product_interpreter_imports: [agent_os_core, agent_os_contracts]
  fixed_runner_interpreter_imports: [yaml]
  failure_requires_absent_ledgers: [evaluation/phases.jsonl, evaluation/provider_calls.jsonl]
