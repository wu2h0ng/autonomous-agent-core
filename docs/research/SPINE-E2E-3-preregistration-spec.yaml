prereg_id: SPINE-E2E-3
status: DRAFT_NOT_REVIEWED_NOT_FROZEN_NOT_RUN
schema_version: spine-e2e-3-prereg-v1
claim_class: deployment-product
track: product_eval
experiment_id: SPINE-E2E-3
run_id: spine-e2e-3-20260713
builder_id: codex-cto
reviewed_by: spine-e2e-3-content-reviewer-v2
target_repo: autonomous-agent-core
bounded_claim: >-
  On one frozen local same-boot run, all twelve public Agent OS developer tasks
  preserve the same verified terminal projection after a real interrupted apply,
  an active-lease denial, natural lease expiry, restart, and replay, with no
  duplicate provider call or apply receipt.
claim_exclusions:
  - no multi-day or multi-week advantage claim
  - no 7x24 fleet or physical exactly-once claim
  - no live-provider robustness or coding-agent parity claim
  - no autonomy, continual-learning, self-evolution, AGI, or research verdict

mechanism:
  name: SPINE-E2E-3 public recovery instrument
  channel_claim: other(product-eval)
  files:
