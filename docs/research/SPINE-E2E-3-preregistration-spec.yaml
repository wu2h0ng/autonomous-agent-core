  request_row_sha256: f42209feaa630e99e02901e2128d6ccfba606b3217d7021686d766bb95e25239
  approval_row_sha256: cb7af0b5ef52e545430664272050db3950036029b413e91a72d0bf2493ca7606
  request_timestamp: "2026-07-13T08:54:55+00:00"
  approval_timestamp: "2026-07-13T08:55:03+00:00"
  decision: approved_session
  decided_by: founder
  exactly_one_request_and_approval: true
  later_conflicting_decision_forbidden: true
  approved_once_forbidden: true
