reviewed_by: PRE_FREEZE_REVIEWER_UNBOUND
target_repo: autonomous-agent-core
bounded_claim: >-
  On one frozen local same-boot run, the runner-contract-qualified successor
  executes all twelve public Agent OS developer tasks and preserves the same
  verified terminal projection after a real interrupted apply, an active-lease
  denial, natural lease expiry, restart, and replay, with no duplicate provider
  call or apply receipt.  Qualification includes a real subprocess invocation of
  the pinned runner that exports its TeamEvent JSON Schema, emits a governed
  event, and binds the schema plus normalized fixture into the combined
  qualification receipt before genesis.
claim_exclusions:
  - no multi-day or multi-week advantage claim
  - no 7x24 fleet or physical exactly-once claim
  - no live-provider robustness or coding-agent parity claim
  - no autonomy, continual-learning, self-evolution, AGI, or research verdict

