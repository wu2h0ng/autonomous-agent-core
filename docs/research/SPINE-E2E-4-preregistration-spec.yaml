  digest: raw_file_sha256
  protocol: OpenAI-compatible local loopback
  model: spine-e2e-4-frozen
  temperature: "0"
  expected_calls_per_case_digest: 2
  rejected_attempts: exactly 0
  unknown_request: fail_closed
  deterministic_fallback: forbidden
  ambient_credentials_cleared: [OPENAI_API_KEY, AGENT_OS_RUNTIME_PROVIDER_KEY]
  semantic_headers: [authorization, content-type]
