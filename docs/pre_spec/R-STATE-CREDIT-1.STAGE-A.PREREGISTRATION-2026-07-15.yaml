      - model_revision_or_snapshot
      - temperature
      - top_p
      - max_output_tokens
      - request_timeout_seconds
      - system_prompt_sha256
      - tool_schema_sha256
    fixed_decoding:
      temperature: 0
      top_p: 1
      max_output_tokens: 256
    production_client_implementation: experiments.r_state_credit_1.ark_responses_actor.ArkResponsesActorClient
    candidate_base_profile: https://ark.cn-beijing.volces.com/api/plan/v3
    candidate_model_alias: ark-code-latest
    credential_env_ref: ARK_API_KEY
    cli_transport: FORBIDDEN
    connectivity_canary: UNRUN
    exact_model_revision_or_snapshot: UNCONFIRMED_UNTIL_CONNECTIVITY_CANARY
    provider_call_authorized: false
  CORPUS_BINDING:
