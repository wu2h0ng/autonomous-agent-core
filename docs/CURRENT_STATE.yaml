  refresh_merge_2026_09_14: "Founder-authorized refresh-merge PUSHED origin/main ee6986c7 -> 83ba0eb3, now containing BOTH cross-provider-approved slices: (a) SRL TaskActivationGate (+ trusted-producer I-23 via ActivationAuthority.producer_instance_id; fail-closed for missing/empty/whitespace producer, forged goal producer and cross-mandate; TASK_IDENTITY_CONFLICT on conflicting re-activation; idempotent for identical input) and (b) the contract-inference outcome-contract inferencer (+ OutcomeEvaluatorRegistry; fail-closed current_outcome on unknown/failed evaluators; predicate-set scope validation; operator-authenticated pre-endorsement via PredicateConfirmation records). Content-preserving vs the approved heads (SRL delta hash 5d7e5f8eccd9573fb13f8debb0f701df2a33d783; contract-inference delta hash d95786f628f569ee6de26b23ffe1f334788455e8). Merged head full tests/product (product-test + tui extras) 23 failed / 2542 passed / 1 skipped = byte-identical to the same-tip origin/main baseline (zero new); Ruff clean; Pyright 0. The mid-window freeze did NOT hold (origin/main advanced aeb88c73 -> ee6986c7; the first push was correctly rejected as non-fast-forward, then re-pinned and pushed non-force). Merge receipt: .agent_runs/priority-execution-20260913/MERGE-RECEIPT-20260914.md. No release/tag/deploy and no capability, autonomy, self-improvement or HCW claim."
  terminal_supported_path_2026_09_13: "cli-ts (TS/Ink, apps/cli-ts) = the unique supported interactive terminal chat UI (founder-ratified 2026-09-13). It is also the single user entry: npm bin `agentos` / `agent-os` / `agent-os-ts` (interactive TUI + headless `-p ... --output-format json`), auto-starting the Python governance daemon `agent-os-runtime` on demand. 2026-09-15 (founder option c): the frozen textual TUI path B (apps/cli/tui_app.py + tui_controller.py), its tests, scripts/m2_tui_live_evidence.py and the `textual` extra were DELETED; the Python `agent` / `agent-os` console scripts were REMOVED (the npm bins replace them). Path A's chat/headless (packages/os_core/src/agent_os_core/agent_cli.py + run_agent_cli + the agent/chat CLI) was DELETED 2026-09-15 (Stage 2f1); the canonical headless entry is `agentos -p`. apps/cli/__main__.py is being slimmed to the local-authority CLI (work/selfdev) in Stage 2f2-2f3. No Autonomy/parity/release claim."
  provider_terminal_add_2026_09_14: "Terminal provider add/config (Slice 1) MERGED via PR #22 (fcbe6ef9): surface routes GET /v1/surface/provider (redacted status) and POST /v1/surface/provider (configure; operator bearer-authenticated), cli-ts /provider command, and SurfaceProviderStatus/SurfaceProviderConfigureCommand contracts. The API key is read from AGENT_OS_PROVIDER_KEY in the CLI environment (never typed into the composer -> not in history/state/transcript), sent once over loopback, and held by the daemon in an in-memory env resolver; it is never persisted to DB/state/artifacts/logs and status is redacted to credential_ref_id. Per-attempt managed resolver key + set->smoke->commit under the configuration lock, so a failed reconfigure cannot clobber the live provider. Unsupported endpoint_class fails closed; endpoint must be HTTPS or loopback HTTP and must not embed userinfo. Does not alter permit/approval/C7. Independent subagent review R1 APPROVE_WITH_CONDITIONS -> remediated -> R2 APPROVE."
  provider_native_and_persistence_2026_09_14: "Provider compatibility + persistence arc (Slices 2-5), all MERGED. Anthropic Messages (Slice 2) PR #24 (36b911ef): AnthropicMessagesProvider (POST {base_url}/v1/messages, x-api-key + anthropic-version, system/messages/tools + tool_use/tool_result mapping). OpenAICompatibleProvider now exposes a transport seam (_request_body/_transport_headers/_parse_completion/_endpoint_path + DEFAULT_ENDPOINT_PATH/EXPECTED_ENDPOINT_CLASS/ADAPTER_KIND); the OpenAI path is unchanged. Gemini native (Slice 2b) PR #26 (1702c7d2): GeminiGenerativeProvider (google-generative), plus an optional `keyring` extra (no-argv store). Persistence (Slice 3) PR #25 (3c8d858e, founder decision C): non-secret config {base_url, model, endpoint_class, credential_env} persisted to ~/.agent-os/provider.json (0600, repo-external; the API key is NEVER written there); key in the OS keychain (keyring preferred, macOS `security` fallback) with an env fallback; daemon startup auto-loads when a key resolves (no network smoke, no re-persist); keychain subprocess calls bounded at 5s; product tests hermetic (autouse conftest). Native streaming (Slice 4) PR #27 (aeb88c73): Anthropic Messages SSE + Gemini streamGenerateContent?alt=sse, normalized to the same on_text_delta/proposal/usage; thinking/thought routed to on_reasoning_delta. Provider UX + headless (Slice 5) PR #29 (9e280458): /provider shows persisted + key_source (enum keychain|env|none); /provider clear removes the persisted config + stored credential (running daemon keeps its provider until restart); headless `agent-os-ts provider status|set|clear` (key from AGENT_OS_PROVIDER_KEY, args validated before connecting); surface contract gains persisted/key_source + SurfaceProviderClearCommand + POST /v1/surface/provider/clear (bearer + principal scope). Honest limits: Anthropic/Gemini streaming verified only against hermetic stubs, not live vendors; macOS `security -w` exposes the key via argv unless the keyring extra is installed; no pricing source (cost UNKNOWN); max_tokens hardcoded for Anthropic; no per-vendor rate-limit/retry policy. No permit/approval/C7 change; the API key is never stored in local CLI state."
  stage2_path_a_migration_2026_09_15: "Stage 2 (founder option c) plan recorded in docs/product/STAGE2-PATH-A-MIGRATION-PLAN-2026-09-15.md. Stage 2a DONE (2026-09-15): the canonical headless entry is `agentos -p <prompt> --output-format json|text|stream-json`; agent_cli.py + apps/cli/__main__._agent/_chat are marked DEPRECATED pointing to it; the chat/headless test-migration mapping is recorded (cli-ts headless.test.ts already carries the frozen exit-code table 0/1/2/3). Path A remains present until Stage 2f; Stage 2b DONE (2026-09-15): cli-ts headless `agent-os session show|pause|resume|correct` added (reuses the existing surface routes; test/session-command.test.ts). Stage 2c DISPOSITION (founder option B, 2026-09-15): governance/admin operations (work/run, agent-status/-answer/-correct/-resume, mandate, task, workflow, selfdev) are API-only and are NOT ported into the terminal; the terminal keeps the agent loop (interactive + headless) + config/session only, matching mainstream. Surface protocol stays v1.1. Pre-2f gate: run/correct need HTTP admin endpoints (or explicit park). Stage 2d/2e DISPOSITION (2026-09-15): mandate/task/workflow/selfdev are API-only (same option B); HTTP admin coverage verified as broad (tasks create/list/show/commit/signals/replan/compensate, mandate task-links/outcome-portfolio/responsibility-view/help-requests, workflows/validate, workspace/provider, data-agent query, environment-bindings). 2f-prep progress (2026-09-15): mandate-bootstrap/attach now have admin HTTP endpoints (PR #40 e5391751); task-run already covered by POST /v1/tasks/{id}/run. Remaining work run / work correct / agent-admit-selfdev all depend on the LOCAL Agent-Work authority model (_work_applications: attach session + AGENT_OS_AUTHORITY_BEARER -> execution/authority principals), so exposing them over the network is a security design (authority bearer) requiring a founder decision (a) expose+review, (b) park as local/process-only, or (c) keep a slim local-authority CLI. 2f cannot delete that part of A until decided. Stage 2f1 DONE (2026-09-15): path A chat/headless deleted (agent_cli.py, run_agent_cli exports, agent/chat CLI, TerminalConfirmationGateway and their tests); canonical headless = agentos -p. No new product-test failures (remaining are pre-existing). Stage 2f2 DONE (2026-09-15): apps/cli/__main__.py slimmed to the local-authority Agent Work surface only (agent-run/-resume/-status/-answer/-correct/-admit-selfdev); session/mandate/task/workflow/daemon CLI deleted (covered by `agentos session`, the admin HTTP API, and `agentos daemon`). tests/product 23 failed (all pre-existing) / 2518 passed. Stage 2f3 DONE (2026-09-15): console scripts are agent-os-runtime (daemon) + agent-os-work (slim local-authority Agent Work CLI); the main entry remains the npm agentos/agent-os/agent-os-ts; unused --descriptor removed. Remaining: 2f4 (final sweep incl. stale agent_cli string references + doc/state closure)."
  terminal_convergence_final_2026_09_15: "Terminal-line convergence complete (founder option c). Single user entry = npm `agentos` / `agent-os` / `agent-os-ts` (cli-ts: interactive TUI + headless `agentos -p`). Python package ships only `agent-os-runtime` (governance daemon) and `agent-os-work` (slim local-authority Agent Work CLI: agent-run/-resume/-status/-answer/-correct/-admit-selfdev). Governance/admin (mandate/task/workflow/session/daemon) is API-only. Path B (textual TUI) and path A chat/headless (`agent_cli.py`, `run_agent_cli`, `agent`/`chat` CLI) were deleted (Stages 1/2f1); session/mandate/task/workflow/daemon CLI deleted (2f2). No permit/approval/C7 change. tests/product: 23 pre-existing failures / 2518 passed."
  product_naming_noem_2026_09_15: "Founder decision 2026-09-15: the agent product is officially named Noem. The terminal command is `noem` (npm bin `noem` only; a case-insensitive filesystem resolves Noem/NOEM to it; deprecated aliases agentos/agent-os/agent-os-ts). `Agent OS` denotes only the system-level agent (runtime/kernel: agent-os-runtime daemon, ~/.agent-os state, AGENT_OS_* env). UI text is NOEM / noem; --help/--version/error prefixes are noem. See docs/product/PRODUCT-NAMING-NOEM-2026-09-15.md."
  tui_fullscreen_migration_2026_09_15: "TUI full-screen migration (founder decision A = Bun + @opentui/react); plan in docs/product/GC-TUI-FULLSCREEN-MIGRATION-2026-09-15.md. P0 spike MERGED (PR #50 e8970a4a): @opentui/core native FFI REQUIRES Bun (fails on Node); deps @opentui/react@0.5.11 + @opentui/core@0.5.11 (+ ws, react-devtools-core). P1 MERGED (PR #51 6c022447): full-screen view apps/cli-ts/src/opentui/{app.tsx,main.tsx} renders the UNCHANGED SurfaceClient/TuiController (status line, scrollbox transcript, approval card, message input, footer). Keyboard reuses the tested src/keys.ts handleGlobalKey (Esc/Ctrl-C -> controller.interrupt() when streaming/stalled; Esc always consumed, never approves/rejects; app exits when status closed), Enter submit, y/n approval. Run via `npm run p1:fullscreen` (Bun). Verified in a 100x32 pty against the hermetic daemon: boot + 'hi' turn streams the reply and the footer shows exact tokens / cost UNKNOWN / events. Independent subagent review R1 REVISE (Esc called a non-existent /correct command -> unknown-command toast, no correction) -> remediated to handleGlobalKey -> CI green. NOT YET DONE: P2 MERGED (2026-09-15, PR #53): multi-panel transcript+files+diff sidebar (only when width>=SIDEBAR_MIN_WIDTH=100), per-panel independent scroll, Tab changes the SELECTED panel (border/header only) while the composer input keeps keyboard focus (sole exception: focused={!awaiting} while an approval is pending; restored after approve/reject, verified by an independent testRender harness), keyboard scroll via pgup/pgdn -> explicit scrollBy on the selected panel (mouse wheel scrolls the panel under the pointer), context-lock via opentui built-in stickyScroll/stickyStart:bottom (source-read evidence, no automated test), and --no-animation/--no-panels flags; sidebar sampling is read-only + async (git status/diff, execFile, 3s timeout, in-flight guard) with no capability/permit/C7 path; pty evidence apps/cli-ts/scripts/pty_fullscreen_p2.py incl. TYPABLE_AFTER_TAB regression guard (idle 3.1s = 0 bytes; alt-screen clear count NOT instrumented, not claimed); test/opentui-panels.test.ts 6 pass, cli-ts full suite 156 pass. Independent review R1 REVISE found a HIGH regression (tab stole composer focus -> typing lost) plus async-sampling/dead-prop/doc-claim findings; all fixed in the same PR. P3 (multi-agent/task tree) NOT done: needs a surface-protocol extension + unfreezing one-turn-per-session -> separate GC + security review. Ink view kept in parallel until parity; Node->Bun client runtime distribution update (bun build --compile) pending. No permit/approval/C7 change."
  tui_parity_slice_a_2026_09_16: "Ink parity slice A (view-only, zero protocol/kernel change; independent review R1 = REVISE, all findings fixed): the full-screen view renders the command palette (typing / lists matches; up/down moves; Tab completes; Enter runs the highlighted command) and the selector overlay used by /resume, /theme and /mode (query filter, up/down, 1-9 quick pick, enter select, esc cancel). Esc is owned by the selector while open, so it cancels the picker and never reaches the frozen global mapping (Esc still never approves/rejects). Reuses the existing pure modules commands.ts (filterCommands) and selector.ts; new pure helpers src/opentui/overlays.ts (sliceWindow viewport) and src/opentui/viewkeys.ts (key-owner precedence resolver). Three real defects were found and fixed with tests, with honest attribution: (1) independent review R1 found the palette branches were nested inside the selector branch, making palette navigation/completion dead code - fixed by moving the branches out and adding the tested precedence resolver; (2) the builder's own post-R1 check found selectorOpen was computed as a `!== undefined` style check while the controller returns null when closed, which routed EVERY key to the selector layer and silently disabled Enter/movement (a plain turn could not be started) - fixed to truthiness with an explicit null/undefined/false regression test (this was NOT an R1 finding); (3) independent review R2 found the fix had dropped the Tab/PgUp/PgDn routing, which silently disabled panel switching and scrolling and therefore the P2/P3a agents navigation and session switching (a P1 regression) - restored as explicit panel owners in the resolver with tests, and re-verified behaviourally (P3a RESUMED True, parity A four True, multi-session SWITCHED_TO_OTHER_SESSION True). Known minor limitation: Esc while the palette is open is routed to the frozen global layer (it does not dismiss the palette; deleting the slash does). Evidence: apps/cli-ts/scripts/pty_fullscreen_parity_a.py reproduced twice gives PALETTE_SHOWN True, PALETTE_ENTER_RAN_STATUS True (behavioural: Enter on the palette runs /status and the status panel appears), SELECTOR_SHOWN True, SELECTOR_CANCELLED True. Tests: test/opentui-overlays.test.ts + test/opentui-viewkeys.test.ts (precedence + the null-selector regression); cli-ts suite 154 parallel + 19 serial = 173 pass. Ink UI tests now run serially (--test-concurrency=1) because the Ink palette test holds a key-handler ref that can lag one paint under parallel load; the test waits for the composer to echo the filter plus two ticks, verified 8 consecutive clean runs (no assertion weakened). INK RETIREMENT REMAINS BLOCKED: still missing mentions, vim, multiline composer/external editor, input history + ctrl-r search, markdown rendering, syntax highlighting, real theme colors and the home panel (docs/product/TUI-PARITY-CHECKLIST-2026-09-16.md, slices B-D)."
  tui_parity_slice_b_2026_09_16: "Ink parity slice B (view-only, zero protocol/kernel change): the full-screen view now (a) supports @file mentions by reusing controller.workspaceFiles() + mentions.ts (typing @ narrows the workspace listing; Tab completes the highlighted path into the composer), (b) supports readline-style input history on up/down via InputHistory (up recalls the previous submission), and (c) renders assistant text through the opentui markdown renderable (SyntaxStyle.create()). Key ownership extends the pure resolver with mention and history layers, with precedence selector > approval > frozen global keys > palette > mention > panel(Tab/PgUp/PgDn) > agents panel > history(up/down) > submit, covered by test/opentui-viewkeys.test.ts (a letter still reaches the composer while a mention list is open; the agents panel keeps plain up/down; the palette keeps Tab). Independent review R1 = APPROVE_WITH_CONDITIONS (no P0/P1) and the conditions are fixed: with a mention list open Enter now submits (it was swallowed as a no-op, diverging from Ink), markdown applies only to FINALIZED assistant messages (Ink parity, avoids malformed partial markdown while streaming), the mention assertion is narrowed to the SUBMITTED window (no cross-frame false positive), the markdown signal is honestly labelled a smoke check (it proves the reply still renders, not markdown formatting) and the aggregate is independent rather than a copy of one signal. Evidence apps/cli-ts/scripts/pty_fullscreen_parity_b.py reproduced twice: HISTORY_PREVIOUS True, MENTION_TAB_COMPLETED True, MARKDOWN_RENDER_PATH_OK True, SLICE_B_ALL_SIGNALS_VERIFIED True; regressions pty_fullscreen_p3a RESUMED True and pty_fullscreen_parity_a PALETTE_ENTER_RAN_STATUS/SELECTOR_SHOWN True. Evidence methodology recorded: observing a COMPOSER line change is unreliable under cell-diff rendering, while NEW transcript content (a submitted message or a reply) is reliably painted - the mention completion is therefore verified through the submitted user message that appears in the transcript. Suite 157 parallel + 19 serial = 176 pass. NOT done: coloured syntax highlighting, vim, multiline composer/external editor, ctrl-r history search, theme colours, home panel (slices C-D); Ink retirement stays blocked."
  tui_parity_slice_c_2026_09_16: "Ink parity slice C (partial, view-only, zero protocol/kernel change): the external editor is DONE - Ctrl-G hands the composer draft to $EDITOR and reads it back by reusing editor.ts; pty EDITOR_ROUNDTRIP True reproduced twice. Binding fix of note (three iterations, recorded for traceability): (1) `ctrl && name === g` was DEAD because opentui does not set the ctrl flag for a control byte; (2) binding on `name === g` alone fixed that but introduced a REGRESSION RISK - once the input is blurred (e.g. after Tab) a plain letter g also reaches the resolver and would open an editor; (3) the final binding matches the CONTROL BYTE (Ctrl-G's sequence is the BEL byte, while a plain g has sequence g), with a regression test asserting a plain g does NOT open the editor. Ctrl-J arrives as name=linefeed, so a future multiline binding can use that name. A key-delivery probe (scripts/pty_fullscreen_parity_c.py, one fresh app per candidate) shows return/tab/escape/up/down/ctrl-n/ctrl-p/ctrl-j/ctrl-g/ctrl-o/f2/alt-g all reach the view; an earlier single-instance version of that probe produced a FALSE all-delivered matrix because Tab/Enter move focus away from the input - that wrong conclusion was corrected this round and must not be reused. The remaining slice C items (multiline composer and vim) are blocked NOT by key delivery but by the composer itself: the view uses opentui native single-line input, so ctrl+J newlines cannot be displayed and vim cannot replace native editing; that needs a self-owned composer (composer.ts + custom rendering) or a textarea - a larger change, NOT done. Ink retirement stays blocked (#11 vim, #12 multiline). Tests 158 parallel + 19 serial. The delivery-matrix probe needs the temporary NOEM_KEY_DEBUG instrumentation; without it the script prints DELIVERY_MATRIX_SKIPPED instead of an empty (misleading) matrix; the editor round trip works without instrumentation."
  tui_parity_slice_c2_textarea_composer_2026_09_16: "Ink parity slice C2 (view-only, zero protocol/kernel change): the composer is now opentui <textarea> (native multiline editing + caret + word motion), replacing the single-line native input; the view keeps only overlay/submit/modal key ownership. Single text source of truth = the textarea (plainText); it is mirrored to the overlays via a microtask because a synchronous read lags one keystroke (that lag desynced the palette/mention layers), and programmatic writes (history recall, mention completion, external-editor result) go through editBuffer.setText(...) + setCursorByOffset(len) because setText leaves the CARET AT THE START (otherwise the next keystroke prepends and backspace does nothing). Enter ownership: the textarea submits (Enter bound to submit, ctrl+j to newline); the agents panel is the sole exception (agentsPanelRef suppresses the textarea submit so the resolver can switch session; the textarea stays focused so typing still works while a panel is selected). Overlay rule: an overlay owns ONLY its own keys (palette: up/down/tab/enter; mention: tab) and printable keys ALWAYS fall through - this fixes the /exit trap where an overlay swallowed characters, so /stat entered only / and Enter ran the palette default item /exit (a clean exit that was misread as a renderer crash). Deviation (recorded): with a non-empty draft the TAB key is consumed by the textarea itself (it only reaches the handler when empty, which is why the p3a Tab works and the mention Tab did not) and no keybinding override is available, so mention completion is ALSO applied on submit; so mention completion is ACTUALLY applied on submit (the earlier wording that Tab still works on short/empty drafts was WRONG and is withdrawn: an empty draft cannot have an open mention, and the evidence signal was renamed MENTION_COMPLETED_ON_SUBMIT because its old name implied Tab). Follow-up fixes recorded with attribution: (a) independent review R1 = REVISE found a P1 regression - the textarea onSubmit and the resolver palette Enter DOUBLE-FIRED, so a palette command ran twice (/status twice + an unknown-command notice for the raw /stat); fixed with overlayOwnsEnterRef and the invariant script now asserts COMMAND_RAN_EXACTLY_ONCE; (b) the same review found submit() did not clear the textarea buffer (fixed: one clearing point) and that the mention branch bypassed setComposerText (fixed); (c) the follow-up session found the real root cause of the long-red HISTORY_PREVIOUS and MENTION signals: overlayOwnsEnterRef used `selector !== undefined` while controller.pendingSelector is NULL when closed, so the guard was always true and the textarea onSubmit ALWAYS returned early - there was no working submit path at all (no history entry, no session, no files, no mentions); fixed to `!== null` (the same null/undefined trap already documented for the selector layer), after which the whole net went green; (d) controller.workspaceFiles() cached an EMPTY file list, which could disable @ mentions for a whole session after one early fetch - fixed to cache only non-empty results; (e) the view now fetches files once per open mention instead of per keystroke (the per-query dependency cancelled every previous fetch and the last one could resolve into a cleaned-up closure). The now redundant suppressSyncRef was removed after an A/B showed the net stays green without it. Known display gap: the transcript renders with <text>, which FOLDS embedded newlines, so multiline input/submit is correct (/export shows the newline) but multiline DISPLAY is not. Evidence: pty_fullscreen_composer_invariant.py (typing /stat must open the palette, Enter must run /status, the process must survive, the command must run exactly once) INVARIANT_OK True (reproduced repeatedly); parity_a four True; parity_b four True (HISTORY_PREVIOUS, MENTION_COMPLETED_ON_SUBMIT, MARKDOWN_RENDER_PATH_OK, SLICE_B_ALL); parity_c EDITOR_ROUNDTRIP True; p3a RESUMED/TYPABLE True; multi-session PROVEN_CROSS_SESSION_SWITCH True; suite 158 + 19. NOT done: the vim modal layer (next slice, #11), multiline display/scrolling, and dedicated paste/undo verification."
  tui_parity_slice_d_vim_2026_09_17: "Ink parity slice D (view-only, zero protocol/kernel change): the vim modal layer is IMPLEMENTED and unit-tested; its pty behavioural proof is INCOMPLETE (see the PR). Pure module src/opentui/vim.ts resolves normal-mode keys (h/j/k/l, 0/$, w/b/e, x, i/a/A/I, d/c with dd/dw/d$, Enter submits, Esc clears a pending operator) and applies them through composer.ts primitives (with the c operator returning to insert); offsetFromCursor maps a logical caret to an offset with clamping. test/opentui-vim.test.ts covers the map and the edits (bypass-detecting). The view adds a vim key layer owned at the highest precedence, active only while controller.vimMode is on AND the composer is in normal mode; in normal mode the textarea is BLURRED so letters cannot be inserted and every key goes to the layer, while the insert-mode Esc transition returns to normal (during streaming Esc still goes to the frozen global correction mapping) and i/a/A/I refocus the textarea. Evidence: scripts/pty_fullscreen_vim.py (/vim, insert types hello, Esc, 0, x, Enter in normal mode) VIM_NORMAL_EDIT_SUBMITTED True twice - the SUBMITTED window reads ello and not hello (the assertion is scoped to the submitted window because earlier frames legitimately contain the insert-mode echo). The whole net stayed green in the same run: composer invariant (incl. COMMAND_RAN_EXACTLY_ONCE), parity_a, parity_b (SLICE_B_ALL), parity_c, p3a, multi-session; suite 162 + 19. LESSON (third instance of the same trap in this arc): vimNormal was first written as `selector === undefined` while controller.pendingSelector is NULL when closed, so the vim layer never activated and 0/x were inserted as text - any new check on pendingSelector must use === null / truthiness. STILL NOT DONE: ctrl-r history search, coloured syntax highlighting, theme colours, the home panel, multiline DISPLAY (the transcript <text> folds newlines) and multiline scrolling/height adaptation. CORRECTED 2026-09-17: the VIM_NORMAL_EDIT_SUBMITTED claim above can no longer stand as evidence. The assertion is 'ello in submitted and hello not in submitted', and the scripted fixture (scripts/dev_daemon.py) now contains return 'hello ' + name, so its second half is permanently false and the signal prints False no matter what the vim layer does (reproduced 2026-09-17: VIM_NORMAL_EDIT_SUBMITTED False, exit 0 - the script did not gate on it). The colliding fixture text was added by slice E (e44ef044, 06:51) and did NOT exist when this slice was recorded (c5085f14, 05:54), so the earlier True is not judged fabricated - but the signal is now dead and this pin may not be quoted for #11. The BEHAVIOUR is verified independently: with a marker that cannot collide (qqwwzz) and row-level screen reconstruction (frame_reader.Screen), normal-mode 0+x submits qwwzz, 0xizz submits zzqwwzz, and an unmapped normal-mode key does not insert text. The script fix belongs in scripts/pty_fullscreen_vim.py (change the marker AND make the signal able to fail)."
  tui_frame_reader_tool_2026_09_17: "Readable-row-frame tool added for visual verification: apps/cli-ts/scripts/frame_reader.py reconstructs the real screen from raw pty bytes (CUP positioning, SGR colours/bold, text/CR/LF/erase, UTF-8 wide glyphs) and exposes text_rows()/row_text()/spans()/token_style(), with --self-test (0 failures) and --demo. First findings: (1) the earlier claim that the transcript folds embedded newlines is DISPROVEN - a submitted two-line draft renders line1/line2 on different rows (transcript 02/03) and the composer likewise (36/37), so that known-gap entry is withdrawn; (2) opentui applies its own default palette (placeholder fg=(102,102,102)), so the repo THEMES must explicitly override renderable colours for #17. The tool is the prerequisite for the remaining visual items: theme colours (#17), coloured syntax highlighting (#16) and row-structure assertions. CORRECTED 2026-09-17 (slice F): two defects in this tool were found while fixing #16, both of which could FABRICATE evidence. (a) It understood only truecolor 38;2;r;g;b and not the 256-colour form 38;5;N that opentui actually emits, and worse it read the N as a standalone ANSI code - so palette 36 (a teal) was reported as ANSI 36 cyan (17,168,205), which produced a wrong colour reading during the #16 work. It now maps through the real xterm palette, with a self-test asserting 38;5;36 yields PALETTE_256[36] and never (17,168,205). (b) It skipped space characters (byte > b' '), so a space never cleared the glyph a previous frame had written; stale border characters survived inside text rows and find_row('def ') returned a FALSE NEGATIVE on a busy screen (FENCED_CODE_RENDERED False), i.e. the same check's result depended on unrelated repo dirtiness. Spaces are now written as real cells, with a self-test. Both fixes re-verified against the whole behavioural net (composer invariant, parity_a/b, vim, p3a, multi-session, p2, smoke, theme): no change to any pre-existing signal."
  tui_parity_slice_e_theme_colours_2026_09_17: "Ink parity slice E (view-only): theme colours now actually render (#17 DONE). New pure module src/opentui/theme-colors.ts maps the repo THEMES (Ink colour names in src/theme.ts) to hex via INK_HEX/hexFor/viewTheme, because opentui parses hex reliably; test/opentui-theme-colors.test.ts asserts every token resolves to hex and that default/mono/ansi are distinguishable (otherwise /theme would only change a label). The view applies the tokens to the top status line (theme.accent), the transcript by role (user/assistant/system/tool states/notice), the approval card border (theme.approvalBorder), the palette rows and markdown text (theme.assistant), and registers themed SyntaxStyle scopes (#16 keyword/string/comment/function). NOT WIRED - CORRECTED 2026-09-17: theme.footer, theme.border, theme.danger and theme.approvalTitle each have ZERO references anywhere under apps/cli-ts/src, so the footer text element carries no fg (app.tsx:878 is a bare text element with only style height:1), the transcript/composer boxes set border: true with no borderColor, and changing those four tokens in src/theme.ts cannot change one rendered cell - they are specified only. Evidence: scripts/pty_theme_check.py (built on the frame reader) shows the header token's SGR changing with /theme mono - THEME_APPLIED True (re-measured 2026-09-17: header 'noem' (17,168,205) -> (255,255,255)). PROBE DEFECT, found 2026-09-17: the script's second key is NOT a footer probe - it samples the token ASK via Screen.token_style('ASK'), which returns the FIRST row containing it, and the header status line (row 00, fg = theme.accent) contains ASK as the mode name, so both keys read the same header row (measured row dump: ASK occurs only on rows 00 and 39; row 39 is the footer and its span fg is (255,255,255) under BOTH themes). THEME_KEYS_CHANGED ['header','footer'] is therefore a duplicate of the header reading rather than independent footer evidence, and this pin's footer claim was never actually measured; the probe fix belongs in scripts/pty_theme_check.py (locate each key ON ITS OWN ROW, and refuse to count two keys resolved to the same row as two pieces of evidence); the whole behavioural net stayed green (composer invariant, parity_a/b, vim, p3a, multi-session) and the suite is 166 + 19. Honest limits: the header token was not located by the tool in that capture so the assertion was BELIEVED to cover the footer only - CLOSED for the HEADER by slice G, where the real cause turned out to be a layout defect (the top status line never rendered at all): after that fix the header measures (0,175,215) under the default theme and (255,255,255) under mono and pty_theme_check reports THEME_KEYS_CHANGED ['header','footer'] - but per the probe defect above both of those keys are the HEADER row, so slice E's footer assertion was never footer evidence: the footer is unthemed by source (theme.footer has no consumer anywhere in apps/cli-ts/src, and the footer text element has no fg) and was measured with the terminal-default fg (255,255,255) under BOTH themes. This pin's diagnosis of #16 (that the registered SyntaxStyle scopes were 'not applied by the markdown renderable', with the next step being to find the scope vocabulary/shape opentui expects) is WITHDRAWN - it was a wrong attribution. The measured cause is a missing GRAMMAR, not a missing client and not a wrong scope shape; see tui_parity_slice_f_code_highlight_2026_09_17. Remaining parity at the time: #14 ctrl-r history search and multiline display/scrolling; both were closed by slice H, after which the 19-item checklist is fully DONE and Ink retirement is unblocked."
  tui_parity_slice_f_code_highlight_2026_09_17: "Ink parity slice F (view-only, zero protocol/kernel change): coloured code syntax highlighting (#16 DONE). CORRECTED ROOT CAUSE (this is the slice's main finding): the previous diagnosis was wrong on both counts. (1) There was never a missing/unused TreeSitterClient - MarkdownRenderable passes this._treeSitterClient into each code block AND CodeRenderable falls back to getTreeSitterClient() in its constructor, and that client works (isInitialized() true). (2) The SyntaxStyle scope registration was never the problem - treeSitterToTextChunks resolves getStyle(group) and falls back to getStyle(group.split('.')[0]), so keyword/string/comment/function were registered in a shape that would have worked. The real gap is GRAMMAR COVERAGE: the grammars bundled with @opentui/core 0.5.11 are exactly {javascript, typescript, markdown, markdown_inline, zig} (wasm + highlights.scm ship in the package, offline-capable). A ```python fence therefore resolves to a filetype with NO parser, the client answers 'No parser available for filetype python', highlights come back empty, and there is nothing for the scopes to style - every token stays default white. Discriminating experiment (spike/tree-sitter-coverage.ts, re-runnable): PARSERS PRESENT typescript/javascript/javascriptreact/typescriptreact/markdown/markdown_inline/zig vs ABSENT python/rust/go/bash/json/sql/yaml/ruby/c/cpp/java/html/css; highlightOnce(fixture,'python') -> highlights null + warning while highlightOnce(fixture,'typescript') -> 47 highlights from the SAME client. FIX (option B, chosen over vendoring one wasm per language): reuse the highlighter the Ink path already uses - cli-highlight -> highlight.js, whose full 191-language set is already on disk - and feed its ranges back through CodeRenderable's SUPPORTED onHighlight hook. onHighlight is invoked whenever the renderable has a non-empty filetype EVEN WHEN the tree-sitter result is empty (the guard is highlights.length >= 0), and returning a non-empty range list routes rendering through treeSitterToTextChunks where SyntaxStyle resolves each range's group name; tree-sitter's own result is kept when we have no language for the fence (js/ts/markdown/zig). This is also the correct parity semantics: the same engine as Ink. Files: src/opentui/code-highlight.ts (pure: fenceLanguage normalises fence aliases py/ts/sh/yml to canonical ids; codeHighlightRanges walks the highlight.js token tree into [start,end,scope] triples and fails soft to [] on unknown language/parse error; highlightStyleTable maps BOTH the highlight.js token vocabulary and the tree-sitter capture vocabulary onto theme tokens plus a 'default' scope; codeBlockRenderNode is the markdown renderNode hook - it MUST return the renderable it got from context.defaultRender() verbatim, because the markdown renderable destroys a default it is not handed back, which would drop the code block entirely); src/opentui/app.tsx registers the whole table and passes the module-stable renderNode; highlight.js is promoted from a transitive (via cli-highlight) to an explicit dependency; unmapped scopes (emphasis/strong) deliberately fall through to the default colour rather than being forced. EVIDENCE: (a) headless - scripts/highlight_render_check.ts (bun, because the OpenTUI native renderer has no node FFI) drives opentui's own createTestRenderer and reads the renderer cell buffer, asserting the exact scope-to-colour mapping: def/return -> #11a8cd (accent), \"hello \" -> #0dbc79 (toolDone), greet(name: str) -> str: -> #e5e510 (toolPending), the comment -> #808080 (notice), the unmapped '+ name' -> default, and that every code line survives verbatim; it also runs a NEGATIVE CONTROL - the same document rendered WITHOUT the renderNode must have no coloured code tokens - so the check is falsifiable rather than trivially passing; (b) pty end to end - scripts/pty_highlight_check.py now asserts >= 3 distinct non-default code colours and that the block is present: CODE_TOKEN_COUNT 14, CODE_DISTINCT_COLOURS 4 [(0,175,135),(0,175,215),(128,128,128),(215,215,0)], FENCED_CODE_RENDERED True, HIGHLIGHT_OK True (exit 0); the previous version's weak 'any non-white token' gate was tightened at the same time. Colour encoding note: the terminal advertises 256 colours so the WIRE carries palette indices (keyword->38, string->36, title->184, comment->8), not the theme hex; pty assertions therefore use palette RGB while the headless check can use exact hex. Tests: test/opentui-code-highlight.test.ts (5 cases: fence-alias normalisation, the scope table incl. 'default' and dim comments and keyword != title colour, the table changing with the theme, python ranges hitting def/return/\"hello \"/comment/greet, and fail-soft on unknown/empty language); full suite 171 + 19 = 190 pass; typecheck clean. Regression: the whole behavioural net re-run after the frame_reader fixes is unchanged/green (composer invariant INVARIANT_OK, parity_a, parity_b SLICE_B_ALL_SIGNALS_VERIFIED, vim exit 0, p3a, multi-session PROVEN_CROSS_SESSION_SWITCH, p2 TYPABLE_AFTER_TAB, smoke PASS, theme THEME_APPLIED). TWO PRE-EXISTING OBSERVATIONS (NOT caused by this slice, identical before and after - verified by re-running both scripts on the stashed baseline): VIM_NORMAL_EDIT_SUBMITTED is False and HAS_AGENTS_TITLE is False in their pty scripts; neither script gates on them (both exit 0 regardless), but the slice-D pin records VIM_NORMAL_EDIT_SUBMITTED True twice, so that evidence is due a re-check. STILL NOT DONE: #14 ctrl-r history search, #18 home panel, multiline display/scrolling; then Ink retirement. specified/implemented/tested/verified as above; released NO."
  tui_parity_slice_g_home_panel_2026_09_17: "Ink parity slice G (view-only, zero protocol/kernel change): the home/welcome panel (#18 DONE) plus a real layout defect found while wiring it (#3, whose DONE was FALSE until now). GAP (measured, no input, 40x120): the full-screen transcript was entirely blank on the first frame while Ink greets the user with HomeView; the controller opens its session lazily (ensureSession is only called by runTurn), so the first frame really is empty and the panel is NOT a flash - it stays until the first turn. CHROME DEFECT (found by the same first-frame capture): row 00 was the transcript border, i.e. the top status line NEVER APPEARED, and the footer was painted on top of the composer box bottom border. Re-measured on a 46-row terminal: still missing, so it was not clipping. Root cause: sibling text elements inside a flex column measure ZERO height, which also handed the flexGrow:1 row an extra 2 rows. Proof chain: adding style={{height:1}} to the top bar made it appear at row 00 and shifted everything down by exactly one row; same for the footer. Fix (3 edits): height:1 on the top status line, height:1 on the footer, and flexShrink:1 on the middle row (yoga defaults flexShrink to 0, so without it the column overflows by one row). Both 40-row and 42-row terminals now lay out correctly. This makes pty_theme_check locate the header, which it previously could not: THEME default header/footer (0,175,215) vs mono header/footer (255,255,255), THEME_KEYS_CHANGED [header,footer], THEME_APPLIED True - so slice E honest limit (1) is CLOSED by direct measurement rather than re-assertion. IMPLEMENTATION: new src/home.ts is renderer-neutral (imports neither ink nor @opentui) and now owns shortenPath, moved out of HomeView.tsx which re-exports it so test/homeview.test.tsx is unchanged and there is exactly one implementation; it also owns homeFacts/homeFieldRows/homeTipRows/homePanel(facts, narrow)/shouldShowHome(finalizedCount, activeCount). The panel src/opentui/home-panel.tsx paints those rows as themed spans (bold/dim via createTextAttributes) with an explicit height:1 per row, uses borderStyle rounded to match Ink borderStyle round, and reproduces Ink narrow (<60 cols) exactly as a borderless three-line block. app.tsx wires showHome into the transcript. CORRECTED 2026-09-17 by slice J - this pin originally claimed it 'passes provider null to match Ink exactly (Ink App never receives provider either, so both views fall back to openai-compatible - a pre-existing gap in BOTH views, not a regression)' and BOTH halves were false: cli.tsx DOES query providerStatus() and DOES pass the real provider_id to Ink App, and Ink App.tsx DOES forward it to HomeView, so Ink always showed the real provider id and the hardcoded null was a REAL REGRESSION, not parity. Why the drift guard missed it: it only compared the provider-null variant, and the fallback literal happens to equal the fixture daemon provider_id, so neither direction could distinguish forwarding from dropping. Slice J passes the real provider_id and adds a provider-set baseline variant with assertions that separate the two. MEASURED DEVIATION, recorded not hidden: Ink tip says shift+tab switches mode, but that binding does not exist anywhere in the repo - the string occurs exactly once in the whole app, inside that very tip, and neither Ink useInput nor keys.ts nor viewkeys.ts handles it; permission mode is set by /mode. The panel therefore ships the true instruction and a unit test pins both facts (the panel line must not contain shift+tab and must contain /mode; the baseline assertion re-measures that Ink still says shift+tab). The Ink string is left untouched because Ink is being retired. EVIDENCE: test/opentui-home.test.tsx 7 cases (shouldShowHome semantics; provider three-way; five equally-wide fields with values; branch fallback plus a width-bounded long path; narrow equals Ink three-line block; DRIFT GUARD comparing every panel row against Ink HomeView lastFrame() with the box border stripped; deviation assertions); full suite 171 + 26 = 197 pass. scripts/pty_home_frame_check.py on the first frame: HOME_PANEL_FIRST_FRAME True, all five fields found, Quick start present, HEADER_RENDERED True, FOOTER_NOT_OVER_BORDER True, and after one turn HOME_PANEL_GONE_AFTER_TURN True - HOME_PANEL_CHECK PASS (exit 0). Whole behavioural net re-run because the root layout shifted: composer invariant, parity_a/b, p2, vim, p3a, multi-session, smoke, theme, highlight - all identical to the previous batch (pty_highlight_check now reports 5 distinct colours, the extra one being the scrollbar grey). HONEST LIMITS: on a very short terminal stickyStart=bottom scrolls the card top off (Ink overflows too), no reflow was added; the card padding is paddingLeft 1 instead of Ink paddingX 2 because the transcript adds one more column, so the left edge matches but the right was not compared column by column; CORRECTED 2026-09-17 by slice J - this pin originally said 'the provider field is null in both views so it always reads openai-compatible (fixing it needs the real provider_id ... in BOTH views - deliberately out of scope)'; that was false: it was null only in the FULL-SCREEN view, and slice J now passes the real provider_id there. PRE-EXISTING and unchanged: VIM_NORMAL_EDIT_SUBMITTED False and HAS_AGENTS_TITLE False, identical before and after, and neither script gates on them. STILL NOT DONE: #14 ctrl-r history search and multiline display/scrolling; then Ink retirement. specified/implemented/tested/verified as above; released NO."
  tui_parity_slice_h_ctrl_r_and_multiline_2026_09_17: "Ink parity slice H (view-only, zero protocol/kernel change): Ctrl-R reverse history search (#14 DONE), the multiline tail of #12, and a real overlay rendering defect found while building #14. With this slice the 19-item checklist is fully DONE (#5/#6 being where the full-screen view leads Ink), so Ink retirement is unblocked. #14 IMPLEMENTATION: reuses the existing pure InputHistory.search (reverse-chronological, case-insensitive, deduped) - no new search logic. viewkeys.ts gains a search layer ranked immediately BELOW the selector and ABOVE approval/global: an open search owns up/down/return/escape and SWALLOWS tab/pgup/pgdn/Ctrl-R/Ctrl-G (otherwise it would switch panels mid-search, re-enter and reset the search, or hand the query to an external editor), while PRINTABLE keys keep falling through to the composer because the query IS the composer content - the same rule that fixed the /exit trap. The open key was MEASURED with opentui own parser (spike/key-sequence-probe.ts): 0x12 -> name=r ctrl=true sequence=u0012; the binding accepts both the control byte and ctrl && name===r, and the load-bearing property is that a plain r can never open it (letters reach the resolver whenever the textarea is blurred - the same trap class as Ctrl-G). app.tsx keeps the draft in searchDraftRef and the open flag in searchOpenRef (synchronous refs, because the router must see the new value for the very next key) and folds the search into overlayOwnsEnterRef so Enter cannot also reach the textarea; the palette is suppressed while searching, as in Ink. Overlay content: the Ink string reverse search (Ctrl-R): <query>, a windowed match list (sliceWindow, matching this view palette/selector convention; Ink takes a fixed first 5), and no matching history when empty. MULTILINE: the old documents listed multiline DISPLAY (a <text> folding embedded newlines) as a gap, but section 10 had already disproved that and later sections were never updated; re-measured here - submitting l1/l2/l3 occupies THREE transcript rows (MULTILINE_TRANSCRIPT_ROWS 3) - so transcript multiline display was never a gap and only the documentation was wrong. The real defect was the COMPOSER: a fixed height of 5 showed just three content rows, so an 8-line draft showed only its last three (measured). Ink composer has no fixed height and simply grows. New pure composerRows(draft, terminalRows) in src/layout.ts keeps the five-row box for empty/single-line drafts, otherwise uses lines+2, capped at 12 rows and at a third of the terminal height - the cap matters because unbounded growth would squeeze the transcript to nothing in a definite-height column. Measured: COMPOSER_VISIBLE_LINES 8 of 8. OVERLAY RENDERING DEFECT (found by the same capture, affects the VISIBILITY of #7/#8/#10): every overlay row was collapsed onto a single line and painted over its neighbours (raw frame: the search header, /status, l1 and border glyphs interleaved on one row). Root cause is the same as slice G status line and footer: a sibling text inside a flex column measures ZERO height - and a bordered box with no explicit height measured zero too, so the whole overlay was drawn onto its neighbours. Two fixes: an OverlayRow component giving every overlay row an explicit height 1, and overlayRows(contentRows) in src/opentui/overlays.ts giving the box an explicit height of content+2 borders, capped at 12. The middle row already has flexShrink 1, so the transcript yields correctly (at 44 rows: 1 header + 32 transcript + 5 overlay + 5 composer + 1 footer = 44 exactly). This explains why slice A could only assert the palette/selector TITLE plus behaviour: the item text was not readable at all. It is now (measured: after typing /stat the item row reads the selected /status command followed by its description). NOT done: parity_a assertions were left as title+behaviour - tightening them is optional. EVIDENCE: unit tests +4 in test/opentui-viewkeys.test.ts (Ctrl-R opens while a plain r does not; an open search owns pick/cancel/move and swallows mode-changing keys including Ctrl-R itself; printable keys still reach the composer while Ctrl-C/L keep their frozen global meaning; a selector still outranks an open search), +1 in test/opentui-overlays.test.ts (overlayRows bounds and cap), +1 in test/layout.test.ts (composerRows both ends and a short terminal); full suite 177 + 26 = 203 pass. scripts/pty_search_check.py runs TWO FRESH client instances (reusing one instance parks the app on an approval card, which blurs the composer and corrupts the next phase) and reports MULTILINE_TRANSCRIPT_ROWS 3, SEARCH_OVERLAY_SHOWN / MATCH_LISTED / NO_MATCH_HINT / QUERY_ECHOED / CLOSED_ON_ESC / CANCEL_RESTORES_DRAFT / PICK_LOADS_ENTRY all True, COMPOSER_VISIBLE_LINES 8 of 8 -> SEARCH_CHECK PASS (exit 0). Whole behavioural net re-run (12 scripts) green and signal-identical to the previous batch, including the two pre-existing False values (VIM_NORMAL_EDIT_SUBMITTED, HAS_AGENTS_TITLE) which no script gates on. HONEST LIMITS: a cell-diff residue remains where a frame shrinks (an overlay closing, the composer getting shorter, the footer text getting shorter all leave a stale glyph from the previous frame - observed as a stray corner or a fragment of the sidebar). This is the already-recorded behaviour that a cell-diff renderer may not repaint a changed row; it exists in the pre-change captures too (different glyphs), it was NOT introduced here, and it was NOT fixed. Impact: transient stale characters on screen; no behavioural assertion is affected. The search overlay uses a bordered box whereas Ink draws the same lines without a border (content matches; the border is this view existing overlay visual language), and the match list is windowed where Ink takes a fixed first five so its highlighted row can scroll out of view. STILL NOT DONE: nothing on the parity checklist; remaining work is Ink retirement plus optional hardening (overlay assertions by content, the cell-diff residue) and the section-9/section-12 stale not-done entries which section 14 supersedes. specified/implemented/tested/verified as above; released NO."
  tui_runtime_bun_slice_j_2026_09_17: "Slice J: the CLI runtime switched to Bun (founder decision), with the unified entry, four Ink-parity gaps closed, and the single-file build measured. RUNTIME FACTS CORRECTED: the earlier claim in this file and in TUI-INK-RETIREMENT-PREP that the full-screen view can ONLY run under bun was true only for Node 22. @opentui/core ships TWO ffi backends and two entries (createBunBackend(bun:ffi) via index.bun.js, createNodeBackend(node:ffi) via index.node.js, with an explicit node condition in exports); the node path fails only because it requires node:ffi, which EXISTS from Node 26.1.0 (2026-05-07) behind --experimental-ffi (plus --allow-ffi under the Permission Model), while Node 22 answers ERR_UNKNOWN_BUILTIN_MODULE, after which loadBackend silently degrades to an unsupported stub that throws on the first dlopen - so that error means THIS Node cannot do ffi, not that node is unsupported. MEASURED on Node 26.9.0: ffi.dlopen returns {lib, functions} and lib exposes registerCallback / unregisterCallback / close, exactly what createNodeBackend calls; four repo pty checks (home, theme, highlight, parity_a) pass with signals identical to bun, and --no-warnings is not required for correctness. DECISION: Bun is the default (the node route needs Node >= 26, currently Current and NOT LTS, plus an experimental flag whose API the Node docs say may change at any time; bun needs no flag and produces a single-file binary). The Node 26 route is recorded as a VERIFIED FALLBACK, not as the default. UNIFIED ENTRY: src/cli.tsx now serves both the subcommands and the interactive TUI, and the view is a DYNAMIC import so --version / --help / doctor / daemon / provider / session / headless -p never load @opentui/core - that is what keeps them working on a runtime without native FFI and what lets the node-only unit suite drive the real entry; test/cli-entry.test.ts asserts the FFI error never appears, so a static import fails the suite. New src/opentui/mount.tsx; src/opentui/main.tsx became a thin wrapper with UNCHANGED behaviour (the 12 pty scripts still drive it). FOUR GAPS CLOSED (all measured against Ink): (1) provider was hardcoded null - the entry now queries providerStatus() and passes the real provider_id; (2) history was never loaded or persisted, so Ctrl-R did not survive a restart - FullscreenAppProps gained initialHistory / onHistoryChange wired to loadState / saveState; (3) controller.themeName / .goal / .vimMode were never set from state, so /theme, /goal and vim were silently ignored in the full-screen view; (4) --resume <id> was not handled. Also: starting interactive mode on a runtime without native FFI now prints actionable advice (use Bun, or Node >= 26 with the experimental flag; other commands still work) instead of a raw stack. PACKAGING MEASURED: bun build --compile produces a ~76 MB single file that renders the full screen when run from a NON-repo directory with no native-library error, so the dylib is bundled and the user needs neither bun nor node; the compile also FIXED a real defect - the binary reported version 0.0.0 because agentVersion reads package.json relative to the module and a single file has none, so the version is now injected at build time via --define __NOEM_VERSION__ (source and binary both report 0.1.0, measured). EVIDENCE: new scripts/pty_entry_check.py (npm run check:entry) asserts node subcommands work, node interactive gives advice rather than a stack, and bun renders the home panel plus provider row (PASS); scripts/pty_smoke.py was REWRITTEN because it drove src/cli.tsx through tsx/node and asserted INK strings, which necessarily fails after the switch - it now drives the real entry under Bun and asserts on the RECONSTRUCTED SCREEN (frame_reader) rather than an ANSI-stripped byte stream, because the full-screen view redraws incrementally and the raw stream carries hello pty split across frames; every string was re-measured and a Ctrl-C exit code of exactly 0 is now asserted (PASS). Unit tests 177 + 32 = 209 pass; 13 pty scripts green. HONEST LIMITS: the local fixture daemon reports provider_id openai-compatible, which EQUALS the fallback literal, so the PTY evidence cannot distinguish the provider fix before from after - that fix is proven by content model assertions plus the Ink baseline recording plus the entry code path, and an end-to-end distinction would need a fixture configured with a different provider id; CJK assertions need a cjk_join normalisation because a wide glyph occupies two cells and frame_reader stores a spacer, and the shared frame_reader was deliberately NOT changed (it would invalidate the other 12 scripts baselines); node:ffi is still an experimental API whose shape change would break the node fallback (not the default bun path). NOT DONE AT THE TIME: deleting Ink, its dependencies and its tests, and rebuilding dist/ - BOTH were completed by slice K (see tui_ink_deleted_slice_k_2026_09_17). specified/implemented/tested/verified as above; released NO."
  tui_ink_deleted_slice_k_2026_09_17: "Slice K: Ink is DELETED and dist has been rebuilt - the retirement is complete. TWO CORRECTIONS to the earlier deletion list, both found only by re-measuring dependencies at execution time: (1) src/cli.tsx must NOT be deleted - the list called it Ink-only because it did import { render } from ink, but after slice J it no longer references Ink and is now the UNIFIED ENTRY, so following the old list would have deleted the whole CLI; (2) test/render.test.ts must NOT be deleted whole - it has seven cases and only ONE touches Ink renderMarkdown (via dynamic import), while the other six import only src/controller.js, so the whole-file deletion would have silently dropped six controller assertions. LESSON: a deletion list must be re-measured at execution time; refactoring the entry invalidates it. DELETED: src/App.tsx, src/HomeView.tsx, src/ComposerView.tsx, src/markdown.ts, test/app.test.tsx, test/homeview.test.tsx, test/ink-home-baseline.test.tsx; dependencies ink, marked, marked-terminal, @types/marked-terminal, ink-testing-library. KEPT (easy to delete by mistake, both now annotated in-file): src/highlight.ts, which src/opentui/code-highlight.ts depends on for EXTENSION_LANGUAGE despite reading like an Ink-only name, and src/home.ts. The frozen snapshot test/fixtures/ink-home-baseline.ts survives, which is exactly what its separability was designed for: the recorder test that re-measured live Ink was deleted with Ink, as planned, and the snapshot is now a historical record that the surviving drift guard compares against. ASSERTIONS MOVED BEFORE DELETION: the shortenPath case was migrated verbatim from the retired test/homeview.test.tsx into test/opentui-home.test.tsx (home-relative, sibling-directory boundary, width cap, non-home passthrough); the deleted markdown assertion intent is carried by test/opentui-code-highlight.test.ts and scripts/highlight_render_check.ts, noted in the file header so it is not mistaken for a coverage hole. COVERAGE COST, recorded honestly: the deleted test/app.test.tsx held SIXTEEN integration tests. Most of their behaviour is still covered for the shipping view (Ctrl-R by pty_search_check plus viewkeys units; vim by pty_fullscreen_vim plus opentui-vim; palette/selector by pty_fullscreen_parity_a plus opentui-overlays; approval y by pty_smoke phase 3; the first-frame home panel by pty_home_frame_check; ctrl-p history by viewkeys units, including the agents-panel shadowing case), but THREE have no equivalent assertion: backspace (macOS 0x7f deleting the previous character), ctrl-d forward delete, and multi-line paste CR/CRLF normalisation. Those are now handled natively by the opentui textarea and the pty scripts merely USE backspace to clear the composer without asserting it. So this is not unchanged coverage - it is Ink integration tests replaced by opentui units plus pty integration; closing the three would mean asserting them on the full-screen view, not restoring Ink tests. ALSO FOUND (PRE-EXISTING, not caused here): npm install could never succeed because the root declared react-devtools-core ^8.0.0 while @opentui/react@0.5.11 peer-requires ^7.0.1 (the lockfile had presumably been generated by bun, which hid it); the declaration is now aligned to ^7.0.1 and npm install completes, followed by a full net re-run. INDEPENDENT CORROBORATION: @opentui/core@0.5.11 itself declares engines { bun: >=1.3.0, node: >=26.4.0 }, which matches the slice J measurement that node works from 26 and confirms Bun is a first-class target. EVIDENCE: dist was rebuilt and contains no Ink artefacts, dist/cli.js carries the bun shebang and is executable, ./dist/cli.js --version prints 0.1.0, and the view-free subcommands still run under node; the BUILT artefact was additionally driven in a pty (bun dist/cli.js), where the first frame rendered the full home panel with header and provider row and no native-library error; the single-file compile was re-verified (--version 0.1.0); unit tests 187 pass with 0 fail in a single group (previously 209 across two), and all 13 pty scripts are green after the dependency change; package-lock.json and bun.lock were both updated and no longer mention ink or marked-terminal. NOTE: apps/cli-ts/dist is NOT tracked by git, so rebuilding it produces no commit content - it is a pre-release step that was executed and verified here. STILL OPEN: no distribution of the Linux sandbox and provider live smoke (needs a key). CORRECTED 2026-09-17: (a) P3a-2 is no longer unimplemented - SurfaceSessionSummary.awaiting_approval plus the agents-tree session marker ARE implemented on this branch (21d842c5 introduced the field as has_pending_approval, 9dabc0e2 renamed it after the sessions-listing no-leak tripwire rejected the old substring; packages/contracts/src/agent_os_contracts/surface.py:186, apps/api_server/app.py:2703, apps/cli-ts/src/contracts.ts:78, apps/cli-ts/src/opentui/agent-tree-source.ts:92), but it is NOT in origin/main and still MISSING the GC/CTO gate and a contract minor-version decision - CORRECTED 2026-09-18 on re-measurement, this pin said 'NOT pushed' and that was wrong: both commits ARE pushed to the feature branch origin/tui/parity-f-code-highlight (tip 9dabc0e2; measured with `git branch -r --contains 21d842c5` / `9dabc0e2`, and `git show origin/tui/parity-f-code-highlight:apps/cli-ts/src/contracts.ts` carries awaiting_approval at line 78 while origin/main carries it nowhere), so what is missing is the merge into main, not the push - SURFACE_PROTOCOL_VERSION is still 1.1 on both the remote branch tip and main, so the additive field currently ships under an unchanged protocol version; (b) the three behaviours recorded above as having no equivalent assertion (backspace, ctrl-d, CRLF paste) now HAVE assertions on the full-screen view: apps/cli-ts/scripts/pty_fullscreen_editor_keys.py reports BACKSPACE_DELETES_PREVIOUS / CTRL_D_DELETES_FORWARD / PASTE_CRLF_IS_ONE_BREAK / EDITOR_KEYS_OK all True (c745212a corrected the harness - the earlier NOT_MET verdict was a harness defect and the product code was untouched, 73 insertions / 83 deletions in that one script). specified/implemented/tested/verified as above; released NO. STALE-POINTER NOTE 2026-09-18 (documentation pass, not a claim about this pin): the ROOT-repo facts doc ../docs/agent-cli/TERMINAL-DISTRIBUTION-STATUS-2026-09-18.md is now behind the code it measured and must be RE-MEASURED before any of its rows is quoted. Measured here: its stated baseline is HEAD 8ab29119 with an apps/cli-ts/src content fingerprint of 96f3874a5e4abaa3b8b02e81fc87c168d8198060, while at this HEAD `git rev-list --count 8ab29119..HEAD` = 32 and the same command it used (find src -type f | sort | xargs shasum | shasum, run in apps/cli-ts) yields e95d237b43c1f214386581127e884f7186c42764; and its claim that the cli-ts CI job has only 3 `run:` steps (bun install / npm test / npm run typecheck, at that file's :163/:172/:177) now measures 5 run steps inside that job (ci.yml:267 bun install --frozen-lockfile, :281 npm run test:ci - the step that doc calls `npm test` - :286 npm run typecheck, :314 the hermetic-daemon pip install, :321 bash scripts/install_smoke.sh). So its install-path table in section 1 and its section 4 binary-not-in-CI conclusion were both measured against a tree 32 commits older than this branch tip. That file lives in the ROOT repository and is NOT edited from this worktree."
  tui_runtime_identity_2026_09_18: "Runtime identity (view-side, zero protocol/kernel change). CORRECTED: resolveDaemonCommand preferred a PATH-installed `agent-os-runtime` over the checkout's own runtime, so the CLI run from a source checkout could silently attach to a DIFFERENT kernel - observed first-hand on 2026-09-17, when a check with a missing descriptor autostarted the PATH install and answered one turn with a REAL provider into the default store (~/.agent-os/agent-os.sqlite3; 147 tokens). New `resolveDaemonLaunch` returns {command, source, checkoutRoot} with the order override -> checkout (walk up for a pyproject.toml declaring the agent-os-runtime console script plus packages/os_core or uv.lock, and `uv` on PATH) -> PATH -> `uv run` -> null (error text and exit code unchanged). The spawn cwd becomes the checkout root while --workspace still points at the user's directory; the readiness poll is 50ms for the first 2s then 300ms. `doctor` now prints the launcher, its source, and the descriptor's pid/port/database/workspace, and warns when the launcher is NOT this checkout; the notes stay advisory and never change ok/exit code (code-read at this head: doctor.ts builds `notes` from launcherNotes() separately from `checks` and sets ok = checks.every(...) at doctor.ts:222, so a launcher warning cannot flip it; the end-to-end exit-code A/B was NOT re-run in this documentation pass). Cold start is a same-harness A/B on ONE machine (macOS arm64, warm uv cache) in the no-daemon/no-descriptor state, not a performance promise and not a product latency claim: 611/614/613ms before -> 374-420ms after, as recorded when 068b189c landed; re-measured at this head 2026-09-18 with the same shape (descriptor/database/workspace all explicit under a temp dir, the checkout launcher) over three runs, first run coldest: 533/413/413ms. Evidence: apps/cli-ts suite 195->205 pass (re-measured in this pass: `npm test` = 205 tests / 205 pass / 0 fail), typecheck 0 (re-measured: `npm run typecheck` exit 0). CORRECTED 2026-09-18 (documentation pass, HEAD 203b8862): the CI step is NOT `npm test`. `grep -n 'npm run' .github/workflows/ci.yml` -> ci.yml:281 `run: npm run test:ci`, i.e. scripts/test-ci.mjs, one bounded process per test file (the step was switched from `npm test` by 2267e62b because a hang on the Linux runner gave no attribution), and the string `test:ci` has zero hits in this pin. Re-measured at this HEAD: `npm run test:ci` = 34 files / 225 tests / 225 pass / 0 fail in 8s, and `npm test` (the local single-process form, stdout piped) = 225 tests / 225 pass / 0 fail; the CI log of run 35272942676 agrees (34 files, sum of per-file `# pass` = 225, `# fail` = 0). The 205 figure was correct when this pin was written and is now stale on both runner and case count. Also scripts/e2e.sh ALL PASS and scripts/install_smoke.sh 8 passed/0 failed (both as recorded at 068b189c; NOT re-run in this pass because they start daemons); the resolution order is covered by test/daemon.test.ts (+5) and test/doctor.test.ts (+5) with mutation checks (counts not re-taken here). STILL OPEN and bigger than this change: `ensureDaemon` attaches to ANY healthy descriptor, so an already-running daemon of another kernel is still used - doctor only makes it visible, it does not prevent it; `AGENT_OS_RUNTIME_CMD` still wins by design. KNOWN DEFECT AT HEAD 426249e6 (measured 2026-09-18; a fix was in flight from a separate writer at the time - this defect report is preserved for the record but it no longer describes the tree; the resolution is recorded at the end of this pin): the checkout-first order has NO fallback, so a checkout that cannot actually run its runtime SHADOWS a launcher that IS available on PATH and then blind-waits the entire timeout. Repro with a synthetic checkout (a pyproject.toml declaring the agent-os-runtime console script plus packages/os_core, a failing `uv` placed first on PATH, and an `agent-os-runtime` executable also on PATH that records whether it is ever invoked): resolveDaemonLaunch returns {command: [uv, run, agent-os-runtime], source: checkout} even though agent-os-runtime is on PATH, and ensureDaemon then throws 'daemon did not become ready in time' after 20120ms with the PATH launcher never invoked (its marker file absent), i.e. 20s spent and no daemon. Code: daemon.ts:118-137 (the checkout branch returns unconditionally, with no fallback) and daemon.ts:318-333 (deadline = now + timeoutSeconds (default 20) and the poll loop can only time out, never try another launcher). Impact: on a machine whose checkout cannot start its runtime while a PATH install could, every auto-start costs the full 20s and then fails, and nothing tells the operator the PATH runtime exists. RESOLVED 2026-09-18 (documentation pass, HEAD 203b8862): the fix this pin called IN-FLIGHT (uncommitted, no commit hash) IS LANDED AND PUSHED as 71044ceb (fix(tui): fall back when the checkout launcher cannot start; `git log --oneline -1 71044ceb` -> 71044ceb, `git branch -r --contains 71044ceb` -> origin/tui/parity-f-code-highlight). What it does, code-read at this HEAD: resolveDaemonCandidates (daemon.ts:147) returns an ORDERED chain override -> checkout -> PATH -> uv, and ensureDaemon walks that chain inside ONE shared deadline (daemon.ts:722 deadline = resolved.now() + (options.timeoutSeconds ?? 20) * 1000, poll loop at daemon.ts:725-726), so a launcher that dies before readiness hands over to the next candidate instead of waiting the deadline out, with the hand-over REPORTED on stderr plus the child's bounded, redacted stderr tail. The three probe timings above (2155ms chain) were measured on the working tree that became 71044ceb; the 20120ms blind-wait number describes HEAD 426249e6 only and must not be re-quoted for the current tree. The probe's own limit still stands, unchanged: it establishes that the fallback path is exercised, and it does NOT establish that a real PATH install would come up, because both probe launchers are shims that always exit non-zero. Coverage in the same commit: test/daemon.test.ts:481 resolveDaemonCandidates orders the checkout, PATH and uv launchers, :509 ensureDaemon falls back when the preferred launcher dies before readiness, :715 ensureDaemon keeps AGENT_OS_RUNTIME_CMD above the whole fallback chain; stat 568/4/299/30 across apps/cli-ts/src/daemon.ts, src/doctor.ts, test/daemon.test.ts, test/doctor.test.ts. PUSH STATUS CORRECTED 2026-09-18: the earlier wording here said HEAD 426249e6 is not pushed and the remote tip is 9dabc0e2 - that is stale. Measured now: HEAD = 203b8862, `git rev-list --left-right --count origin/tui/parity-f-code-highlight...HEAD` = 0 0, `gh pr view 69` head=203b886206f7de0d003d5bc13c768f8710fead1f, mergeable MERGEABLE, mergeStateStatus CLEAN, reviewDecision EMPTY (no approving or changes-requested review recorded; the field only reflects those), state OPEN. implemented/tested on this branch; not merged to main, not released - that part stands."
  workspace_search_scan_cap_honesty_2026_09_18: "workspace.search honesty (developer-domain capability; no protocol/kernel change). DEFECT FIXED: the grep payload collapsed three different situations into one `truncated: true` - the 200-match cap, the 20000-char cap and the 1000-file SCAN cap (scanned > 1000 -> break). With 1500 files whose only match sorts after the 1000th, the result was {mode: grep, matches: [], truncated: true}: an empty match list that reads as 'not found', while `truncated` is equally true when 200 matches were found. Each payload (ls/glob/grep) now carries truncated_reason (null|scan_cap|result_cap|output_cap, upstream cap wins) and grep adds exact scanned_files plus unexamined_files. CORRECTED 2026-09-18 (round-2 review): this pin first called that field `unexamined_paths` and justified it as `paths rather than files, because counting files would need the stat/resolve overhead the cap exists to avoid` - both wrong. It counted enumerated PATHS that the walk would never read (directories, symlinks, oversized files, plus anything skipped before the cap), so 1001 files + 3000 empty directories reported 3001 `unexamined` for 1 real file, and the test's `scanned + unexamined == total` only held in a flat all-searchable directory. The field is now `unexamined_files` and counts FILES the walk would read, using one shared `_search_scannable_file` predicate plus a per-directory resolve cache, so `scanned_files + unexamined_files` equals the tree's searchable file count whatever is mixed in. The cache makes it cheaper rather than dearer: grep scan_cap over 1001 files + 3000 dirs 182.57 -> 163.11ms, 10x400 nested 83.17 -> 74.34ms, complete 60-file scan 3.79 -> 1.92ms (medians of 5, same session). The one regression is a large tree that already reached the 200-match cap: glob 35.71 -> 47.94ms, because the walk must now see one match past the cap to prove entries were dropped. Also fixed in the same pass: glob reported `result_cap` at EXACTLY 200 matches (it used `>=` where ls used `>`), so a complete walk was labelled truncated - inherited from the old code, but the new reason field made it a machine-readable false signal. Diagnostic keys are emitted BEFORE the payload so they survive agent_loop's 8000-char preview (verified: preview_carries_truncated_reason True, where the old key order lost it). CORRECTED 2026-09-18 - this pin said the old-key output was 'byte-identical across 16 scenarios (diff empty)' and that was wrong: the diagnostic keys are deliberately placed FIRST, so the old keys' VALUES are unchanged while the serialized BYTES are not. Re-measured against the pre-change module (commit 9b8830ba^) over 20 scenarios (19 payload scenarios + 1 invalid-pattern error case; ls/glob/grep, all three caps, the 1000-file boundary at 1000/1001/1500, and the skip rules for skip-dirs, symlinks, oversized and non-UTF-8 files): the old keys' values are equal in 20/20 scenarios and the serialized bytes are equal in 0/19 payload scenarios. So: old-key values unchanged, key order intentionally moved (diagnostics ahead of the payload); byte-identity was never the intent and no consumer should be told to expect it. Every cap and skip rule IS unchanged in those same 20 scenarios. Tests: new tests/product/test_workspace_search_scan_cap.py, 7 cases including the 1500-file last-match repro (re-measured: 7 passed); CORRECTED 2026-09-18 - the claim that reverting the new fields turns 6 of these tests red is wrong. Run against the pre-change module the test module does not collect at all: its module-level `DeveloperWorkspaceAdapter._SEARCH_MAX_SCANNED_FILES` access raises AttributeError, pytest reports 1 error during collection, 0 cases run, exit 2. A reverting writer would see a COLLECTION ERROR, not six red tests. Latency unchanged within noise (scan_cap 74.91->75.13ms, complete 60 files 4.23->4.26ms, glob 19.30->19.43ms; medians of 3). HONEST LIMIT: a consumer that only reads `matches` still misjudges - a field cannot force a reader to look. CORRECTED 2026-09-18 (documentation pass, HEAD 203b8862): the second half of that limit - that the model-facing tool description does not yet document truncated_reason - is NO LONGER TRUE, and it contradicted the tool-description pin in this same file. It IS documented now: `grep -n truncated_reason packages/os_core/src/agent_os_core/provider.py` -> provider.py:1121-1127, and tests/product/test_workspace_tool_descriptions.py:286 asserts truncated_reason is present in the delivered description, so only the first half of the limit stands. PUSH STATUS CORRECTED 2026-09-18: the trailing not-pushed claim was stale - measured now, `git rev-list --left-right --count origin/tui/parity-f-code-highlight...HEAD` = 0 0, so this branch tip IS pushed (PR #69, head 203b886206f7de0d003d5bc13c768f8710fead1f, mergeStateStatus CLEAN, reviewDecision empty). implemented/tested on this branch; not merged to main, not released."
  tui_tool_descriptions_2026_09_18: "Model-facing tool descriptions (packages/os_core provider; no protocol/kernel behaviour change). DEFECT FIXED: `_tool_definition` gave EVERY tool the same sentence (`Propose typed capability {id}`), so the model had no statement of what a tool does and - more importantly - no statement of what its RESULT means. That made yesterday's honesty fix invisible to its only consumer: the grep result carries truncated_reason (scan_cap|result_cap|output_cap) plus scanned_files/unexamined_files, and nothing told the model that `matches: []` with `truncated_reason=scan_cap` does NOT establish that a match is absent. Now a `_TOOL_DESCRIPTIONS` table covers the eight workspace/artifact/session tools that are actually offered (workspace.read/search/edit/apply_patch/run_tests/shell, artifact.write, session.todo_write) with factual text: what the tool does, its modes/parameters, its key result fields, and the effect class and risk tier read from CapabilitySpec/ACTION_RISK_TIERS (artifact.write is stated as not in the E2 allowlist rather than as auto-approved). Tools without a specific entry keep the generic fallback, so no tool gains or loses availability. All three transports (OpenAI tools, Anthropic tools, Gemini functionDeclarations) go through `_tool_definition`, so one table covers them. Evidence: tests/product/test_workspace_tool_descriptions.py (9 cases) locks the key set, non-empty and non-generic descriptions, the search diagnostics, the cap NUMBERS against DeveloperWorkspaceAdapter._SEARCH_MAX_*, the effect class/tier per description, carriage in the real request body and both other transports, and the fallback; mutations: reverting to the generic sentence reddens 7, deleting the 'no match does not exist' clause reddens exactly 2, changing a cap number reddens 1. NOT claimed: that a model understands the text (only that it is delivered). NOT covered: src/aac/llm_client.py, which passes caller-supplied descriptions straight through."
  ci_product_gate_file_set_2026_09_18: "CI product gate hardened from a magnitude floor to a FILE SET gate, plus a wall clock for the test job. The 2500-item floor only caught a collapse: narrowing to a subset that still collects 2500+ items, or adding `--ignore` to both the collect and the run line, stayed green (the earlier round made both lines read one PRODUCT_ARGS variable, so a narrower target now shrinks what the floor measures, but a magnitude floor cannot see a removal). The step now also derives the expected file set from `find tests/product -maxdepth 1 -type f -name 'test_*.py'` and the collected file set from the pytest per-item lines, and fails with the difference via `comm -23`; the find root is deliberately the literal governed root rather than $PRODUCT_ARGS, otherwise a narrowed target would shrink the expectation too. Files that legitimately collect nothing need an explicit, commented allowlist (empty today: 157/157 collected when this pin was written; CORRECTED 2026-09-18 at HEAD 203b8862 - re-measured 161/161: `find tests/product -maxdepth 1 -type f -name 'test_*.py' | wc -l` = 161 and the collection's distinct file count from `pytest tests/product -q --collect-only` is also 161, so the allowlist is still correctly EMPTY and only the number had gone stale) and a wildcard entry is rejected - a quoted-value `case` guard, because an unquoted expansion inside a `for` loop glob-expands first and silently accepted `\"*\"` (found and fixed in the same pass). The `test` job also gained timeout-minutes: 30 (a hung Python job previously rode the 360-minute default; cli-ts already had one). MEASURED 2026-09-18 at HEAD 203b8862, because a later note in this file still claims the workflow has none: `grep -n timeout-minutes .github/workflows/ci.yml` -> :28 `timeout-minutes: 30` (the `test` job, added by 7e20cc19 at 02:31) and :235 `timeout-minutes: 20` (the `cli-ts` job, added by 46327499 at 01:57, i.e. the cli-ts bound really did come first), so BOTH jobs are bounded and any note asserting otherwise is stale. Wiring tests 11 (was 9). Mutations verified: `--ignore` on both lines -> file-set gate red (with the magnitude floor passing); target narrowed to one file -> floor red; file-set block deleted -> red; wildcard allowlist -> both red; removing the test-job timeout -> wiring red. STILL VISIBLE TO NEITHER GATE: deleting test FUNCTIONS inside a file, deleting a file from disk (the expectation shrinks with it unless the magnitude floor also trips), and `-k` placed on the shared PRODUCT_ARGS. Those need per-file case-count baselines, which is not done."
  situated_wave1_daemon_leak_2026_09_18: "TEST-HYGIENE DEFECT FIXED in tests/product/test_surface_wave1_e2e.py: the restart case starts a second runtime daemon and the `finally` block only closed the provider, so it never stopped that daemon - every run of the product suite leaked one `apps.runtime_daemon` process holding its descriptor port and SQLite database. Measured on this machine: 28 accumulated after this session's suite runs (24 from CI-verification venvs), and the earlier orphan checks in this session were blind to the class because they matched the `dev_daemon.py` argument pattern instead. Now the current daemon is stopped in `finally` and every daemon this module starts is registered in `_ACTIVE_DAEMONS` and terminated by an atexit handler - necessary because the children are started with `start_new_session=True`, so Ctrl-C or a killed pytest never reaches them. Evidence: two consecutive runs of the file leave 0 matching processes (was +1 per run), the file passes, and ruff/format are clean. LESSON for this line: 'no orphans' must be asserted against the runtime-daemon pattern too, and ideally by the test that spawns it."
  tui_durable_drain_failure_visibility_2026_09_18: "A stalled turn now says WHICH kind of stall it is (apps/cli-ts/src/controller.ts). `drainDurable` fetched the durable task events with `.catch(() => undefined)`, so a permanently failing batch - the new batch-sequence contract rejecting a contradictory batch, a parse error, a 5xx, a rotated token - reached the user as the same bare typed `stalled` state as a quiet daemon, and the reason was unrecoverable. Fail-closed behaviour is unchanged (the cursor still does not advance on a batch that could not be read, so nothing is skipped); the controller now remembers the rejection message, clears it on the next good batch and at the start of each durable wait, and the stall notice distinguishes `no durable resolution within <stallMs>ms (the daemon has not reported the outcome yet)` from `durable event drain failed: <message> - the cursor stays at <n>`, both pointing at /retry and /status. The batch is still retried every poll rather than abandoned. Evidence: new test in apps/cli-ts/test/controller.test.ts drives a client whose events() always rejects and asserts the stalled state names the drain error and that the drain is retried (eventsCalls > 1); reverting the catch to `() => undefined` reddens exactly that test; apps/cli-ts suite 218 pass (was 217) and typecheck clean. NOTE the audit this came from was cut short: the 6-shard failure-path audit swarm could not run (subagent calls failed with 402 Insufficient Balance), so the remaining failure paths - provider/credential errors, approval timeout, permission DENY, tool/workspace failures, transport/protocol errors, CLI/state-file failures - are still UNMEASURED here; only this one was inspected by hand."
  provider_failure_visibility_2026_09_18: "The most common real provider failure now says what it is (packages/os_core provider.py). Every HTTP error produced the message `provider HTTP <code>`, and that message becomes the turn's FINAL TEXT - the only thing the operator reads - so a wrong/expired key surfaced as an unexplained failure next to the stop reason provider_failure:AUTHENTICATION_FAILED. The classification was already right (401/403 -> AUTHENTICATION_FAILED, 429 -> RATE_LIMITED, 408/425 and 5xx -> UNAVAILABLE, other 4xx -> MALFORMED) but untested, and the text carried no cause and no next step. Now: `provider rejected the credential (HTTP 401) - check the configured provider key or re-run /provider`, `provider rate limited (HTTP 429) - retrying`, `provider unavailable (HTTP 503) - retrying`, `provider rejected the request (HTTP 400)`. The credential value itself is never included: safe_message is durable and operator-visible. Evidence: new tests/product/test_provider_failure_visibility.py (5 cases) pins the status->code mapping, retryability, the wording, that the raw key and its payload part appear nowhere in the serialised failure, and that ordinary traffic still returns a ProviderResponse; reverting the wording to `provider HTTP <code>` reddens exactly the three message assertions. DEFECT FOUND AND PARTLY CLOSED 2026-09-18 (commit b9cb63d5): as first found, ProviderErrorCode.REFUSED had no producer anywhere in the tree - `_parse_completion` read only message.content, so an OpenAI-compatible refusal (content:null plus refusal:\"...\") became an EMPTY reply rather than a refusal, the streaming path the TUI uses ignored delta.refusal entirely, and finish_reason content_filter took the same shape. BOTH OPENAI-COMPATIBLE PATHS NOW MAP IT: non-streaming reads message.refusal or the content_filter finish reason, streaming accumulates delta.refusal or the same finish reason, and either ends as a typed REFUSED failure reading `provider refused: <text>`, bounded to 300 chars so a runaway refusal cannot bloat the durable record, never streamed as assistant text and never carrying the credential. The test file grew to 9 cases; making both checks unreachable reddens exactly 3 and leaves the other 6 green; suite 2665 passed / 1 skipped. CLOSED 2026-09-18 (later the same day): the Anthropic (stop_reason equal to the refusal marker, plus stop_details on the streaming message_delta) and Gemini (promptFeedback.blockReason, and finishReason in SAFETY / RECITATION / PROHIBITED_CONTENT / SPII / BLOCKLIST) equivalents are mapped too, through an overridable `_refusal_text` hook plus one shared `_refusal` builder; 10 more cases cover both adapters on both paths, the category fallback, BLOCKED_REASON_UNSPECIFIED deliberately NOT counting as a refusal, and the 300-char bound. CORRECTION to the sentence this replaces: a refusal from those two adapters did NOT arrive as an empty answer - `_parse_completion` raised, so the operator saw `provider response malformed: ValidationError` (Anthropic) / `...ValueError` (Gemini), i.e. the WRONG CAUSE; the empty-answer shape was the OpenAI-compatible one, where refusal is a sibling field of a null content. The shapes come from the official SDK type definitions because the REST doc sites were unreachable from this machine: implemented and tested, but NOT verified against a live Anthropic or Gemini endpoint."
  tool_failure_visibility_audit_2026_09_18: "Failure-path audit of the tool/workspace layer, run against in-process surface + a real daemon + the bun CLI + a real TUI pty (artifacts /tmp/audit/d/). HEADLINE: no failure class was completely actionable on any user-facing surface. FIXED IN THE SAME TURN (commit: the truncation-summary change): the search truncation diagnostics were INVISIBLE to the model. My earlier 'put the diagnostic keys before the payload' fix was defeated one layer up - `canonical_output` sorts keys, so a grep payload renders as matches, mode, scanned_files, truncated, truncated_reason, unexamined_files, and `_truncate_json`'s preview is a raw prefix of that rendering: the moment the payload exceeds 8000 chars the reason and the counts are cut off, and an empty `matches` reads as 'not found'. `_truncate_json` now also carries a bounded `summary` of the top-level scalars (long strings become `<omitted: N chars>` so a 5 MB read cannot re-inflate it). 4 tests, mutation-verified (dropping the summary reddens 2). OPEN P0 - A FAILING TEST RUN LOOKS LIKE A SUCCESS: `workspace.run_tests` with exit 1 produced `☑ workspace.run_tests` in the TUI, `- tool [done]` in /export and `subtype success, is_error false, EXIT=0` headless, with a receipt of SUCCEEDED/error:none; `workspace.shell` non-zero behaves the same. The OBVIOUS FIX IS WRONG and was tried and reverted: stamping the receipt FAILED from a non-zero exit code broke 11 long-horizon/selfdev/responsibility tests, because a receipt attests that the DISPATCH executed and its effect is known (ReceiptStatus is a dispatch lifecycle, and post-dispatch uncertainty is UNKNOWN), while the goal verdict is computed separately by the selfdev flow from `verification_exit_code` -> NOT_MET. The experiment is the evidence for where the fix must not go; the fix belongs on the operator surface (carry the tool's exit code into the tool-card event / resultSummary). NOT DONE. OPEN P0 - SILENT HANG: reading a non-UTF-8 file and editing inside a read-only directory produce NO tool result at all - the broker wraps the error after the durable reservation as CapabilityEffectUnknown and the loop raises instead of feeding a tool result back, so the model waits forever, the turn never completes (150 s observed), the session sits PAUSED and the operator sees only the 30 s stall notice with no reason; one path also leaks a host absolute path into model-visible text. NOT DONE. OPEN P1s: preflight denials produce no receipt at all, so the TUI tool row stays pending forever with no reason; `apply_patch` without expected_sha256 overwrites unconditionally; a chmod 444 file is edited and silently becomes 600; `formatToolDetail` (the Ctrl-O detail panel) has no call site while the help text still advertises ctrl-o, so resultSummary - the only place with error_code/exit information - may be reachable only through /export and search. NOT DONE."
  tool_failure_visibility_round2_2026_09_18: "Second failure-path round: four fixes landed and three new defects were found on the tool-failure surfaces. FIXED (1) a failing `workspace.run_tests` now shows as a failure to the operator: the tool card reads `⚠ workspace.run_tests · python -m pytest · exit 1 · artifacts 1` and /export writes `- tool [error] ... — exit 1`, derived from the durable NODE_COMPLETED output (the receipt still attests the dispatch, unchanged); 6 controller tests, mutation-verified, cli-ts suite 218 -> 224. (2) A dispatched action whose effect is UNKNOWN no longer hangs the turn: the loop now answers the proposal with a model-visible tool result (reason_code, requires_human_review, not retried) and the other proposals with not_executed, and completes the turn as `unknown_requires_review` when the projection permits; measured 150s-with-no-completion -> 0s with a truthful stop reason; fail-closed is preserved (no seal, Run stays PAUSED, resume still refused, one dispatch only). (3) A read-only file (mode 0444) is now refused with an actionable message instead of being edited and silently chmod-ed to 0600, and `apply_patch` without `expected_sha256` on an existing file now DISCLOSES it (`overwrite_guard: unchecked_existing_overwrite`) rather than overwriting silently - disclosure, not enforcement, because the tool schema marks the digest optional and dozens of existing flows pass no digest; host absolute paths are no longer copied into model-visible error text. (4) Anthropic and Gemini refusals are mapped (see the provider pin above, corrected there). Suite 2669 -> 2712 passed / 1 skipped ON macOS - PLATFORM QUALIFICATION ADDED 2026-09-18 (documentation pass, HEAD 203b8862), because the earlier wording quoted that figure without saying which machine produced it. Re-measured on this macOS arm64 machine: `PYTHONPATH=src:packages/contracts/src:packages/os_core/src .venv/bin/python -m pytest tests/product -q` -> 2712 passed, 1 skipped in 217.59s, exit 0 (2713 outcomes, which is the same collection size the Linux runner reported at this commit: 2713). CAVEAT ON EVERY LOCAL COUNT IN THIS NOTE: this worktree is shared with concurrent writers who are adding cases under tests/product, so a local collection is not frozen - during this same pass `find tests/product -maxdepth 1 -type f -name 'test_*.py' | wc -l` went 161 -> 163 and a collect-only taken 30 seconds after the run above returned 2719 items, six more than the run, because a peer had landed 6 new cases in tests/product/test_ci_gate_wiring.py at 07:30:23 (that file measured 9, then 11, then 17 cases across this pass), and a later collect-only returned 2731. Only the CI numbers below are pinned to the commit and therefore comparable; the local figures are timestamped observations on a moving tree. The Linux CI runner on the SAME commit reports a DIFFERENT number: `gh run view 35272942676 --log` -> `tests/product collected 2713 items` then `2706 passed, 7 skipped in 201.55s`. The COLLECTION is the SAME SIZE on both platforms at this commit (2713 items); what differs is the OUTCOME, and the whole difference is skips: 6 tests that PASS on macOS are SKIPPED on Linux, because they are platform-conditional, not because the suites differ. On Linux 6 more tests carry a skip that macOS does not need - 4 behind REQUIRES_OS_SANDBOX (shutil.which('sandbox-exec') is None on Linux; re-measured by running the two decorated modules with sandbox-exec hidden -> exactly 3 in test_responsibility_controller.py:1112/:1316/:1776 and 1 in test_selfdev_scoped_verifier.py:278) plus the 2 macOS-only Seatbelt cases in test_os_sandbox.py (:142 profile digest, :223 confinement; re-measured by forcing the module's _MACOS to False, which raises both skips). The 1 skip present on BOTH platforms is the opt-in live provider smoke (test_live_provider_smoke.py:18). So 2712/1 is the macOS number and 2706/7 is the Linux CI number; neither should be quoted as the platform-free result. NEW DEFECTS FOUND AND NOT YET FIXED - (A) P0 CORRIGIBILITY: pressing Esc mid-turn loses the correction silently. The controller sends a stale expected_event_sequence (7 while the kernel is at 9), the kernel answers 409 SurfaceSequenceConflict, and keys.ts swallows it with `.catch(() => undefined)`; no CORRECTION_WRITTEN is recorded and the user believes they corrected the run. `/mode` had exactly this refresh fix applied; `correct` never got it. Reproduced with a refreshed request returning 200 + CORRECTION_WRITTEN as the counterexample. (B) P0 TRUTHFULNESS: a permission DENY never reaches the operator. The durable POLICY_VERDICT_RECORDED carries basis/rule_id but the model only sees 'an operator permission rule forbids this capability' (no rule id), cli-ts renders neither the verdict event nor a tool card, and headless reports `success / is_error false / EXIT=0` while the file is untouched - so a model that says 'done' is believed. (C) P0 TRANSPORT: the STREAM batch schema lacks the self-consistency rule the durable-events schema already has, so a dropped final cursor frame yields the reply TWICE with `exit 0 / subtype success` (3/3 reproductions; client.ts uses `cursor = batch.next_sequence`). (D) P1 IDENTITY: auto-start silently deletes the descriptor the user passed, starts a different daemon (new pid, port and token) with empty stderr and exit 0 - 'the runtime I pointed at is not the runtime in use' - and on failure the user is left without their descriptor at all. (E) P1 CLI: an unknown flag is accepted silently and a turn really runs; `-p` with no value silently mounts the TUI; `--descriptor` with no value silently falls back to the default path. (F) P1 STATE: a corrupted, wrong-typed, unwritable or 100k-entry state file is silently ignored or reset - no warning on any surface (history silently reverts to empty). (G) P1: the Ctrl-O detail panel is unreachable (the help text was corrected to say so rather than wired up, and resultSummary is the only place error_code/exit information appears); headless `--output-format json` still reports success for a failed tool run because headless.ts summarises the turn, not the tools - a Python/TS cooperation fix nobody has done yet."
  tool_failure_visibility_round3_2026_09_18: "Third failure-path review (6 read-only shards over the 10 commits pushed since round 2) and the fixes it produced. VERDICTS: R2 APPROVE - the unknown-effect completion was verified fail-closed (no seal, Run still PAUSED, resume still refused with UNKNOWN_REQUIRES_REVIEW, one dispatch only, 5 of the 7 pre-existing assertions kept and the 2 removed were the defect assertions); R1/R3/R4/R5/R6 REVISE. FIXED: (1) shell `noem session correct|pause|resume` NEVER worked - session-command.ts called correct() without refreshing the tracked sequence, and a fresh process starts at 0, so all three answered 409 'expected event sequence 0 does not match current sequence 12' (measured 9/9 before, 9/9 exit 0 after); it now refreshes, retries a conflict once after refreshing, reuses one idempotency key, and reports the real reason on stderr with a non-zero exit. (2) the TUI correction refresh was NOT atomic - the daemon advances durable events between the GET and the POST, so 3 of 6 natural Esc presses still hit 409 (20/20 under load); it now retries after a refresh (bounded, same key, so an applied correction is never re-sent), measured 20/20 rounds succeeding with 20 conflicts absorbed. (3) three Esc presses produced three POSTs and three identical notices; an in-flight correction is now joined instead. (4) `/mode` failures were UNHANDLED REJECTIONS with no transcript notice; caught and reported, still-<old mode> named. (5) A PREFLIGHT REFUSAL (the read-only file case added here) produced NO receipt and NO completion event, so the tool card sat at pending forever and /export printed `tool [pending]` - the operator-side half of that very fix did not work; the kernel now records NODE_FAILED for a dispatch that sealed nothing and the controller maps it (card -> failed with the reason, replay-idempotent). CORRECTION: my earlier commit message claimed 'the receipt is a clean denial' - that was WRONG, there is no receipt at all on that path. (6) redaction: single-segment absolute paths like /secret were already handled, but `~`-prefixed paths leaked into model-visible text and root `/tmp/x/ws` collided with `/tmp/x/ws-backup/...` (rewritten as `.-backup/...`); both fixed by `~` handling and segment-boundary comparison. (7) provider: three Gemini IMAGE_* block reasons were missing (they fell to MALFORMED), and the refusal text - which becomes the turn's final text - was passed through raw, so absolute paths, `sk-` keys, newlines and ANSI escapes could be injected; it is now sanitized (ANSI/control/bidi stripped, isolated surrogates removed, host paths and sk- keys redacted, newlines flattened, still 300 chars), and `_refusal_text` is in the documented hook contract with tests that force an adapter to implement it. (8) CI self-guard: it asserted ci.yml TEXT, so `npm run test:noop` (with a same-named script) passed all ten assertions, and rewriting `test:ci` to `echo ...` made CI run zero tests with exit 0; the gate now asserts the executed entry point, that it is not a no-op, and that its reported file set equals BOTH the recursive on-disk set and scripts.test, with a suite budget (720 s) below the job cap, skip bounds (-rs, <=12) and path-form exemptions. (9) the stale claims this review found in CURRENT_STATE were corrected (platform split 2712/1 macOS vs 2706/7 Linux CI, the landed 71044ceb fallback, push status, run ids, 161 test files). NEW DEFECTS FOUND, NOT FIXED: (a) P1 `noem session pause` cannot take effect at all - a surface session's Run stays QUEUED (the surface turn path never sets RUNNING), so pause_task raises InvalidTransitionError 'cannot move run from QUEUED to PAUSED' (app.py:2487 + task_service.py:2394); the fix made the failure truthful, not working; making it WORK needs more than the QUEUED->PAUSED edge - a mid-turn pause also has to halt the loop gracefully instead of raising on its next provider invocation, so it is a slice of its own rather than a one-line transition. (b) a permission DENY still produces no card at all (DENY_BY_RULE never emits ACTION_PROPOSED), so the operator sees nothing while headless reports success. (c) CLOSED 2026-09-18: an operator REJECT left the card at pending forever (same class as (5), different producer); approving now resolves the newest still-pending card for the rejected capability to failed with `rejected by the operator`, while an approval deliberately leaves the card to the durable receipt/NODE_COMPLETED events - tests in apps/cli-ts/test/controller.test.ts cover both directions, and skipping the resolution reddens exactly the rejection test."
  self_update_2026_09_18: "Upgrade path IMPLEMENTED for the installed single-file binary: `noem self-update --source <url> [--target <path>] [--check] [--status] [--json]` (apps/cli-ts/src/self-update.ts + src/self-update-command.ts, dispatched in cli.tsx BEFORE daemon resolution so a self-update cannot wake a kernel). DEFAULT OFF by construction: no default channel, no background check, no telemetry; with no source named it returns typed `no_source_configured` (exit 2) having touched neither the network nor the disk, and the source gate is checked before the install path is even resolved. Verification chain, each step gating the next: source scheme -> manifest shape (schema `noem-self-update-manifest/1`, per-platform `{file,sha256,bytes}`, bare basename only so a manifest cannot point the download outside the source directory) -> a 64-hex checksum MUST be present (`checksum_missing`) -> strictly newer than the running version (`up_to_date` / `downgrade_refused`) -> program-image shape, shebang or Mach-O/ELF/PE magic, checked in BOTH byte orders (`artifact_not_executable`) -> SHA-256 of the STAGED BYTES READ BACK FROM DISK compared to the manifest -> copy the previous bytes aside (copy, never a move, so the install path is never absent) -> atomic same-directory rename over the program file -> run the INSTALLED PATH in a FRESH process with AGENT_OS_NO_AUTOSTART=1 forced and require the published `--version`; any failure after the rename restores the previous bytes and re-verifies them (`rolled_back` / `rollback_failed`). 16 typed statuses across exit 0/1/2; an interruption journal written before the rename is resolved from what is actually installed on the next run (`interrupted_update_pending` / `interrupted_resolved`). MEASURED on this machine (macOS arm64, 2026-09-18): a real compiled 76,658,418-byte binary self-updated 0.1.0 -> 0.2.0 from a local file:// source with NO --target (it derives its own path from process.execPath; measured that a compiled bun binary's process.argv[1] and Bun.main are the virtual /$bunfs/root path and do NOT identify the installed file) and the result answered 0.2.0 in a fresh process; republishing the previous version as 0.1.0 -> `downgrade_refused`, install unchanged; publishing a TRUNCATED (1 MiB) copy of the real binary with its CORRECT checksum, so shape and integrity both pass -> posix_spawn EBADMACHO on macOS -> rejection spawn_error THERE -> `rolled_back`, with the installed file byte-identical (sha256 96d0d4e7...) to the 0.2.0 artifact and answering 0.2.0 again (CORRECTED below: that rejection KIND is macOS-specific — the same bytes come back as `exit_nonzero` on Linux — and it was never the contract); `--check` reported update_available without downloading the artifact. Tests apps/cli-ts/test/self-update.test.ts: 38 cases (CORRECTED below), fixtures served from file:// temp dirs and a loopback HTTP stub bound to an EPHEMERAL port (listen(0)), no test touches the real internet or ~/.agent-os. Gates measured at this head: apps/cli-ts `npm test` 273 pass / 0 fail, `npm run test:ci` 35 files all pass, `npm run typecheck` 0 errors. MUTATION-VERIFIED in an untracked copy of the package: skipping the digest comparison reddens 2 cases; comparing only the digest's first 8 hex chars reddens exactly the last-nibble case (added because the first mutation round DISPROVED the suite's strength there - a prefix-only comparison stayed green, so the fixture was made to differ from the true digest in one character); deleting the downgrade branch reddens the downgrade case; short-circuiting the post-install probe reddens all 4 rollback cases. HONEST LIMITS: this is integrity, NOT authenticity - a source that can serve manifest.json can serve any artifact together with a matching checksum, so older bytes carrying a FORGED newer version string are NOT detectable; no signature is verified because this repository has no signing utility and no trust anchor (the manifest schema is versioned so a signature can be added later without reinterpreting existing manifests), and the module explicitly must not claim one. A source publishing a genuinely older version IS refused. There is NO published release channel, host or artifact - publishing is a founder-reserved decision - so nothing is updatable FROM yet and `noem self-update` without an operator-supplied source refuses rather than falling back to anything. NOT an authority change: C7, permission modes, approval, policy, evidence and ActionReceipt/ReceiptStatus are neither read nor written, and the command exposes no approve/admit/seal/promote/correct/self-modify capability; it is a shell entry point with no slash command, no session and no turn input. Also not done: two concurrent self-updates on one install path are detected via the journal, not serialized by a lock; `--target` for a package-manager (non-compiled) install must be supplied by the operator because the running process is then an interpreter. DATED CORRECTION 2026-09-18 (same day, after the first push): commit c44209e9 went RED on the Linux `cli-ts` job (run 35357413172) — the truncated-image case pinned the platform-specific rejection KIND (`spawn_error`) while Linux reports `exit_nonzero` for the same bytes (that `actual` is the OBSERVED CI value; the explanation — not directly observed from this macOS machine — is that glibc `execvp` retries an ENOEXEC file as `/bin/sh <file>`, so the candidate really does start, as a shell reading binary garbage, and exits non-zero; measured on macOS for contrast: libc `execvp` there reports `Exec format error` instead of retrying, which is why that platform takes the spawn_error branch). The KIND was never the contract: the promise is 'rejected, the previous install is restored byte-for-byte, and the restored binary still answers --version', and that held on both platforms, so macOS-green/Linux-red was a test defect, not a product one. FIXED by asserting the CONTRACT (either kind means 'did not run') and by exercising BOTH kinds on ANY platform through an INJECTED probe rejection instead of waiting for the host OS to produce one; the type doc, the module header and apps/cli-ts/README now say the `spawn_error`/`exit_nonzero` split is platform-dependent and that rollback happens for both (verified by reading `runSelfUpdate`: the two kinds differ only in the wording of `detail` — the reject/restore/re-verify path is identical). Mutation-checked after the fix: skipping the rollback for `exit_nonzero` reddens the new injected case plus the two shebang cases; dropping the probe's detail from the operator message reddens exactly the new case; restoring the OLD pinned assertion while the host reports `exit_nonzero` reproduces the CI failure verbatim. Residue, stated and NOT fixed: on Linux a non-shebang image the kernel refuses is executed as a SHELL SCRIPT, so for such a candidate 'it answered --version' is only as strong as the shell not printing that string by accident; `spawnSync` (Node) offers no way to disable `execvp`'s fallback, so a fix would need a different exec primitive and is a product decision. Swept the rest of the file for the same class: no other case depends on the host OS, an executable format, spawn error codes, a compiled binary's byte count, or a platform-specific path — the 3 other kind assertions are shebang fixtures, which the KERNEL starts identically on both platforms (`exit_nonzero` deterministically), and the executable-bit, `realpath`, ephemeral-port and root-skip assertions all hold on macOS and Linux. Re-measured gates at the new head: `npm test` 273 pass / 0 fail, `npm run test:ci` 35 files all pass, `npm run typecheck` 0 errors — all on macOS; the LINUX proof is the CI job on the pushed commit, not this machine. Status: implemented / tested; verified locally on macOS at this head and pushed to branch `codex/self-update-20260918` (PR #85, still open); NOT independently reviewed and NOT merged."
  remaining_work_map_and_review_boundary_2026_09_18: "FOUNDER DECISION 2026-09-18: subagent (same-model) review is SUFFICIENT for this line, so the review condition on PR #69 is satisfied by the three review rounds recorded in the pins above and a cross-provider review is not required. The boundary is recorded with the same wording the SRL M1 merge used: every round was SUBAGENT/SAME-MODEL, so builder_id != reviewed_by is NOT satisfied and there is NO independent-provider approval - the founder accepted that explicitly. This removes the review gate only; merging main is still a separate authorization. REMAINING WORK, founder's own weighting (2026-09-18): extensibility (MCP / skills / typed hooks) ~10%, multi-agent & subagents 10%, OPERATIONS (rate limiting / retry / observability / release engineering) 35%, eval ~15%; checkpoint/rewind does not exist AT ALL yet. MEASURED OPERATIONS GAP, so the 35% is actionable rather than a number: (a) retry EXISTS - bounded exponential backoff, `AGENT_OS_PROVIDER_MAX_RETRIES` and `AGENT_OS_PROVIDER_RETRY_BASE_SECONDS`, and a stream that already emitted a delta is never retried (replaying would duplicate output); (b) `Retry-After` was IGNORED until this date and is now honoured in both RFC 9110 forms (delta-seconds and HTTP-date), bounded by `AGENT_OS_PROVIDER_MAX_RETRY_AFTER_SECONDS` (default 30 s) so a hostile or mistaken header cannot stall a turn, and only for the two retryable classes; tests: 5 new cases in test_provider_failure_visibility.py (honoured, HTTP-date, capped, garbage ignored, not honoured for a non-retryable 401), 32 pass, and removing the header read reddens exactly the three honouring cases; (c) there is NO client-side rate limiting anywhere - a repository-wide search for rate_limit/throttle returns only retry configuration; (d) observability today is the durable task-event audit, `/cost`, `/task` and `/export`, plus - added the same day - an OPT-IN machine-readable provider-attempt log (`AGENT_OS_PROVIDER_LOG` names a JSONL file; one record per model call attempt with latency, tokens, outcome, failure code and the server's retry_after, deliberately containing no prompt or completion text, 0600, append-only and never allowed to break a turn). There is still no metrics export, no trace export, and nothing writes an operator log unless that variable is set; (e) release engineering is packaging plus the CI 'install -> build -> pack -> start -> answer' check; the single-file binary and self-update are not built (CORRECTED 2026-09-18, same day: the upgrade path is now implemented as `noem self-update` — see the self_update_2026_09_18 pin — while hosting/publishing a release channel does not exist and remains a founder decision) (see the distribution doc, whose own baseline is now stale). Cross-checked against the objective's other axes on the same date: MCP is PARK (no implementation; only the non-authorizing envelope parser), there are no subagents in the surface and no typed hooks, and eval exists for the research/mandate side (product_evals/*, tests/product_eval/*) while the terminal line's own coding eval is the missing piece."
  p3_multiagent_task_tree_design_2026_09_16: "P3 (multi-agent/task tree) DESIGN PACKET, docs-only, recorded in docs/product/GC-P3-MULTIAGENT-TASK-TREE-2026-09-16.md. Status DESIGN_ONLY/DOCS_ONLY/AWAITING_CTO_GATE/NO_IMPLEMENTATION_AUTHORITY. Central finding: the frozen rev 9 one-in-flight-turn rule is PER SESSION (surface_runtime.py:73,405-421), so a multi-agent view is achievable with one session per agent WITHOUT unfreezing that invariant; same-session concurrent turns (P3b) is a separate kernel-concurrency GC needing an ADR + C6/C7 preservation proof + security review. Recommended P3a = read-only tree: optional additive fields on the session list projection (parent_session_id/mandate_id/label/pending_approval_count), relationships sourced from the existing mandate derivation tree (StandingMission.parent_mandate_digest, mandate.py:112-127), governance/creation stays API-only (Stage 2c/2d), one TuiController per session, approvals stay per-session human y/n with NO cross-session batch approval. Gates G1-G7 + security-review scope + open questions (protocol versioning policy, session->mandate/parent persistence, N upper bound) are in the packet. specified only: NOT implemented/tested/integrated/verified/released."
  p3a_architecture_brief_2026_09_16: "P3a architecture brief recorded in docs/product/AB-P3A-MULTIAGENT-TASK-TREE-2026-09-16.md (still DESIGN_ONLY/DOCS_ONLY/AWAITING_CTO_GATE). Resolves the GC open questions: (1) the hierarchy mandate -> task -> session ALREADY exists read-only (GET /v1/mandates, GET /v1/mandates/{id}/task-links, SurfaceSessionSummary.task_id via SurfaceClient.listSessions) so P3a needs NO new persistence and NO contract change; session->parent-session does not exist (agent-spawns-agent excluded); (2) stream concurrency is bounded by subscribing only the ACTIVE session (N=1 stream) and polling the rest read-only; (3) protocol versioning precedent from CP-TERMINAL-CODING-AGENT-M2 is additive -> minor bump with legacy decode, but P3a-1 triggers no change. Implementation scope: pure buildAgentTree + an agents panel in the P2 sidebar; no C7/permit/approval/TURN_IN_PROGRESS change. Founder/CTO decisions requested: approve P3a-1 scope, confirm no agent-spawns-agent, accept active-stream=1, and confirm the TUI must not render mandate statement text. specified only."
  p3a1_agents_tree_implementation_2026_09_16: "P3a-1 (read-only agents/task tree) IMPLEMENTED in the terminal client, awaiting independent review + CTO gate; ZERO protocol/kernel change. Files: apps/cli-ts/src/opentui/agents.ts (pure buildAgentTree/agentRowLine: deterministic grouping, orphan tasks under a (unlinked task) group, bounded rows with truncated flag), src/opentui/agent-tree-source.ts (read-only join of GET /v1/mandates + GET /v1/mandates/{id}/task-links + SurfaceClient.listSessions; lenient parsing, degrade-to-note, mandate fan-out cap 20), SurfaceClient.getReadOnly (GET-only, no body, no governance operation), and an agents panel in the P2 sidebar with a --no-agents flag (skips fetching when disabled). Rows render identifiers/status only - never mandate statement text or credentials. P3a-1 closing step (same PR): the agents panel now supports session switching - when the panel is selected, ctrl+up/down (or ctrl+p/n) moves the row cursor and Enter on a session row switches the active session by REUSING the existing /resume command (controller.ts:788) rather than reimplementing session binding (zero protocol/kernel change); Enter on a non-session row falls through to the composer. Safety: the /resume guard was CORRECTED after independent review found the original busy-based guard was WRONG - busy is already cleared when a turn parks on an approval (controller.ts:1044), so a switch DID move the approval surface out of view (reviewer reproduced with a real runTurn probe: status=awaiting_approval, busy=false, switch cleared pending). The guard is now the turn-state predicate canStartTurn() (controller.ts:946-955), which refuses while busy OR awaiting_approval/streaming/stalled/closed, and a controller test drives a real turn to awaiting_approval and asserts the refusal, no switch and a preserved approval surface; so a switch can never abandon an in-flight turn or hide an approval surface; non-session rows cannot trigger a switch (resumableSessionId). Cursor is clamped after each 5s tree refresh. Evidence: scripts/pty_fullscreen_p3a.py reproduced twice shows RESUMED True (transcript shows a resumed-session notice after Enter on the session row) alongside AGENTS_PANEL_PRESENT/TREE_ROWS_RENDERED/TYPABLE_WITH_AGENTS_PANEL True and HAS_AGENTS_TITLE False. Tests: agents cursor/resume/key helpers (incl. identity-stable highlight across refreshes) + a controller test driving a real turn to awaiting_approval and asserting the refusal with no switch; full suite 164 pass. Honest limit: the hermetic daemon has a single session, so the pty path switches to the same session; multi-session switching is unit-covered only, not e2e. pty evidence apps/cli-ts/scripts/pty_fullscreen_p3a.py (reproduced twice): AGENTS_PANEL_PRESENT True / TREE_ROWS_RENDERED True / TYPABLE_WITH_AGENTS_PANEL True / HAS_AGENTS_TITLE False for --no-agents. Assertion caveat (review R2): the renderer diffs cells so a post-Tab title string is not reproducible; the pty script only asserts deterministically observable facts (first-paint panel presence, tree content, composer still typable, flag removes the panel) and panel SELECTION is covered by the renderer-independent nextPanel/visiblePanels unit tests rather than screenshots. Tests: test/opentui-agents.test.ts 4 pass, test/client.test.ts now asserts getReadOnly is GET-with-no-body, cli-ts full suite 161 pass. Honest limits: the hermetic daemon has no mandate so the pty path exercises the (unlinked task) group with a real task/session; the mandate->task->session path is unit-tested only (no live mandate bootstrap e2e); active stream stays 1; no per-session pending-approval count (that would need P3a-2 additive fields, protocol 1.2, not done). Independent review: R1 = APPROVE_WITH_CONDITIONS (no runtime defect); R2 = REVISE because the evidence assertion was still not reproducible (fixing it needed a different assertion model, not a substring over frames). Corrections: deterministic mandate subset, code-point ordering, polling gated by panel visibility, getReadOnly GET/no-body test, and pty assertions rewritten to deterministically observable facts with selection covered by unit tests (R2's core objection resolved by changing the assertion model). NO runtime defect was found in either review; released: NO."
  p3a_multisession_e2e_2026_09_16: "PASS: multi-session (cross-session) e2e is now PROVEN, replacing the same-day OPEN/NOT_MET entry which was a MISDIAGNOSIS caused by my fixture bugs (not a product issue). apps/cli-ts/scripts/pty_fullscreen_p3a_multisession.py: inside one hermetic daemon the client runs a real turn (session A), the fixture creates session B over HTTP, then the client moves the row cursor in the agents panel and presses Enter -> SWITCHED_TO_OTHER_SESSION True / PROVEN_CROSS_SESSION_SWITCH True, 3 consecutive runs. Root causes of the earlier false negative: (1) the script passed the parsed descriptor DICT instead of the path to the client, so ensureDaemon autostarted its own runtime and the fixture daemon never saw the client session; (2) the resumed-id regex assumed a space between the words and the id, but the renderer strips styling so the text is resumedsessionsession-<id>; (3) occasional failures were a refresh race (navigation before the 5s tree poll) - now the script waits until the daemon lists 2 sessions, waits one full refresh cycle, and navigates within a 45s window. Evidence discipline added: the script now proves daemon identity (DAEMON_BEFORE_BOOT/AFTER_BOOT/DAEMON_STABLE) and prints PROBE_MANDATES_STATUS/PROBE_SESSIONS, because a pty harness that does not pin the daemon can misread its own plumbing bug as a product defect. Unit coverage remains for planEnter/resumableSessionId/nextCursor/cursorKey. NOT done: simultaneous multi-session streaming (active stream stays 1, others polled)."
  m2_gate9_record_2026_09_13: "Founder merge authorization of PR #13 (2026-09-13) records M2 gate-9 acceptance for the terminal line; the GC-TERMINAL-CODING-AGENT-M2 marker RESUBMISSION_PENDING_CTO_GATE_9 / NO_IMPLEMENTATION_AUTHORITY is superseded. The former acknowledged debt (no standalone gate-9 artifact) is CLOSED 2026-09-14: docs/product/GATE9-ACCEPTANCE-TERMINAL-CODING-AGENT-M2-2026-09-14.md is the retrospective closure record (acceptance authority = CTO/founder gate 9 at df4f6ef1 + PR #13 merge; not a new independent review). GC/CP/AB carry a post-acceptance ACCEPTED_GATE_9 note; original verdicts preserved."
  os_sandbox_0_local_2026_09_14: "OS-SANDBOX-0 MERGED to main as ca06a762 (PR #17, branch codex/os-sandbox-20260913, base be37762c; founder merge-authorized 2026-09-14): opt-in macOS Seatbelt execution isolation (execution_isolation {trusted_workspace_only(default) | sandboxed}) wrapping DeveloperWorkspaceAdapter._shell/_run_tests via the reused SELFDEV profile generator; fail-closed (CapabilityDenied) when sandboxed and the OS sandbox is unavailable; evidence in shell-report/test-report (execution_isolation + sandbox_profile_sha256 binding the dispatched profile with only the volatile sandbox root masked; the SELFDEV mirror path also records its isolation). Sits BELOW permit/approval; NOT a gate/permit input; no PolicyKernel/C7 change. Legacy duplicate class absent (WorkspaceSandbox is an alias only). Verified: tests/product/test_os_sandbox.py 12 passed; targeted regressions 67 passed; ruff (pinned) clean; pyright 0; real Seatbelt probes block out-of-workspace write, network and HOME read. Independent subagent exact-diff review R1 REVISE -> remediated -> R2 APPROVE. CI note: the repo test job's unpinned ruff (0.16.x) fails repo-wide (3000+ pre-existing findings; main's recent commits fail identically); changed files have zero net-new findings. MERGED / UNRELEASED; macOS-only; Linux bubblewrap/landlock is a SEPARATE GC (founder decision 2026-09-14). Distribution (founder decision 2026-09-14): npm global install (Node>=20) is the maintained path (verified: clean 27-file tarball, npm install -g, agent-os-ts executable); Bun --compile is the APPROVED_ALTERNATIVE for single-binary pending a separate GC; Node SEA not adopted (Node 22 --experimental-)."
  srl_m1_merge_2026_09_16: "Merge window (founder-authorized 2026-09-16) PUSHED origin/main 221149e6 -> 51a8f0a1. Three local feature branches merged (no rebase): a280214e SRL execution half-loop Inc1 (SrlTaskExecutionBridge: commit -> seal -> C7 verify -> guarded start; composition-root-owned trusted plan registry, never caller-injectable) + N6/N7/N8 (registrant-bound validated registration; durable SQLite plan store; cross-tenant test); f64a3076 SRL outcome-learning gate Inc2 (OutcomeLearningGate: fail-closed, read-only admission; verify_verified_recording on the SUPPLIED outcome + full equality with the current trusted outcome; EVIDENCE_INVALID reachable); 20e0e370 M1 kernel S1-S5 (S1 typed enumerable shell denial ShellDenialReason.NOT_IN_ALLOWLIST enforced at BOTH the shell preflight and execution sites, behaviour otherwise identical to the exact-match allowlist; S2 durable DENY-only permission rules via apply_deny_rules/PermissionGateOutcome.DENY_BY_RULE, no ALLOW kind, tier<=2 only, tier-3 and the frozen E2 matrix and C7 untouched, enforced after the gate AND on resume_pending_approval (APPROVE only, REJECT stays resolvable); S3 layered AGENTS.md/CLAUDE.md discovery with per-layer sha256 and bounded traversal/read, root-only output byte-identical to legacy for files <=128 KiB; S4 deterministic context compaction recorded durably as the new additive TaskEventType.SESSION_CONTEXT_COMPACTED, active request never dropped and tool groups never split; S5 sandbox = ALREADY satisfied on main by the opt-in fail-closed macOS Seatbelt tier + the documented trusted-workspace boundary, no new code). Conflicts were import-list only (packages/os_core/__init__.py, apps/api_server/app.py) resolved by keeping both sides; a second merge (51a8f0a1) integrated origin/main #59. Validation before push: Ruff clean; full tests/product 23 failed == the pre-existing baseline set (zero new); pyright no new errors (only the pre-existing app.py key_source x2 and pre-existing test-file errors). HONEST REVIEW BOUNDARY: every review was SUBAGENT/SAME-MODEL (opencode/deepseek-flash, builder == reviewer); the founder accepted a subagent final review instead of a cross-provider one, so builder_id != reviewed_by is NOT satisfied and there is NO independent-provider approval. Claim ceiling: implemented / tested / integrated on main; NO release, parity, market or Autonomy(S,E,O,V,T) claim."
