  ci: "2026-09-18: the GitHub workflow `.github/workflows/ci.yml` job `test` now has a `Product suite (governed gate, pytest)` step running `PYTHONPATH=src:packages/contracts/src:packages/os_core/src python -m pytest tests/product -q` -- before this, the governed product suite never ran in CI at all (the only test step was `unittest discover`, and tests/product holds zero unittest.TestCase classes and is not an importable package, so it collected 0 cases while pytest collects 2626). CI dependency set for that step: the product-test extra pins (pytest/pyyaml/pydantic), sqlglot==30.13.0 (a plain runtime dependency, NOT in the extra, required by apps/api_server -> domain_packs/data_agent/sql_safety.py) and `pip install --no-deps .` (tests/product/test_product_entrypoint.py reads the installed distribution plus the agent-os-runtime/agent-os-work console scripts; 4 of its 5 tests fail in a clean checkout without it). Workspace packages are supplied by PYTHONPATH and never resolved from an index. Reproduced end-to-end on a clean `git archive HEAD` checkout with a fresh venv derived from .venv: 2625 passed, 1 skipped, exit 0. 2026-09-18 follow-up, same day: that step now also asserts a COLLECTION FLOOR before the run -- `--collect-only` is counted and fewer than 2500 items fails the step with an ::error:: annotation, because `pytest tests/product` exits 5 only when the collection is COMPLETELY empty, so a step narrowed by an added `-k`/`--deselect` or a moved path still looks green (measured on this tree 2026-09-18 at the commit that added the floor: 2631 items, up from the 2626 above; re-measured in this pass at HEAD 426249e6 with the step's own command `PYTHONPATH=src:packages/contracts/src:packages/os_core/src python -m pytest tests/product -q --collect-only`: 2639 items collected, so the count grows as suites are added -- which is exactly why the floor is a round 2500 and not the exact total; with the floor deleted, adding `-k test_workspace_commit_fence` gives 21 passed / 2610 deselected and exit 0, so the hole was real and the floor closes it -- the same narrowing WITH the floor exits 1 with the 21-items message). The second, independent change closes the gap this record used to name as still open: `.github/workflows/ci.yml` now has a SECOND job, `cli-ts`, covering the TypeScript terminal client (tests/product/test_ci_gate_wiring.py guards the wiring of all of this, including that no gate step uses continue-on-error, `|| true`, --if-present or --passWithNoTests). Steps: actions/setup-node 22 (only the test driver -- scripts.test is `node --import tsx --test <explicit file list>`, and no node-run test imports OpenTUI at run time, since the two render tests spawn bun) + oven-sh/setup-bun pinned to 1.4.2 (bun is the package's declared runtime, package.json engines.bun >=1.4.0, and the only runtime that can load OpenTUI's native renderer; @opentui/core declares bun>=1.3.0 || node>=26.4.0), then `bun install --frozen-lockfile` in apps/cli-ts, then `npm run test:ci` -- CORRECTED 2026-09-18 (documentation pass, HEAD 203b8862): this pin said `npm test`, which is NOT the CI step. `grep -n 'npm run' .github/workflows/ci.yml` -> ci.yml:281 `run: npm run test:ci`, i.e. `node scripts/test-ci.mjs`, one bounded process per test file with a per-file deadline derived from the job's own wall clock (the switch was made by 2267e62b because a hang on the Linux runner produced no attribution); the string `test:ci` had zero hits in this pin, and `npm test` remains only the local single-process form. Re-measured at this HEAD: `npm run test:ci` = 34 files / 225 tests / 225 pass / 0 fail in ~8s, and `npm test` with stdout piped = 225 tests / 225 pass / 0 fail; the green CI run 35272942676 log agrees (34 test files, sum of per-file `# pass` = 225, `# fail` = 0). 195 cases was the count when the `cli-ts` job first landed and 205 was the count at HEAD 426249e6, so BOTH numbers here were stale; the current case count is 225 and `npm run typecheck` (`tsc -p tsconfig.json --noEmit` over src/**, scripts/**/*.ts and test/**; re-measured: exit 0). Choice of installer, both tried in clean copies with no node_modules: bun install --frozen-lockfile (12.15s with a cold cache, 59 packages, exit 0) is used because bun is the declared runtime and bun.lock is the tree a `bun install` developer gets, and because --frozen-lockfile refuses to resolve anything new (verified: adding a dependency to package.json without regenerating bun.lock fails, exit 1, with lockfile had changes, but lockfile is frozen, while a scripts-only package.json edit does not trip it), so a stale lockfile fails loudly instead of silently re-resolving; `npm ci` also installs and passes (10.64s cold cache; 195 pass / 0 fail) and stays the documented fallback, but it installs from package-lock.json, which is not the declared runtime's lockfile and does not resolve identically today (bun's tree carries a strip-ansi 7.2.0 under string-width, npm's carries none). Verified locally in clean copies: npm test with stdout piped (not a TTY) 195 pass / 0 fail, typecheck exit 0, and the product gate step executed verbatim from the YAML text against a venv that already held the pinned deps plus the project install (the two pip lines pre-satisfied by the venv): exit 0, floor line 2631 collected (that run's tree; this pass collected 2639 at HEAD 426249e6), then 2630 passed / 1 skipped in 201s (that run only - this pass did not re-run the 200s product suite); with a stubbed pip the ONLY failures are test_product_entrypoint.py test_runtime_daemon_entrypoint_runs and test_work_cli_entrypoint_runs, i.e. those two pip lines are load-bearing and the floor lines leave them untouched. NOT verifiable on this machine, so NOT claimed: the GitHub runner's real network/registry behaviour and cache state, and whether the linux-x64 OpenTUI native library loads under bun on that runner -- ANSWERED 2026-09-18 (documentation pass, HEAD 203b8862): the earlier wording said the first CI run is the first real evidence. That run has now happened and is GREEN: `gh run list --branch tui/parity-f-code-highlight` -> run 35272942676 (event pull_request, headSha 203b886206f7de0d003d5bc13c768f8710fead1f) completed success, with BOTH jobs green (`gh run view 35272942676 --json jobs`): `test` success (2706 passed / 7 skipped in 201.55s) and `cli-ts` success (34 test files, 225 pass / 0 fail; install-smoke 8 passed, 0 failed). This is one green run on one commit, NOT a stability claim, and the three runs immediately before it were not green: 35270763288 (2267e62b) failure with `cli-ts` failing while `test` passed; 35270526897 (aba1e229) cancelled with `cli-ts` cancelled; 35268566184 (da5ece15) failure with `test` failing and `cli-ts` cancelled - so the counts and the OpenTUI-native-library question above are now observed once, not repeatedly. 2026-09-18, third change, same `cli-ts` job: an INSTALL SMOKE step, because every step above ran the client FROM SOURCE (`npm test` drives src/cli.tsx through tsx) or only read types (`npm run typecheck`), so the job could stay green while the artifact a user runs was broken. New file `apps/cli-ts/scripts/install_smoke.sh` walks the user path from source state and asserts 8 hops in order, failing the step on the first broken one and printing a PASS/FAIL list: (1) deps, node_modules/.bin/tsc present; (2) build, `npm run build` emits dist/; (3) artifact, dist/cli.js exists AND is executable and every package.json `bin` entry (noem/agentos/agent-os/agent-os-ts) resolves to a file that exists and is executable; (4) version, `bun dist/cli.js --version` prints exactly the package.json version (0.1.0 on this tree); (5) pack, `npm run pack:check` (prepack rebuilds, then `npm pack --dry-run`) ships README.md + dist/cli.js, ships no `*.map`, ships every `bin` target, leaks no src/test/scripts path, and writes no tarball; (6) start, the hermetic daemon (scripts/dev_daemon.py, scripted provider, no network, no credentials) writes its OWN descriptor -- the file is `rm -f`-ed first and must then reappear AND carry the pid of the daemon this run started, so a stale descriptor cannot pass the wait; (7) answer, `bun dist/cli.js --descriptor <that descriptor> --no-daemon -p <prompt> --output-format json` exits 0 with subtype success, is_error false, a session_id, and a reply byte-identical to dev_daemon.TURN1_TEXT; (8) stop, the daemon is killed and a descriptor-scoped pgrep sweep reports no orphan. Deliberately NO `npm i -g` and no publish: package.json is private true, so this package cannot be published or installed from a registry; installed is checked on the tarball pack:check builds (its contents plus the paths its `bin` entries name) and on the real runtime path `bun` + dist/cli.js, never `npx tsx src/cli.tsx`. Deliberately `--no-daemon` on the turn: with auto-start enabled an unhealthy descriptor makes the client spawn its own daemon from ambient configuration, which on a machine with a live provider answers for real -- observed once during fault injection (one real provider call served by `agent-os-runtime` against the default ~/.agent-os database, 147 tokens) before that flag plus the TURN1_TEXT equality made the path impossible to pass. CI wiring in the same cli-ts job: actions/setup-python@v5 (3.12), then `pip install sqlglot==30.13.0 pydantic>=2.13,<3 pyyaml>=6,<7` (the hermetic daemon's imports; same pinned runtime set as the `test` job; no `pip install .` and no `-e .`, the workspace packages come from PYTHONPATH), then `bash scripts/install_smoke.sh` with working-directory apps/cli-ts. Measured on this tree (macOS 2026-09-18, bash 3.2, node v22.23.0, bun 1.4.2, npm 10.9.8, python 3.12.13): all 8 hops PASS, exit 0, in 9.2s / 9.3s / 10.0s / 10.3s across four runs. Bypass checks, run against throwaway copies so the tree stayed untouched: a wrong expected version fails the version hop (exit 1, so the assertion is not print-only); `sourceMap: true` plus removal of the `!dist/**/*.map` entry from `files` fails the pack hop, listing all 42 `.map` entries; a turn pointed at a missing descriptor fails the answer hop (exit 1, `no running daemon at ...`, no provider call) while the already-started daemon is still cleaned up with no orphan. NOT verified, so NOT claimed: the GitHub runner's first execution of this step (its pip/network behaviour, the sqlglot==30.13.0 pin, and bash 5 there versus bash 3.2 here) -- ANSWERED 2026-09-18 (documentation pass, HEAD 203b8862): the GitHub runner HAS now executed this step, on run 35272942676 (203b8862), and the `cli-ts` job passed with log lines `[install-smoke] 8 passed, 0 failed, 8 checks run` and `[install-smoke] ALL PASS` (`gh run view 35272942676 --log`), so the pinned python set, the sqlglot==30.13.0 pin and bash 5 there versus bash 3.2 here are each observed once on the runner; that is one run, not a stability result. The CI dependency set itself WAS reproduced locally: a fresh venv with exactly those pins (sqlglot 30.13.0, pydantic 2.13.5, pyyaml 6.0.3) ran the smoke to 8 hops PASS / exit 0 in 10.0s via `PY=<venv>/bin/python`, so the pinned set is exercised, not just the .local python3's sqlglot 30.12.0. W5 RE-MEASURE 2026-09-18 (documentation pass, HEAD 426249e6, `git show HEAD:.github/workflows/ci.yml`): the workflow really has TWO jobs (`test`, `cli-ts`); the `test` job's product step really carries the 2500 collection floor; the `cli-ts` job really ends with `scripts/install_smoke.sh` (step 'Install smoke (build -> pack -> start -> answer)', working-directory apps/cli-ts, PYTHONPATH pinned to the workspace absolute path); and NO step or job sets `timeout-minutes` anywhere in the file, so the product step (201s measured above) and the smoke run are bounded only by GitHub's default job cap -- recorded because a reader may assume the 20s client timeout or a CI timeout protects this gate, and neither does. CORRECTED 2026-09-18 (documentation pass, HEAD 203b8862) - that sentence was measured at HEAD 426249e6, is NO LONGER TRUE, and contradicted the file-set-gate pin in this same file, which already records that the `test` job gained a wall clock. Measured now with `grep -n timeout-minutes .github/workflows/ci.yml`: :28 `timeout-minutes: 30` (the `test` job, added by 7e20cc19) and :235 `timeout-minutes: 20` (the `cli-ts` job, added by 46327499). BOTH jobs are bounded, so neither the product step nor the smoke run rides GitHub's 360-minute default any more; the bound is a hang detector with a wide margin (30 and 20 minutes against measured healthy costs of 201.55s and roughly 40s), not a latency gate. `python -m pytest --collect-only` reports 2713 items at HEAD 203b8862 (that is what the green CI run's own gate counted at this commit; the 2639 quoted here before was HEAD 426249e6). A local re-measurement with the step's own command, `PYTHONPATH=src:packages/contracts/src:packages/os_core/src .venv/bin/python -m pytest tests/product -q --collect-only`, is NOT comparable to that number on this machine, and the reason is worth recording: this worktree is shared with concurrent writers who are adding cases under tests/product, so the local count moves. Measured within one pass it returned 2719 items across 161 files (all 161 committed `test_*.py` files collected items, so the allowlist stays correctly empty), then 2731 a few minutes later; the jump came from a peer landing 6 new cases in tests/product/test_ci_gate_wiring.py (07:30:23) and from two new uncommitted test modules appearing under tests/product. The inline comment inside ci.yml is that file's own record and moves with its writer. For the same reason the wiring-test case count is a moving target rather than a fixed claim: `grep -c 'def test_' tests/product/test_ci_gate_wiring.py` measured 9, then 11, then 17 while this pass ran, so it passes on the working tree at every one of those sizes but no single number should be pinned as the current one. NOT re-run in this pass: scripts/e2e.sh and scripts/install_smoke.sh (both start daemons)."
