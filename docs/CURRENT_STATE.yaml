blockers:
  product:
    - "No complete personal and Data Agent paths on the same Agent OS spine."
    - "ADM-P1 seals inert candidates and ADM-P2 records external evaluation receipts only; evaluator execution/performance, materializer acquisition, promotion, immutable configuration snapshots, optional priors and later-run activation are not implemented."
    - "Production identity, tenancy, encrypted credentials, policy administration, deployment/SLO, backup/restore and incident evidence are incomplete."
    - "Natural-language/visual WorkflowGraph authoring, mature knowledge lifecycle, broad capabilities, marketplace and general coding-agent path are incomplete."
    - "SPINE-1 migration is not executed."
  research:
    - "No `Autonomy(S,E,O,V,T)` evidence supports a general autonomy claim."
    - "No non-oracle real-world structure/mechanism discovery result closes the current gap."
    - "LH-RECOVERY-1A has no D2, preregistered formal outcome run or result; v5's 432/432 oracle is semantic reference validation only and the missing Product execution contract prevents promotion to run authority."
    - "RTM-1 resource-v4 is accepted implementation on a separate branch but remains NOT_BENCHMARKED and NOT_RUN."
    - "No evidence trigger yet justifies latent-recurrent or learned-state training; the parent accelerated policy authorizes a frozen bounded training arm only after a strong autoregressive/explicit-state ceiling is demonstrated."
    - "Core-evolution successor packets and independent promotion machinery are not implemented/authorized."
  repository:
    - "ADR-0057 and ADM-P1 remain in the ancestry of codex/adm-p2-evaluation-receipts-20260715; ADM-P2 is committed on that isolated branch. No push, main merge or release is implied."
    - "Task 7 is integrated on this canonical feature branch. Task 8 candidate 9b5d47a, the accepted B1 harness and RTM-1 resource-v4 remain separate-branch evidence and are not integrated."

claim_boundaries:
  product:
    - "SPINE-0 may be called PM-accepted only for the bounded local independent-developer repository path."
    - "ADM-P1 may be called implemented only as local inert candidate sealing/listing; it is not domain adaptation, acquisition, learning, evaluation, promotion or activation."
    - "ADM-P2 may be called implemented only as local external evaluation receipt recording/listing; it is not evaluator execution, evaluator-quality evidence, promotion, activation or adaptive competence."
    - "Do not claim Product Alpha, production readiness, Codex/Claude parity, superiority or general market validation."
    - "Do not claim Data Agent migration, shared-spine completion, release or production deployment."
  research:
    - "G10 and CWM results remain narrow and cannot be called autonomy or general intelligence."
    - "SPINE-E2E-4 and the LH v5 prerequisite receipts do not establish parent long-horizon success, autonomy or AGI."
    - "RTM-1 implementation acceptance does not backfill a benchmark or scientific verdict."
    - "Preserve NOT_MET, INSUFFICIENT_DATA, PARK and RED without rescue language."
    - "Use RR-0024 `Autonomy(S,E,O,V,T)` for any autonomy claim."
  evolution:
    - "Functional core candidates may change; external evaluator, approval, promotion, rollback and C7 roots may not be self-written."

next_actions:
