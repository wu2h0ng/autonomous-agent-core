      scope: "One reversible governed action loop with CLI adopt, causal attribution, explicit action-record intent routing, user-facing data-agent result artifact with chart-ready dashboard, strongly typed evidence/source report cards, audience-aware read-side redaction, HTTP external-report-key cap, minimal HTTP principal/scope policy contract, operator-only approval execution with typed execution_audit, durable approval-context resume with stale-claim recovery, connector-side durable action_record ledger with replay/conflict/ACK-uncertain audit, typed connector execution-audit projection, OpenAPI operator-key required contract, dry-run, idempotency, approval-resume execution, rollback, and D6 red eval"
      freshness_note: "Lower-half covers causal attribution/result_weight, ActionRecord dry-run/idempotency, and contract/OpenAPI wiring. Upper-half covers CLI adopt/operator causal attribution surface, approval-resume governed execution, D6 eval, and one rollback demonstration, with review hardening for risk ceiling, dry-run/snapshot fail-fast, approval binding, and approved-execution audit trace. Explicit grounded follow-up/action-record user intent now routes to action_record but remains approval-bound. POST /runs/run_service now also return a typed user_result artifact bundling analysis, report sections, dashboard widgets, decision recommendation, and approval-bound business_action metadata; the dashboard now includes a line_chart widget derived from MetricContract dimensions and grounded query result rows, with x_field/y_field declared in OpenAPI. user_result.report.evidence_cards now exposes discriminated metric_contract/sql_safety/query_result cards derived from MetricContract, QueryPlan, SQLSafetyResult, and QueryResult metadata; internal projections include SQL fingerprints and parameter names but exclude raw SQL and parameter values. POST /runs now accepts audience=internal|external and external non-public projections redact physical sources, metric dimensions, SQL metadata, columns, preview rows, chart fields, and KPI values while keeping row counts and redaction metadata; external public projections may show public metric dimensions, columns, previews, chart fields, and KPI values, but still hide physical schemas/tables, bound parameter names, limit metadata, and SQL fingerprints. HTTP POST /runs may additionally accept AGENT_OS_EXTERNAL_API_KEY as a projection-only X-API-Key; that principal is forced to audience=external even if the body asks for internal, top-level provider/trace-step/related-knowledge metadata is omitted, blocked-run details drop trace_id/details, and the key is not accepted on non-run management surfaces. The HTTP auth layer now exposes a tested minimal ApiPrincipal/scope matrix: internal can run internal/external projections and use outcome/adoption/search/trace surfaces, external_report can only run external projections, and operator can only execute approvals through X-Operator-Key; missing/wrong keys return 401, recognized principals without a required scope return 403, unconfigured auth returns 503, and configured internal/external/operator key values must be distinct. This is still not full RBAC, tenant isolation, field/row-level authorization, or full DLP, and the external_report key still triggers a new /runs execution rather than a side-effect-free read. POST /approvals/{approval_id}/execute is operator-key-only, binds to the exact approval context, rejects rejected/unknown/replayed approvals, and keeps R4/R5 proposal-only; the OpenAPI snapshot now marks X-Operator-Key required=true/string while missing/wrong operator keys still return 401 through runtime auth, and the unconfigured operator-key branch is covered by a 503 regression test. Postgres store_backend persists approval-bound operation/evidence/action context in approval_operation_contexts, uses claim/release to block double-consume, writes claim lease metadata, reclaims stale executing claims after the configured lease, and preserves dry-run-failure retry; stale reclaim now uses observed claim-token CAS so two cross-process reclaimers cannot both win the same stale claim. Main now persists action_record connector side effects in action_records with connector-local idempotency replay/conflict checks, replay/conflict audit counters, conflict fingerprints without raw conflicting payloads, and restart-safe rollback that does not delete later unrelated action records. This does not claim external-system exactly-once, post-write external acknowledgement recovery, durable arbitrary external connectors, or external release."
      freshness_note_addendum: "2026-06-24 audit hardening: action_record can mark a committed connector-local write as ACK-uncertain without raw audit parameters, persist the uncertain event into RunTrace/OperationTrace, and recover via same-idempotency idempotent_replay without double append. ConnectorExecutionAudit/ApprovalExecutionAudit now expose a typed safe projection over connector-reported execution semantics, including external_request_id and external_ack_status when reported, while excluding raw parameters and secret-like fields. ConnectorExecutionSemantics now lives on ActionConnectorContract so runtime audit defaults are declared by the registered connector contract before any connector payload fields are projected; action_record declares connector_local_ledger/idempotency/reconciliation semantics. external_ack_status defaults to unknown for external connector semantics unless explicitly reported. This still does not claim external ACK confirmation, external-system exactly-once, durable arbitrary external connector recovery, or external release."
