      freshness_note: "Implemented TDD-first in packages/os_core/src/agent_os_core/agent_runtime/__init__.py with tests under tests/unit/test_agent_runtime_*.py and tests/integration/test_trusted_loop_agent_runtime_adapter.py. Source review snapshots: LangGraph 711b31550286585b3793857b2a99c8dafd98b785; CrewAI 2eb4e3a236bada5432290654b8d442345eafb19e; LangChain 57c83d44bc8ae89a189ad521b9756cfac996039c. Frontier research intake added with primary-source papers/benchmarks including ReAct, Reflexion, Voyager, Generative Agents, Toolformer, Tree of Thoughts, AIOS, MemGPT, AI Agents That Matter, AgentBench, WebArena, VisualWebArena, OSWorld, TheAgentCompany, DGM, open-endedness/safety, corrigibility, active inference, and empowerment. Pre-merge review is docs/decisions/ADR-0003-agent-runtime-v0-trusted-substrate.REVIEW-20260624.md; remediation is docs/decisions/ADR-0003-agent-runtime-v0-trusted-substrate.CODEX-REMEDIATION-20260624.md; second review is docs/decisions/ADR-0003-agent-runtime-v0-trusted-substrate.SECOND-REVIEW-20260624.md. H1-H3 remediation adds fail-closed approval policy for R4/R5 and side-effecting tools, routes run_tool through invoke_tool, and removes raw args/output from runtime trace events by default. Second-review M1 follow-up is closed: the adapter integration test now runs a real TrustedLoopRuntime.evaluate path and asserts SQL Safety, EvidenceChain completeness, persisted RunTrace, connector execution trace, and AgentRuntime envelope events. Context risk-ceiling hardening adds AgentRunContext.risk_ceiling and DENY_RISK_CEILING before tool execution. Checkpoint replay-boundary hardening fingerprints the tool call, run context, and tool spec before returning a stored result, and mismatches return CHECKPOINT_MISMATCH without invoking the tool body. Main/origin contain ADR-0003; this local hardening is not a release claim until pushed/reviewed. All external systems are reference-only and not product dependencies."
