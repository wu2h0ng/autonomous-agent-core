    action: "Keep reviewed ADM-P1/ADM-P2 branch-contained until explicit integration authorization; define ADM-P3 Product-owned promotion decision and immutable prior contract without adding activation authority."
  - priority: 2
    action: "Support the parent R-EVAL-INDEP-1, R-STATE-CREDIT-1 and R-ACTIVE-DISCOVERY-1 research lanes only through stable contracts or isolated Research paths; do not import their mechanisms into Product Runtime."
  - priority: 3
    action: "Keep full successor LH parked and preserve the completed B1 baseline and RTM-1 resource-v4 verdicts; new accelerated lanes do not rewrite them."
  - priority: 4
    action: "Keep SPINE-1 unexecuted until every ADR-0054 gate and explicit founder push/merge authorization are present."

