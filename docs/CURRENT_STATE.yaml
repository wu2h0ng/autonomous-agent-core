    - "P5.1b-ii non-bypassable grounding invariant complete"
    - "P5.2a corrigibility pause shell complete"
    - "Critical-fix cleanup complete: SQL LIMIT lower bound, CLI env-store parity, knowledge/index atomicity, atomic knowledge version bump"
    - "ADR-0002 lower-half contracts complete: causal attribution/result_weight, ActionRecord dry-run/idempotency, contract/OpenAPI wiring"
    - "ADR-0002 upper-half local implementation complete: CLI adopt/operator causal attribution surface, approval-resume governed execution, D6 red eval, and rollback demonstration"
    - "Explicit action-record intent routing complete: grounded action-record/follow-up requests now route to the reversible action_record connector, halt for approval, and execute only through approval-resume"
    - "User-facing data-agent result artifact complete: POST /runs and run_service now return an evidence-bound analysis/report/dashboard/decision/business_action bundle for direct client rendering"
    - "Chart-ready dashboard widget complete on main: user_result.dashboard now includes a line_chart widget whose x/y fields are derived from MetricContract dimensions and grounded query result rows, with x_field/y_field exposed in the OpenAPI schema"
    - "Evidence/source report cards complete on main: user_result.report.evidence_cards now exposes strongly typed metric_contract/sql_safety/query_result cards derived from EvidenceChain, MetricContract, SQLSafetyResult, QueryPlan, and QueryResult metadata, with SQL fingerprinting but no raw SQL or parameter values"
    - "Audience-aware read-side redaction complete on main: POST /runs accepts audience=internal|external; external non-public user_result projections hide physical sources, metric dimensions, SQL metadata, columns, preview rows, chart fields, and KPI values while preserving row counts and explicit redaction metadata; external public projections may show public metric data but still hide physical schemas/tables, bound parameter names, limit metadata, and SQL fingerprints"
    - "Identity-bound report projection cap complete on main: POST /runs may accept AGENT_OS_EXTERNAL_API_KEY as a report-only X-API-Key, but that principal is forced to audience=external, loses top-level provider/trace-step/related-knowledge metadata, and cannot use non-run management surfaces such as /outcomes; configured internal, external-report, and operator keys must be distinct"
    - "Minimal HTTP principal/scope policy contract complete on main: internal, external_report, and operator principals now have an explicit tested scope matrix; missing/wrong keys return 401, recognized principals without scope return 403, unconfigured auth remains 503, and operator/API header channels stay separated"
    - "Operator-only approval execution hardening complete: POST /approvals/{approval_id}/execute requires X-Operator-Key, rejects run API keys, binds execution to the original approval context, keeps R4/R5 proposal-only in MVP, supports retry after connector dry-run failure, and exposes OpenAPI 404/409 error contracts"
    - "Durable approval-context resume complete: postgres store_backend persists approval-bound operation/evidence/action context in approval_operation_contexts, supports cross-runtime approval execution by approval_id without client replay, uses claim/release to block double-consume, reclaims stale executing claims after the configured lease, and preserves retry after connector dry-run failure"
    - "Connector-side durable action_record ledger complete on main: postgres store_backend injects SqlActionRecordStore into ActionRecordConnector, persists action_records across runtime instances, enforces connector-local idempotency replay/conflict checks, audits replay/conflict counts plus conflict fingerprints without raw conflicting payloads, and keeps rollback from deleting later unrelated action records"
    - "OpenAPI operator-key contract hardening complete on main: /approvals/{approval_id}/execute now advertises X-Operator-Key as required=true/string in the published snapshot while runtime missing/wrong operator key still returns 401 instead of FastAPI 422"
    - "ADR-0002 branch remediation complete on main: H1 stale-claim reclaim now uses observed claim-token CAS to prevent double reclaimer wins, M1 redaction is audience-first with public external infrastructure stripping, and M2 locks the operator-key unconfigured 503 path"
    - "Connector-local post-write ACK-uncertain audit complete on main: action_record stores can mark committed writes as execution-uncertain without raw audit parameters, approval execution records the uncertain event into RunTrace/OperationTrace, retry with the same idempotency key returns idempotent_replay without double append, and /approvals/{approval_id}/execute exposes a stable execution_audit projection"
    - "Typed connector execution-audit projection complete on main: ConnectorExecutionAudit/ApprovalExecutionAudit project safe connector-reported execution fields into OperationTrace, RunTrace, and OpenAPI while excluding raw parameters, raw connector payloads, and secret-like fields; external ACK defaults to unknown unless explicitly reported"
    - "Connector-declared execution semantics complete on main: ActionConnectorContract now carries ConnectorExecutionSemantics defaults, ActionConnectorRegistry exposes get_execution_semantics, TrustedLoopRuntime fills audit defaults from the registered contract, and action_record declares connector_local_ledger/idempotency/reconciliation semantics; a residual action_record connector-name branch (trusted_loop.py:1087) is still present and should be retired once a second connector exercises the contract-driven path"
    - "ADR-0003 Agent Runtime v0 trusted substrate is on main/origin: typed run/tool/result/policy contracts, pre-execution RuntimePolicyGate, trace-visible failure paths with safe runtime trace projection, pause-shell denial, minimal checkpoint/replay boundary, TrustedLoopRuntime.evaluate adapter, and external agent-framework import-boundary tests"
    - "ADR-0003 pre-merge H1-H3 remediation complete on main/origin: run_tool now delegates to invoke_tool, RuntimePolicyGate requires approval_id for R4/R5 and side-effecting tools, and runtime trace events no longer record raw args/output by default"
    - "ADR-0003 second-review M1 follow-up closed on main/origin: tests/integration/test_trusted_loop_agent_runtime_adapter.py now covers a real TrustedLoopRuntime.evaluate path through the adapter, including SQL Safety, EvidenceChain, persisted RunTrace, and AgentRuntime envelope events"
    - "ADR-0003 runtime context risk-ceiling hardening complete locally: AgentRunContext now carries risk_ceiling, RuntimePolicyGate denies tools above that ceiling before the tool body, and tests cover deny/allow-at-ceiling paths"
    - "ADR-0003 checkpoint replay-boundary hardening complete locally: resume_from_checkpoint returns the stored result only when call, context, and tool-spec fingerprints match; mismatches fail closed before tool execution"
  immediate_next:
    id: "product-integration-stack-rerehearsal-before-merge"
    description: "Do not merge the existing F3 integration rehearsal yet: it was based on fb2399a and does not include current local main c404e1e runtime/security-doc commits. Next action is to create a fresh c404e1e-based rehearsal and replay main -> enterprise-integration-reconcile -> workspace-F1 -> workspace-F2 -> workspace-F3a, then run CI/browser QA and record a new verification before any founder/CTO merge decision. External agent frameworks remain reference-only; factory/API exposure, durable checkpointing, concurrency, workflow replacement, and autonomous-core adoption require later ADRs/gates. Do not claim external release, external-system exactly-once, external ACK confirmation, full RBAC/DLP, tenant isolation, field/row-level authorization, durable arbitrary external connectors, production UI, approval-execution UI, full live API-backed golden-loop frontend, or automatic R4/R5 execution."
