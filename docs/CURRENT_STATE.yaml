    - "Audience-aware read-side redaction complete on feature branch: POST /runs accepts audience=internal|external; external non-public user_result projections hide physical sources, metric dimensions, SQL metadata, columns, preview rows, chart fields, and KPI values while preserving row counts and explicit redaction metadata; external public projections may show public metric data but still hide physical schemas/tables, bound parameter names, limit metadata, and SQL fingerprints"
