    - id: "ADR-0003-agent-runtime-v0-trusted-substrate"
      status: "Accepted and on local main/origin baseline from branch codex/agent-runtime-v0-trusted-substrate; H1-H3 remediation, second review M1 follow-up, context risk-ceiling, checkpoint replay-boundary, durable checkpoint-store adapter, checkpoint persistence failure hardening, R4/R5 proposal-only runtime hardening, case-insensitive sensitive-key custom trace redaction, checkpoint resume trace events, checkpoint no-mask for pre-execution denial, Packet A Slice 0 live /runs wiring, diagnostics-boundary request-scoped HTTP runtime diagnostics, typed /runs Agent Runtime 500 error schema, reviewed-slices consolidation, product-factory checkpoint backend selection, pre-execution budget guard, correction-channel runtime envelope, and internal-only public resume API are on deployment local main"
      gate: "LOCAL MAIN ONLY; NO PUSH/RELEASE CLAIM: H1 run_tool policy bypass, H2 R4/R5 and side-effect metadata enforcement, H3 raw trace args/output leakage, M1 real TrustedLoop adapter coverage, context risk-ceiling denial, checkpoint resume mismatch denial, SQL checkpoint cross-runtime replay, checkpoint save failure typing/traceability, R4/R5 proposal-only enforcement, case-insensitive sensitive-key custom trace redaction, checkpoint resume trace events, checkpoint no-mask for pre-execution denial, live /runs runtime-envelope entry, pre-loop runtime denial trace persistence, runtime/tool error sanitization, request-scoped HTTP runtime diagnostics, typed /runs Agent Runtime 500 error schema, successful /runs runtime-envelope event persistence, /approvals/{approval_id}/execute runtime-envelope entry, product-factory checkpoint backend selection, SQL checkpoint allowlisted Trusted Loop summaries, pre-execution budget guard, correction-channel runtime envelope for POST /outcomes and POST /adoptions, and internal-only POST /agent-runtime/runs/{runtime_run_id}/resume have code/tests on deployment local main. The public resume API adds internal-only runtime_checkpoint_ref only when a matching checkpoint is persisted, runtime:resume scope, RuntimePolicyGate recheck before checkpoint return, fingerprint mismatch denial, safe output_ref projection, external-report-key denial, typed RuntimeResumeErrorResponse OpenAPI coverage for 404/409/500/503, typed CHECKPOINT_READ_FAILED backend-read failures, and safe RunTrace append. Origin/main is not updated with correction-channel or public-resume changes. Remaining runtime surfaces beyond POST /runs, /outcomes, /adoptions, /approvals/{approval_id}/execute, and internal-only resume, plus production telemetry/export policy, true wall-clock interruption, concurrency/async graph behavior, workflow replacement, and autonomous-core adoption require later ADRs/gates"
      scope: "Self-developed Agent Runtime v0 trusted substrate: run context, typed tool registry/calls/results, runtime policy gate, trace-visible failure paths, pause pre-check, minimal checkpoint/replay boundary, TrustedLoopRuntime.evaluate adapter, and cross-layer research mapping to autonomous-core/Enterprise OS/workflow"
      freshness_note: "Implemented TDD-first in packages/os_core/src/agent_os_core/agent_runtime/__init__.py with tests under tests/unit/test_agent_runtime_*.py and tests/integration/test_trusted_loop_agent_runtime_adapter.py. Source review snapshots: LangGraph 711b31550286585b3793857b2a99c8dafd98b785; CrewAI 2eb4e3a236bada5432290654b8d442345eafb19e; LangChain 57c83d44bc8ae89a189ad521b9756cfac996039c. Frontier research intake added with primary-source papers/benchmarks including ReAct, Reflexion, Voyager, Generative Agents, Toolformer, Tree of Thoughts, AIOS, MemGPT, AI Agents That Matter, AgentBench, WebArena, VisualWebArena, OSWorld, TheAgentCompany, DGM, open-endedness/safety, corrigibility, active inference, and empowerment. Pre-merge review is docs/decisions/ADR-0003-agent-runtime-v0-trusted-substrate.REVIEW-20260624.md; remediation is docs/decisions/ADR-0003-agent-runtime-v0-trusted-substrate.CODEX-REMEDIATION-20260624.md; second review is docs/decisions/ADR-0003-agent-runtime-v0-trusted-substrate.SECOND-REVIEW-20260624.md; checkpoint/trace security review is docs/decisions/ADR-0003-agent-runtime-checkpoint-trace-security.REVIEW-20260625.md; live /runs wiring review is docs/decisions/ADR-0003-agent-runtime-live-wiring.REVIEW-20260625.md; diagnostics-boundary implementation log is docs/decisions/ADR-0003-agent-runtime-diagnostics-boundary.IMPLEMENTATION-20260625.md; diagnostics-boundary review is docs/decisions/ADR-0003-agent-runtime-diagnostics-boundary.REVIEW-20260625.md; success-trace bridge implementation log is docs/decisions/ADR-0003-agent-runtime-success-trace-bridge.IMPLEMENTATION-20260626.md; success-trace bridge review is docs/decisions/ADR-0003-agent-runtime-success-trace-bridge.REVIEW-20260626.md; approval-execute implementation log is docs/decisions/ADR-0003-agent-runtime-approval-execute-envelope.IMPLEMENTATION-20260626.md; approval-execute review is docs/decisions/ADR-0003-agent-runtime-approval-execute-envelope.REVIEW-20260626.md; checkpoint factory selection implementation log is docs/decisions/ADR-0003-agent-runtime-checkpoint-factory-selection.IMPLEMENTATION-20260626.md; checkpoint factory selection review is docs/decisions/ADR-0003-agent-runtime-checkpoint-factory-selection.REVIEW-20260626.md; budget guard implementation log is docs/decisions/ADR-0003-agent-runtime-budget-guard.IMPLEMENTATION-20260626.md; budget guard review is docs/decisions/ADR-0003-agent-runtime-budget-guard.REVIEW-20260626.md. H1-H3 remediation adds fail-closed approval policy for R4/R5 and side-effecting tools, routes run_tool through invoke_tool, and removes raw args/output from runtime trace events by default. Second-review M1 follow-up is closed: the adapter integration test now runs a real TrustedLoopRuntime.evaluate path and asserts SQL Safety, EvidenceChain completeness, persisted RunTrace, connector execution trace, and AgentRuntime envelope events. Context risk-ceiling hardening adds AgentRunContext.risk_ceiling and DENY_RISK_CEILING before tool execution. Checkpoint replay-boundary hardening fingerprints the tool call, run context, and tool spec before returning a stored result, and mismatches return CHECKPOINT_MISMATCH without invoking the tool body. Durable checkpoint-store adapter hardening adds CheckpointStorePort, SqlAgentCheckpointStore, agent_runtime_checkpoints schema/Alembic 0008, mapper round-trip tests, and cross-runtime resume tests; OS Core remains persistence-independent. Checkpoint persistence failure hardening returns checkpoint_error and emits agent_runtime.checkpoint_failed when checkpoint save fails after tool execution, without writing raw exception details to trace payloads. R4/R5 proposal-only hardening denies non-proposal R4/R5 tools with DENY_HIGH_RISK_EXECUTION even when approval_id is present, allows action_proposal tools to return proposals, and preserves approval_id requirements for lower-risk side-effecting execution. Case-insensitive trace redaction hardening makes AgentTraceWriter default sensitive-key matching catch common custom-event casing variants such as Authorization, Secret_Token, and API_KEY. Checkpoint resume trace hardening emits safe checkpoint_resume_started/succeeded/failed events for matching replay and fail-closed mismatch paths without raw args/output. Checkpoint no-mask review fix limits checkpoint_error conversion to results after the tool body has started, so pre-execution policy denials remain visible even if the checkpoint store is unavailable. Live /runs wiring constructs an AgentRunContext, grants only trusted_loop:evaluate, routes through TrustedLoopAgentRuntimeAdapter, persists pre-loop runtime denials into queryable RunTrace records, and maps runtime/tool internal failures to sanitized service errors instead of business blocks. Diagnostics-boundary wiring constructs a fresh AgentTraceWriter and TrustedLoopAgentRuntimeAdapter per POST /runs request so app-level diagnostics do not retain prior request run ids. Success-trace bridge wiring copies only allowlisted successful agent_runtime.* metadata into the persisted business RunTrace and preserves event ordering around Trusted Loop events. Approval-execute envelope wiring constructs a fresh AgentTraceWriter, TrustedLoopApprovalExecutionRuntimeAdapter, and route-bound AgentRunContext per POST /approvals/{approval_id}/execute request, preserves existing approval 404/409 semantics, and denies paused-shell approval execution before connector writes. Checkpoint factory selection wiring makes ContentCommerceRuntimeFactory select memory/postgres Agent Runtime checkpoint stores, injects them into HTTP runtime adapters, and stores SQL checkpoint resume output as an allowlisted Trusted Loop summary instead of raw contract objects. Budget guard wiring denies invalid or exhausted max_tool_calls, undeclared/exceeded timeout ceilings, and declared cost-unit budgets before agent_runtime.tool_started, and emits safe budget trace events without raw args/output. All external systems are reference-only and not product dependencies."
    - id: "ADR-0002-governed-action-outcome-loop-v0"
      status: "Accepted; lower-half implemented in commit e802377; upper-half, approval-execution hardening, durable approval-context resume with stale-claim recovery plus H1 reclaim CAS remediation, connector-side action_record ledger with replay/conflict/ACK-uncertain audit, OpenAPI operator-key and typed execution_audit contract hardening plus M2 unconfigured-operator-key test, typed connector execution-audit projection with connector-declared execution semantics, chart-ready user_result dashboard, strongly typed evidence/source report cards, audience-aware read-side redaction plus M1 public-external infrastructure stripping, HTTP external-report-key cap, and minimal HTTP principal/scope policy contract fast-forward merged to main from codex/durable-action-ledger and pushed to origin/main"
      gate: "MERGED AND PUSHED — H1/M1/M2 remediation verified on 2026-06-24 and AR-20260624 accepted at CTO/founder gate; external release remains a separate non-claim"
      merge_blockers: []
      remediated_review_findings:
        - "H1 (HIGH bug) CLOSED locally: stale executing approval-context reclaim now gates UPDATE on the observed prior _claim.claimed_at token, and a two-reclaimer race test fails on the old status-only CAS but passes now."
        - "M1 (founder-ruled 2026-06-24) CLOSED locally: audience is the primary projection gate; data_classification only controls metric-data visibility; external public projections still strip physical schemas/tables, bound parameter names, limit metadata, and SQL fingerprints."
        - "M2 (test gap) CLOSED locally: operator-key unconfigured path now has a targeted 503 regression test."
      review_trail:
        - "docs/decisions/ADR-0002-governed-action-outcome-loop-v0.REVIEW-20260624.md"
        - "docs/architecture_reviews/AR-20260624-http-principal-scope-and-redaction.md"
        - "docs/decisions/ADR-0002-governed-action-outcome-loop-v0.CODEX-REMEDIATION-20260624.md"
        - "docs/decisions/ADR-0002-connector-execution-audit-contract-v0.IMPLEMENTATION-LOG-20260624.md"
        - "docs/decisions/ADR-0002-connector-execution-audit-contract-v0.VERIFICATION-20260624.md"
        - "docs/decisions/ADR-0002-connector-execution-semantics-registry-v0.REVIEW-20260624.md"
      scope: "One reversible governed action loop with CLI adopt, causal attribution, explicit action-record intent routing, user-facing data-agent result artifact with chart-ready dashboard, strongly typed evidence/source report cards, audience-aware read-side redaction, HTTP external-report-key cap, minimal HTTP principal/scope policy contract, operator-only approval execution with typed execution_audit, durable approval-context resume with stale-claim recovery, connector-side durable action_record ledger with replay/conflict/ACK-uncertain audit, typed connector execution-audit projection, OpenAPI operator-key required contract, dry-run, idempotency, approval-resume execution, rollback, and D6 red eval"
      freshness_note: "Lower-half covers causal attribution/result_weight, ActionRecord dry-run/idempotency, and contract/OpenAPI wiring. Upper-half covers CLI adopt/operator causal attribution surface, approval-resume governed execution, D6 eval, and one rollback demonstration, with review hardening for risk ceiling, dry-run/snapshot fail-fast, approval binding, and approved-execution audit trace. Explicit grounded follow-up/action-record user intent now routes to action_record but remains approval-bound. POST /runs/run_service now also return a typed user_result artifact bundling analysis, report sections, dashboard widgets, decision recommendation, and approval-bound business_action metadata; the dashboard now includes a line_chart widget derived from MetricContract dimensions and grounded query result rows, with x_field/y_field declared in OpenAPI. user_result.report.evidence_cards now exposes discriminated metric_contract/sql_safety/query_result cards derived from MetricContract, QueryPlan, SQLSafetyResult, and QueryResult metadata; internal projections include SQL fingerprints and parameter names but exclude raw SQL and parameter values. POST /runs now accepts audience=internal|external and external non-public projections redact physical sources, metric dimensions, SQL metadata, columns, preview rows, chart fields, and KPI values while keeping row counts and redaction metadata; external public projections may show public metric dimensions, columns, previews, chart fields, and KPI values, but still hide physical schemas/tables, bound parameter names, limit metadata, and SQL fingerprints. HTTP POST /runs may additionally accept AGENT_OS_EXTERNAL_API_KEY as a projection-only X-API-Key; that principal is forced to audience=external even if the body asks for internal, top-level provider/trace-step/related-knowledge metadata is omitted, blocked-run details drop trace_id/details, and the key is not accepted on non-run management surfaces. The HTTP auth layer now exposes a tested minimal ApiPrincipal/scope matrix: internal can run internal/external projections and use outcome/adoption/search/trace surfaces, external_report can only run external projections, and operator can only execute approvals through X-Operator-Key; missing/wrong keys return 401, recognized principals without a required scope return 403, unconfigured auth returns 503, and configured internal/external/operator key values must be distinct. This is still not full RBAC, tenant isolation, field/row-level authorization, or full DLP, and the external_report key still triggers a new /runs execution rather than a side-effect-free read. POST /approvals/{approval_id}/execute is operator-key-only, binds to the exact approval context, rejects rejected/unknown/replayed approvals, and keeps R4/R5 proposal-only; the OpenAPI snapshot now marks X-Operator-Key required=true/string while missing/wrong operator keys still return 401 through runtime auth, and the unconfigured operator-key branch is covered by a 503 regression test. Postgres store_backend persists approval-bound operation/evidence/action context in approval_operation_contexts, uses claim/release to block double-consume, writes claim lease metadata, reclaims stale executing claims after the configured lease, and preserves dry-run-failure retry; stale reclaim now uses observed claim-token CAS so two cross-process reclaimers cannot both win the same stale claim. Main now persists action_record connector side effects in action_records with connector-local idempotency replay/conflict checks, replay/conflict audit counters, conflict fingerprints without raw conflicting payloads, and restart-safe rollback that does not delete later unrelated action records. This does not claim external-system exactly-once, post-write external acknowledgement recovery, durable arbitrary external connectors, or external release."
      freshness_note_addendum: "2026-06-24 audit hardening: action_record can mark a committed connector-local write as ACK-uncertain without raw audit parameters, persist the uncertain event into RunTrace/OperationTrace, and recover via same-idempotency idempotent_replay without double append. ConnectorExecutionAudit/ApprovalExecutionAudit now expose a typed safe projection over connector-reported execution semantics, including external_request_id and external_ack_status when reported, while excluding raw parameters and secret-like fields. ConnectorExecutionSemantics now lives on ActionConnectorContract so runtime audit defaults are declared by the registered connector contract before any connector payload fields are projected; action_record declares connector_local_ledger/idempotency/reconciliation semantics. external_ack_status defaults to unknown for external connector semantics unless explicitly reported. This still does not claim external ACK confirmation, external-system exactly-once, durable arbitrary external connector recovery, or external release."
