th outcome VERIFIED, configuration_snapshot_id task-configuration:c6bc0189-5ca2-4a85-a3cb-42154289745f, task_id task-6a738f6e-9501-4ef4-b9c2-fc14a3181ade, comparison verdict SELFDEV_HCW_LOWER, baseline HCW 1.0 min, SELFDEV HCW 0.38 min, delta -0.62 min, operator-intervention delta 0, receipt digest f4e6e4105d30a05a3a65e8eb747787c3261d6589904e584e17ad48d0c05f4416. Boundary: this is a narrow isolated synthetic smoke receipt, not a real matched founder task portfolio, not product superiority, not release and not Autonomy(S,E,O,V,T) evidence. The non-synthetic evidence-overlap target then ran end-to-end through the new selfdev-run-provider in-process approval continuation (S13 shared-evidence-ref guardrail at ce9cb54, continuation at 603ff53): seal -> WAITING_APPROVAL -> same-process exact-digest approval -> resume -> tests -> evaluate completed, but the provider patch did not implement EVIDENCE_REF_OVERLAP, so observed outcome is NOT_MET with automatic compensation restoring pre-change bytes and comparison verdict INCOMPARABLE_OUTCOME_NOT_VERIFIED; no HCW claim. A declared fairness fix then put the exact acceptance contract into the provider-visible statement (e020a7f) with spec/verifier/baseline frozen: attempt-1 was rejected at the provider node for a malformed proposal envelope (fail-closed, no result), attempt-2 COMPLETED with observed outcome VERIFIED and pytest 6/6, and the comparison emitted verdict SELFDEV_HCW_LOWER (baseline 1.5 min vs selfdev 0.1 min, delta -1.4, intervention delta 0, receipt d5af61e2a358c7a40879ebd0f3ccfe2546f5299d4e16c883585f77c96cccd143). This measures mechanical execution under a pre-digested exact contract on one narrow target, not task understanding, not a portfolio. The canonical convergence branch also contains R-SRL-1 HCW scorer redirect/remediation through 7adfb57 with 115 targeted tests passed and clean targeted static checks, but R-SRL remains NOT_FROZEN/NOT_RUN until run-artifact HCW data capture and remaining methodology blocker