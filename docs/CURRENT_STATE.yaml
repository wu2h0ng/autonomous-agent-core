  - id: "R-SRL-1-EVAL-HARNESS"
    track: "research"
    status: "DESIGN_CANDIDATE / HARNESS_SKELETON_IMPLEMENTED / HIDDEN_SCORER_AND_OUTCOME_EVALUATOR_IMPLEMENTED / FULL_9_EVENT_TYPE_HIDDEN_SCORER_IMPLEMENTED / TEST_BUILD_GATEWAY_AND_BUDGET_LEDGER_IMPLEMENTED / MATCHED_ARM_BUDGETS_ENFORCED_AT_73B7B03 / PILOT_GATE_AND_EXPECTED_TEST_PATH_VALIDATION_AT_7ADFB57 / TEST_BUILD_GATEWAY_ESCAPE_CLOSED_AT_03CCFE1 / PUBLIC_EVENT_CLASS_LEAKAGE_CLOSED_AT_030753D / PER_ARM_WORKDIR_ISOLATION_CLOSED_AT_DA0FA3D / BASELINE_ARM_ENVELOPE_IMPLEMENTED / REAL_REPOSITORY_FIXTURE_IMPLEMENTED / HELP_BURDEN_LEDGER_IMPLEMENTED / HCW_RECORDER_IMPLEMENTED / HCW_SCORER_REDIRECT_INTEGRATED_AT_279C0BA / BLINDED_HCW_PROTOCOL_FIX_AT_B3DAE8F / ARM4_PROTOCOL_IMPLEMENTED / SCORER_ARTIFACT_PRODUCER_IMPLEMENTED_AT_CAAAAB8 / GATEWAY_MANIFEST_VERIFICATION_ENFORCED_AT_CAAAAB8 / OPERATOR_PROTOCOLS_IMPLEMENTED / RESTART_STATE_COMPARATOR_IMPLEMENTED / REAL_TIME_BUDGET_ENFORCEMENT_IMPLEMENTED / METHODOLOGY_REVIEW_RECORDED / NOT_FROZEN / NOT_RUN / NEEDS_REMAINING_METHODOLOGY_BLOCKER_REVIEW"
    purpose: "Design and implement the frozen units, event gateway, hidden scorer, DeterministicOutcomeEvaluator integration, HCW recording and blind adjudication workflow required by R-SRL-1."
    boundary: "Harness infrastructure only. Skeleton implements FrozenUnit loader, manifest verification, in-memory event gateway and sample unit u00. Hidden scorer (RsrlHiddenEvaluator) with plugin architecture and all 9 event-type plugins implemented (TEST_FIXED, DECOY, INTERFACE_ADAPTED, CONFLICT_RESOLVED, RESTART_EQUIVALENT, UNCERTAINTY_RESOLVED, BELIEF_UPDATED, COMMITMENT_MET, HELP_ESCALATED); u00 expected_outcomes.yaml carries typed fields for each plugin. Fail-closed RsrlOutcomeEvaluator recomputes/validates drafts from artifact facts. Test/build gateway adds RsrlEventGateway.run_tests/run_build with deterministic pytest/compileall execution and durable reports. BudgetLedger tracks calls, tokens, retries, tool invocations and wall seconds per arm/unit with hard-stop BudgetExceeded. Four-arm scoring configurations now fail closed unless they configure exactly arm1-arm4 with identical ArmBudget values; unequal and partial multi-arm configs raise before scoring. FrozenUnit now requires an explicit counts_toward_gate boolean, u00 is marked false, and the gateway load path validates every expected_outcomes test_path selector against frozen repository bytes before exposing the unit. run_tests rejects pytest option selectors and path traversal; run_build executes only frozen unit build_commands allowlist entries and rejects non-allowlisted commands without charging budget. Test/build subprocesses now execute in clean per-arm TemporaryDirectory repo workdirs materialized from verified repository bytes, filtering `.pytest_cache`, `__pycache__`, `.pyc` and `.pyo` runtime residue; the workdir is destroyed after each run and tests prove arm2 starts without arm1 residue. Public events now use neutral event_class values, while hidden scoring types remain only in expected_outcomes.yaml; load_events rejects future event_class values that leak hidden scorer semantics. ArmEnvelope defines ArmRole and per-arm capability envelopes: baseline arms raise PermissionError if their actions/help requests contain SRL-internal type names, while Arm 3 (SRL) may emit the full structured vocabulary. u00 fixture now uses a realistic small Python library (canonical-lib) with pyproject.toml, src/canonical_lib package, meaningful tests and an xfail target for event-01. HelpBurdenLedger tracks SrlHelpRequests per arm/unit/window, accepts operator-minute estimates, computes repeated-question rate and longest unresolved wait, and emits HelpBurdenReceipt with WITHIN_BUDGET/EXCEEDED status. HcwRecorder stores blind-rater HcwAnnotation segments, computes total HCW minutes (excluding AUTH/WAIT by default), operator intervention count and category breakdowns. compare_srl_to_baselines now requires SRL to beat every baseline and fail-closes missing outcome counts and zero comparable HCW denominators. The rater prompt no longer prints real arm_id, and operator_protocols.yaml now includes Arm 4 persistent-state-only ablation. RsrlEventGateway now verifies manifests on the real load path, records event-bound help/restart artifacts, and exposes build_scorer_artifact/finalize_unit scorer_artifact so hidden scorer plus DOE can consume gateway-produced, event-keyed artifacts with materialized evidence refs. The tracked 2026-07-19 independent methodology review remains a blocker map; b3dae8f closes the rater arm-label leak and Arm 4 protocol gap, caaaab8 closes only R13 and R3, 03ccfe1 closes R1, 030753d closes R2, da0fa3d closes R10, 73b7b03 closes R11, 7adfb57 closes R14. No result-bearing run, no SRL Runtime implementation, no provider training, no main merge or release. The harness remains separable from the SRL Runtime so that baseline arms and the ablation arm can run without SRL internals."
    source:
