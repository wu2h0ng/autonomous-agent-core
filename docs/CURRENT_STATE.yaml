    track: "research"
    status: "DESIGN_CANDIDATE / HARNESS_SKELETON_IMPLEMENTED / HIDDEN_SCORER_AND_OUTCOME_EVALUATOR_IMPLEMENTED / FULL_9_EVENT_TYPE_HIDDEN_SCORER_IMPLEMENTED / TEST_BUILD_GATEWAY_AND_BUDGET_LEDGER_IMPLEMENTED / BASELINE_ARM_ENVELOPE_IMPLEMENTED / REAL_REPOSITORY_FIXTURE_IMPLEMENTED / HELP_BURDEN_LEDGER_IMPLEMENTED / HCW_RECORDER_IMPLEMENTED / HCW_SCORER_REDIRECT_INTEGRATED_AT_279C0BA / BLINDED_HCW_PROTOCOL_FIX_AT_B3DAE8F / ARM4_PROTOCOL_IMPLEMENTED / SCORER_ARTIFACT_PRODUCER_IMPLEMENTED_AT_CAAAAB8 / GATEWAY_MANIFEST_VERIFICATION_ENFORCED_AT_CAAAAB8 / OPERATOR_PROTOCOLS_IMPLEMENTED / RESTART_STATE_COMPARATOR_IMPLEMENTED / REAL_TIME_BUDGET_ENFORCEMENT_IMPLEMENTED / METHODOLOGY_REVIEW_RECORDED / NOT_FROZEN / NOT_RUN / NEEDS_REMAINING_METHODOLOGY_BLOCKER_REVIEW"
    purpose: "Design and implement the frozen units, event gateway, hidden scorer, DeterministicOutcomeEvaluator integration, HCW recording and blind adjudication workflow required by R-SRL-1."
    boundary: "Harness infrastructure only. Skeleton implements FrozenUnit loader, manifest verification, in-memory event gateway and sample unit u00. Hidden scorer (RsrlHiddenEvaluator) with plugin architecture and all 9 event-type plugins implemented (TEST_FIXED, DECOY, INTERFACE_ADAPTED, CONFLICT_RESOLVED, RESTART_EQUIVALENT, UNCERTAINTY_RESOLVED, BELIEF_UPDATED, COMMITMENT_MET, HELP_ESCALATED); u00 expected_outcomes.yaml carries typed fields for each plugin. Fail-closed RsrlOutcomeEvaluator recomputes/validates drafts from artifact facts. Test/build gateway adds RsrlEventGateway.run_tests/run_build with deterministic pytest/compileall execution and durable reports. BudgetLedger tracks calls, tokens, retries, tool invocations and wall seconds per arm/unit with hard-stop BudgetExceeded. ArmEnvelope defines ArmRole and per-arm capability envelopes: baseline arms raise PermissionError if their actions/help requests contain SRL-internal type names, while Arm 3 (SRL) may emit the full structured vocabulary. u00 fixture now uses a realistic small Python library (canonical-lib) with pyproject.toml, src/canonical_lib package, meaningful tests and an xfail target for event-01. HelpBurdenLedger tracks SrlHelpRequests per arm/unit/window, accepts operator-minute estimates, computes repeated-question rate and longest unresolved wait, and emits HelpBurdenReceipt with WITHIN_BUDGET/EXCEEDED status. HcwRecorder stores blind-rater HcwAnnotation segments, computes total HCW minutes (excluding AUTH/WAIT by default), operator intervention count and category breakdowns. compare_srl_to_baselines now requires SRL to beat every baseline and fail-closes missing outcome counts and zero comparable HCW denominators. The rater prompt no longer prints real arm_id, and operator_protocols.yaml now includes Arm 4 persistent-state-only ablation. RsrlEventGateway now verifies manifests on the real load path, records event-bound help/restart artifacts, and exposes build_scorer_artifact/finalize_unit scorer_artifact so hidden scorer plus DOE can consume gateway-produced, event-keyed artifacts with materialized evidence refs. The tracked 2026-07-19 independent methodology review remains a blocker map; b3dae8f closes the rater arm-label leak and Arm 4 protocol gap, caaaab8 closes only R13 and R3. No result-bearing run, no SRL Runtime implementation, no provider training, no main merge or release. The harness remains separable from the SRL Runtime so that baseline arms and the ablation arm can run without SRL internals."
    source:
      - "docs/research/R-SRL-1-preregistration-2026-07-16.md"
      - "docs/research/R-SRL-1-evaluation-harness-design-2026-07-16.md"
