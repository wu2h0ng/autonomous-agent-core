  active_decisions_remaining_work:
    - id: "ADR-0002-governed-action-outcome-loop-v0"
      status: "Accepted; lower-half implemented in commit e802377; upper-half, approval-execution hardening, durable approval-context resume with stale-claim recovery, connector-side action_record ledger with replay/conflict audit, OpenAPI operator-key contract hardening, chart-ready user_result dashboard, strongly typed evidence/source report cards, audience-aware read-side redaction, HTTP external-report-key cap, and minimal HTTP principal/scope policy contract implemented locally on feature branch codex/durable-action-ledger"
      gate: "R3 runtime work remains pending push/release authorization; no external release performed by this run"
      scope: "One reversible governed action loop with CLI adopt, causal attribution, explicit action-record intent routing, user-facing data-agent result artifact with chart-ready dashboard, strongly typed evidence/source report cards, audience-aware read-side redaction, HTTP external-report-key cap, minimal HTTP principal/scope policy contract, operator-only approval execution, durable approval-context resume with stale-claim recovery, connector-side durable action_record ledger with replay/conflict audit, OpenAPI operator-key required contract, dry-run, idempotency, approval-resume execution, rollback, and D6 red eval"
      freshness_note: "Lower-half covers causal attribution/result_weight, ActionRecord dry-run/idempotency, and contract/OpenAPI wiring. Upper-half covers CLI adopt/operator causal attribution surface, approval-resume governed execution, D6 eval, and one rollback demonstration, with review hardening for risk ceiling, dry-run/snapshot fail-fast, approval binding, and approved-execution audit trace. Explicit grounded follow-up/action-record user intent now routes to action_record but remains approval-bound. POST /runs/run_service now also return a typed user_result artifact bundling analysis, report sections, dashboard widgets, decision recommendation, and approval-bound business_action metadata; the dashboard now includes a line_chart widget derived from MetricContract dimensions and grounded query result rows, with x_field/y_field declared in OpenAPI. user_result.report.evidence_cards now exposes discriminated metric_contract/sql_safety/query_result cards derived from MetricContract, QueryPlan, SQLSafetyResult, and QueryResult metadata; internal projections include SQL fingerprints and parameter names but exclude raw SQL and parameter values. POST /runs now accepts audience=internal|external and external non-public projections redact physical sources, metric dimensions, SQL metadata, columns, preview rows, chart fields, and KPI values while keeping row counts and redaction metadata. HTTP POST /runs may additionally accept AGENT_OS_EXTERNAL_API_KEY as a projection-only X-API-Key; that principal is forced to audience=external even if the body asks for internal, top-level provider/trace-step/related-knowledge metadata is omitted, blocked-run details drop trace_id/details, and the key is not accepted on non-run management surfaces. The HTTP auth layer now exposes a tested minimal ApiPrincipal/scope matrix: internal can run internal/external projections and use outcome/adoption/search/trace surfaces, external_report can only run external projections, and operator can only execute approvals through X-Operator-Key; missing/wrong keys return 401, recognized principals without a required scope return 403, unconfigured auth returns 503, and configured internal/external/operator key values must be distinct. This is still not full RBAC, tenant isolation, field/row-level authorization, or full DLP, and the external_report key still triggers a new /runs execution rather than a side-effect-free read. POST /approvals/{approval_id}/execute is operator-key-only, binds to the exact approval context, rejects rejected/unknown/replayed approvals, and keeps R4/R5 proposal-only; the OpenAPI snapshot now marks X-Operator-Key required=true/string while missing/wrong operator keys still return 401 through runtime auth. Postgres store_backend persists approval-bound operation/evidence/action context in approval_operation_contexts, uses claim/release to block double-consume, writes claim lease metadata, reclaims stale executing claims after the configured lease, and preserves dry-run-failure retry. The feature branch also persists action_record connector side effects in action_records with connector-local idempotency replay/conflict checks, replay/conflict audit counters, conflict fingerprints without raw conflicting payloads, and restart-safe rollback that does not delete later unrelated action records. This does not claim external-system exactly-once, post-write external acknowledgement recovery, durable arbitrary external connectors, or external release."
  blocked_on_decision_or_environment:
    - "PR-07 Frontend F1 blueprint"
    - "pgvector pushdown + HNSW"
    - "OTel bridge"
    - "Stage 2 / Temporal / DataProduct Compiler v1"
