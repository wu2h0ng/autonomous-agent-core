    - "Minimal HTTP principal/scope policy contract complete on feature branch: internal, external_report, and operator principals now have an explicit tested scope matrix; missing/wrong keys return 401, recognized principals without scope return 403, unconfigured auth remains 503, and operator/API header channels stay separated"
    - "Operator-only approval execution hardening complete: POST /approvals/{approval_id}/execute requires X-Operator-Key, rejects run API keys, binds execution to the original approval context, keeps R4/R5 proposal-only in MVP, supports retry after connector dry-run failure, and exposes OpenAPI 404/409 error contracts"
    - "Durable approval-context resume complete: postgres store_backend persists approval-bound operation/evidence/action context in approval_operation_contexts, supports cross-runtime approval execution by approval_id without client replay, uses claim/release to block double-consume, reclaims stale executing claims after the configured lease, and preserves retry after connector dry-run failure"
    - "Connector-side durable action_record ledger complete on feature branch: postgres store_backend injects SqlActionRecordStore into ActionRecordConnector, persists action_records across runtime instances, enforces connector-local idempotency replay/conflict checks, audits replay/conflict counts plus conflict fingerprints without raw conflicting payloads, and keeps rollback from deleting later unrelated action records"
    - "OpenAPI operator-key contract hardening complete on feature branch: /approvals/{approval_id}/execute now advertises X-Operator-Key as required=true/string in the published snapshot while runtime missing/wrong operator key still returns 401 instead of FastAPI 422"
    - "ADR-0002 branch remediation complete on feature branch: H1 stale-claim reclaim now uses observed claim-token CAS to prevent double reclaimer wins, M1 redaction is audience-first with public external infrastructure stripping, and M2 locks the operator-key unconfigured 503 path"
    - "Connector-local post-write ACK-uncertain audit complete on feature branch: action_record stores can mark committed writes as execution-uncertain without raw audit parameters, approval execution records the uncertain event into RunTrace/OperationTrace, retry with the same idempotency key returns idempotent_replay without double append, and /approvals/{approval_id}/execute exposes a stable execution_audit projection"
    - "Typed connector execution-audit projection complete on feature branch: ConnectorExecutionAudit/ApprovalExecutionAudit project safe connector-reported execution fields into OperationTrace, RunTrace, and OpenAPI while excluding raw parameters, raw connector payloads, and secret-like fields; external ACK defaults to unknown unless explicitly reported"
    - "Connector-declared execution semantics complete on feature branch: ActionConnectorContract now carries ConnectorExecutionSemantics defaults, ActionConnectorRegistry exposes get_execution_semantics, TrustedLoopRuntime fills audit defaults from the registered contract, and action_record declares connector_local_ledger/idempotency/reconciliation semantics instead of relying on connector-name inference"
