<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 860">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
      text{font-family:'JetBrains Mono','Noto Sans SC','PingFang SC',sans-serif}
      .title{fill:#f8fafc;font-size:20px;font-weight:700}.subt{fill:#94a3b8;font-size:11px}
      .label{fill:#f8fafc;font-size:12px;font-weight:700}.sub{fill:#94a3b8;font-size:9px}.tiny{fill:#cbd5e1;font-size:8px}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 0 40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#60a5fa"/></marker>
    <marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
    <marker id="red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb7185"/></marker>
  </defs>
  <rect width="1260" height="860" fill="#0f172a"/><rect width="1260" height="860" fill="url(#grid)"/>
  <text x="40" y="46" class="title">AI Agent Engineering Workflow Boundary</text>
  <text x="40" y="67" class="subt">工作流辅助产品开发，但不得成为 ai-native-business-data-agent-os 产品运行时依赖</text>

  <rect x="52" y="108" width="520" height="620" rx="16" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="10,5"/>
  <text x="74" y="132" fill="#60a5fa" font-size="11" font-weight="700">ai-agent-engineering-workflow · Development Aid</text>
  <rect x="688" y="108" width="520" height="620" rx="16" fill="none" stroke="#34d399" stroke-width="1.2" stroke-dasharray="10,5"/>
  <text x="710" y="132" fill="#34d399" font-size="11" font-weight="700">ai-native-business-data-agent-os · Product Runtime</text>
  <rect x="594" y="138" width="72" height="590" rx="8" fill="rgba(136,19,55,.22)" stroke="#fb7185" stroke-dasharray="5,4"/>
  <text x="630" y="408" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle" transform="rotate(-90 630 408)">NO IMPORT / NO COUPLING</text>

  <rect x="104" y="176" width="190" height="58" rx="6" fill="#0f172a"/><rect x="104" y="176" width="190" height="58" rx="6" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="199" y="200" class="label" text-anchor="middle">Goal Card</text><text x="199" y="218" class="sub" text-anchor="middle">目标 / 验收 / 风险</text>
  <rect x="104" y="284" width="190" height="58" rx="6" fill="#0f172a"/><rect x="104" y="284" width="190" height="58" rx="6" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="199" y="308" class="label" text-anchor="middle">Context Pack</text><text x="199" y="326" class="sub" text-anchor="middle">代码 / 文档 / 约束</text>
  <rect x="104" y="392" width="190" height="58" rx="6" fill="#0f172a"/><rect x="104" y="392" width="190" height="58" rx="6" fill="rgba(120,53,15,.3)" stroke="#fbbf24" stroke-width="1.5"/><text x="199" y="416" class="label" text-anchor="middle">Architecture Gate</text><text x="199" y="434" class="sub" text-anchor="middle">ADR / CTO 审批</text>
  <rect x="104" y="500" width="190" height="58" rx="6" fill="#0f172a"/><rect x="104" y="500" width="190" height="58" rx="6" fill="rgba(59,130,246,.3)" stroke="#60a5fa" stroke-width="1.5"/><text x="199" y="524" class="label" text-anchor="middle">Implementation Run</text><text x="199" y="542" class="sub" text-anchor="middle">Agent 分工执行</text>
  <rect x="104" y="608" width="190" height="58" rx="6" fill="#0f172a"/><rect x="104" y="608" width="190" height="58" rx="6" fill="rgba(136,19,55,.4)" stroke="#fb7185" stroke-width="1.5"/><text x="199" y="632" class="label" text-anchor="middle">Reality Gate</text><text x="199" y="650" class="sub" text-anchor="middle">入口 / 失败 / 测试</text>

  <line x1="199" y1="234" x2="199" y2="284" stroke="#60a5fa" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="199" y1="342" x2="199" y2="392" stroke="#60a5fa" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="199" y1="450" x2="199" y2="500" stroke="#60a5fa" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="199" y1="558" x2="199" y2="608" stroke="#fb7185" stroke-width="2" marker-end="url(#red)"/>

  <rect x="340" y="392" width="178" height="58" rx="6" fill="#0f172a"/><rect x="340" y="392" width="178" height="58" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="429" y="416" class="label" text-anchor="middle">Approved Output</text><text x="429" y="434" class="sub" text-anchor="middle">code / docs / eval</text>
  <path d="M294 421 L340 421" stroke="#34d399" stroke-width="1.5" marker-end="url(#green)" fill="none"/>
  <path d="M518 421 L594 421" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5,4" fill="none"/>
  <path d="M666 421 L728 421" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#green)" fill="none"/>
  <text x="630" y="404" class="tiny" text-anchor="middle">only approved artifacts cross</text>

  <rect x="728" y="176" width="190" height="58" rx="6" fill="#0f172a"/><rect x="728" y="176" width="190" height="58" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="823" y="200" class="label" text-anchor="middle">Contracts</text><text x="823" y="218" class="sub" text-anchor="middle">typed public surface</text>
  <rect x="728" y="284" width="190" height="58" rx="6" fill="#0f172a"/><rect x="728" y="284" width="190" height="58" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="823" y="308" class="label" text-anchor="middle">Self Runtime</text><text x="823" y="326" class="sub" text-anchor="middle">state / tools / trace</text>
  <rect x="728" y="392" width="190" height="58" rx="6" fill="#0f172a"/><rect x="728" y="392" width="190" height="58" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="823" y="416" class="label" text-anchor="middle">Trusted Loop</text><text x="823" y="434" class="sub" text-anchor="middle">intent → evidence</text>
  <rect x="728" y="500" width="190" height="58" rx="6" fill="#0f172a"/><rect x="728" y="500" width="190" height="58" rx="6" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="823" y="524" class="label" text-anchor="middle">Trace / Telemetry</text><text x="823" y="542" class="sub" text-anchor="middle">business / quality / cost</text>
  <rect x="728" y="608" width="190" height="58" rx="6" fill="#0f172a"/><rect x="728" y="608" width="190" height="58" rx="6" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="823" y="632" class="label" text-anchor="middle">API + Workspace</text><text x="823" y="650" class="sub" text-anchor="middle">用户产品面</text>
  <line x1="823" y1="234" x2="823" y2="284" stroke="#34d399" stroke-width="2" marker-end="url(#green)"/>
  <line x1="823" y1="342" x2="823" y2="392" stroke="#34d399" stroke-width="2" marker-end="url(#green)"/>
  <line x1="823" y1="450" x2="823" y2="500" stroke="#34d399" stroke-width="2" marker-end="url(#green)"/>
  <line x1="823" y1="558" x2="823" y2="608" stroke="#34d399" stroke-width="2" marker-end="url(#green)"/>

  <rect x="978" y="250" width="170" height="58" rx="6" fill="#0f172a"/><rect x="978" y="250" width="170" height="58" rx="6" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1063" y="274" class="label" text-anchor="middle">Domain Packs</text><text x="1063" y="292" class="sub" text-anchor="middle">领域配置</text>
  <rect x="978" y="422" width="170" height="58" rx="6" fill="#0f172a"/><rect x="978" y="422" width="170" height="58" rx="6" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1063" y="446" class="label" text-anchor="middle">Providers</text><text x="1063" y="464" class="sub" text-anchor="middle">数据能力</text>
  <path d="M918 313 L978 279" stroke="#a78bfa" fill="none" marker-end="url(#arrow)"/><path d="M918 421 L978 451" stroke="#a78bfa" fill="none" marker-end="url(#arrow)"/>

  <rect x="92" y="760" width="1060" height="62" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="116" y="786" fill="#f8fafc" font-size="11" font-weight="700">Allowed</text>
  <text x="190" y="786" class="tiny">workflow.yaml, ADR, review report, tests, eval cases, approved code, code_index updates</text>
  <text x="116" y="807" fill="#fb7185" font-size="11" font-weight="700">Forbidden</text>
  <text x="190" y="807" class="tiny">import workflow runner into product runtime, bypass SQL Safety/Evidence/Eval/Trace, use LangGraph as Core dependency</text>
</svg>
