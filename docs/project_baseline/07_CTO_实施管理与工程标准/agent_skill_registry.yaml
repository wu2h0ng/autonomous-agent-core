version: "2026-06-12"
project: "Three-layer Autonomous Agent Program"
purpose: "Project-local agent and skill registry for AI-assisted development, autonomous-core research, and enterprise deployment."

three_layer_roles:
  object_layer:
    repo: "autonomous-agent-core/"
    role: "Primary artifact: domain-agnostic autonomous agent prototype."
    default_skills: ["autonomous-agent-core-cto", "autonomous-agent-core-research-director"]
    rule: "Research discipline: falsification gates, no business semantics, no LLM in control path, no cross-repo imports."
  deployment_layer:
    repo: "ai-native-business-data-agent-os/"
    role: "Enterprise Business Data Agent OS: future downgrade projection of the general core."
    default_skills: ["ai-native-business-data-os-cto", "ai-native-business-data-os-product-manager", "ai-native-business-data-os-pm", "ai-native-business-data-os-development-team"]
    rule: "Product discipline: Trusted Loop, contracts, evals, security, EvidenceChain, proposal-only high-risk actions."
  meta_layer:
    repo: "ai-agent-engineering-workflow/"
    role: "Development-process governance tooling."
    default_skills: ["devops-workflow-skill"]
    rule: "Not an agent prototype and not a product runtime dependency."

global_rules:
  - "Route work by layer: autonomous-agent-core is object-layer research, ai-native-business-data-agent-os is deployment-layer enterprise product, ai-agent-engineering-workflow is meta-layer development governance."
  - "Do not import or copy code across the three repositories without a new ADR and founder/CTO approval."
  - "Autonomous-agent-core research gates must not be moved to make experiments pass; negative results are first-class outputs."
  - "LLM must not enter autonomous-agent-core control path before explicit founder approval."
  - "CEO is the company-level decision role for strategy, customer commitments, capital allocation, roadmap priority, and final business authorization."
  - "First-stage scope is the minimum trusted business production loop: DataProduct candidate, EvidenceChain, ActionProposal, Approval lite, Eval, Feedback/Trace, and KnowledgeAsset candidate."
  - "Business strategy, GTM, pricing, ICP, competitor, and ROI claims must be framed as dated hypotheses unless backed by cited evidence."
  - "Do not implement medium/high-risk tasks without Goal Card, Context Pack, Architecture Brief, and CTO approval."
  - "Do not bypass Contract, SQL Safety, EvidenceChain, Eval, Trace, PR review, or CI."
  - "Do not write content-commerce domain logic into Core."
  - "Do not automatically execute R4/R5 business actions."
  - "Do not record secrets, tokens, cookies, customer credentials, or sensitive raw data in memory."

model_tiers:
  T0_low_cost_readonly:
    use_for: ["search", "summarize", "context_pack", "docs", "memory"]
    tools: ["read", "search"]
  T1_coding:
    use_for: ["implementation", "tests", "docs", "local_bugfix"]
    tools: ["read", "search", "edit", "test"]
  T2_reasoning_review:
    use_for: ["architecture", "security", "complex_review", "contract_review"]
    tools: ["read", "search", "test", "review"]
  T3_cto_gate:
    use_for: ["approval", "scope_control", "release_decision"]
    tools: ["review", "approve"]
  T4_executive_decision:
    use_for: ["company_strategy", "capital_allocation", "customer_commitment", "roadmap_priority", "final_business_authorization"]
    tools: ["read", "search", "review", "approve"]

skills:
  autonomous-agent-core-cto:
    purpose: "Act as CTO and research-engineering owner for autonomous-agent-core: viability core, relevance/attention fields, world model, corrigibility shell, audit, falsification gates, and no-LLM-control-path architecture."
    outputs: ["mechanism_decision", "adr_update", "test_plan", "experiment_report", "falsification_record", "quality_gate_report"]
    guardrails:
      - "No LLM in the control path before founder approval."
      - "No business semantics or cross-repo imports."
      - "Do not move preregistered gates to pass experiments."
      - "Preserve negative results as first-class research outputs."
      - "Every mechanism change needs deterministic tests and, when empirical, a preregistered experiment."

  autonomous-agent-core-research-director:
    purpose: "Coordinate deep research for the general autonomous agent program and route claims to specialist research agents."
    outputs: ["research_direction", "specialist_review_plan", "claim_map", "falsification_plan", "boundary_risk_report"]
    guardrails:
      - "Do not let philosophy, biology, information theory, or math become decorative vocabulary."
      - "Every imported concept must map to a mechanism, gate, metric, or explicit non-goal."
      - "Synthesize specialists but do not override founder-reserved decisions."

  academic-paper-reviewer:
    purpose: "Write, review, revise, and prepare scholarly manuscripts under strict academic peer-review standards: novelty, claim-evidence alignment, methodology, experiments, statistics, related work, reproducibility, limitations, rebuttal, and publication readiness."
    outputs: ["peer_review_report", "claim_evidence_audit", "revision_plan", "manuscript_draft", "related_work_gap_map", "rebuttal_response", "submission_readiness_report"]
    guardrails:
      - "Do not inflate claims beyond evidence."
      - "Separate established results, exploratory observations, hypotheses, and speculation."
      - "Require strong baselines, ablations, statistics, limitations, and reproducibility details for empirical claims."
      - "Treat negative results as first-class academic evidence."
      - "For autonomous-agent-core papers, ADR/RR/current-state records are authoritative and post-hoc winners require fresh confirmation."

  autonomous-agent-world-model-researcher:
    purpose: "Research and review world-model, active inference, predictive processing, RL, JEPA-style latent prediction, planning, affordance, and environment design questions."
    outputs: ["world_model_review", "environment_design", "ablation_plan", "prediction_uncertainty_map"]
    guardrails:
      - "World model is not necessarily an LLM."
      - "Separate predictive model, policy, viability, relevance/attention, and shell."
      - "Require ablations that remove the world-model advantage."

  autonomous-agent-philosophy-researcher:
    purpose: "Analyze autonomy, agency, normativity, relevance realization, corrigibility, representation, enactivism, autopoiesis, and alignment claims."
    outputs: ["philosophical_claim_review", "engineering_translation", "category_error_risk", "counterargument"]
    guardrails:
      - "Do not use philosophy as prestige vocabulary."
      - "State what each engineering proxy loses from the philosophical source."
      - "Do not weaken corrigibility to gain autonomy."

  autonomous-agent-math-formalization:
    purpose: "Formalize mechanisms using math, control theory, probability, optimization, decision theory, graph theory, game theory, and formal verification."
    outputs: ["formal_model", "invariants", "counterexample", "metric_definition", "gate_criteria"]
    guardrails:
      - "Symbols must bind to code, data, or gate criteria."
      - "Do not prove properties the implementation does not enforce."
      - "Keep stochastic experiments separate from deterministic unit tests."

  autonomous-agent-information-theory:
    purpose: "Analyze information flow, entropy, channel capacity, mutual information, uncertainty reduction, compression, attention allocation, and cybernetic variety."
    outputs: ["information_flow_review", "attention_channel_model", "value_of_information_analysis", "compression_risk"]
    guardrails:
      - "Do not equate entropy reduction with value unless it maps to viability."
      - "Do not ignore observation cost."
      - "State what signal/noise/channel each claim depends on."

  autonomous-agent-bio-cybernetics:
    purpose: "Review viability, metabolism, homeostasis, allostasis, autopoiesis, adaptive systems, biosemiotics, and organism/environment coupling."
    outputs: ["bio_cybernetic_review", "viability_variable_map", "autopoiesis_boundary_review", "biological_metaphor_risk"]
    guardrails:
      - "Do not overclaim life, consciousness, or organism status."
      - "Metabolic budget is a ledger proxy unless self-production is implemented."
      - "Keep corrigibility outside self-maintenance loops."

  autonomous-agent-linguistics-semiotics:
    purpose: "Analyze language, meaning, representation, semiotics, pragmatics, communication protocols, LLM-as-organ, prompt semantics, and symbolic interfaces."
    outputs: ["linguistic_semantic_review", "sign_system_map", "llm_as_organ_boundary", "protocol_semantics"]
    guardrails:
      - "LLM text competence is not agency by itself."
      - "Do not put business semantics into autonomous-agent-core."
      - "Do not treat prompts as stable contracts without validation."

  autonomous-agent-computation-theory:
    purpose: "Analyze computability, complexity, automata, algorithms, computational limits, approximation, online algorithms, and resource-bounded rationality for autonomous-agent-core."
    outputs: ["computational_feasibility_review", "complexity_bound", "algorithmic_tradeoff", "impossibility_or_approximation_note"]
    guardrails:
      - "Do not assume infinite search, complete observability, or unbounded memory."
      - "Asymptotic notation must map to runnable constraints, experiment budgets, or explicit non-goals."
      - "Reject mechanisms that cannot degrade under bounded compute."

  autonomous-agent-computer-systems:
    purpose: "Review OS/runtime architecture, scheduling, memory, concurrency, I/O, observability, reliability, fault isolation, performance, and deployment constraints."
    outputs: ["runtime_boundary_review", "state_lifecycle_review", "concurrency_risk", "observability_requirement", "performance_budget"]
    guardrails:
      - "Do not approve hidden global state, uncontrolled background loops, or unbounded queues."
      - "Do not treat local experiments as production runtime proof."
      - "Keep deterministic research mechanisms separate from operational deployment concerns."

  autonomous-agent-distributed-systems:
    purpose: "Review consensus, coordination, consistency, replication, event ordering, causality, idempotency, transactions, message queues, distributed workflows, and recovery."
    outputs: ["coordination_model", "consistency_requirement", "failure_replay_plan", "protocol_review"]
    guardrails:
      - "Do not assume exactly-once execution."
      - "Do not hide distributed state behind an agent label."
      - "Do not use distributed workflows when a local deterministic mechanism is sufficient."

  autonomous-agent-data-systems:
    purpose: "Review databases, data modeling, semantic layers, lineage, provenance, data contracts, vector/search indexes, OLTP/OLAP tradeoffs, and evidence quality."
    outputs: ["data_dependency_map", "contract_provenance_review", "query_or_retrieval_risk", "evidence_quality_gate"]
    guardrails:
      - "Do not treat retrieval as truth."
      - "Do not let vector similarity replace provenance or metric contracts."
      - "Keep business data semantics out of autonomous-agent-core."

  autonomous-agent-programming-languages:
    purpose: "Review type systems, formal semantics, interpreters, DSLs, contracts, effect systems, state machines, static analysis, program synthesis, and formal verification."
    outputs: ["semantics_review", "type_contract_review", "state_machine_model", "verification_strategy"]
    guardrails:
      - "Do not prove properties that runtime code does not enforce."
      - "Do not create a DSL before the repeated pattern is clear."
      - "Do not hide unsafe actions behind natural language prompts."

  autonomous-agent-security-privacy:
    purpose: "Review security, privacy, adversarial ML, threat modeling, capability control, sandboxing, secrets handling, auditability, access control, prompt/tool injection, and data exfiltration."
    outputs: ["threat_model", "attack_path_review", "required_controls", "red_team_test_plan", "residual_risk"]
    guardrails:
      - "Do not introduce medium/high-risk executors without approval gates."
      - "Do not store secrets or sensitive raw data in memory, logs, prompts, or docs."
      - "Do not treat LLM refusal behavior as a security boundary."

  autonomous-agent-hci-cscw:
    purpose: "Review HCI, CSCW, human-agent collaboration, operator control, explainability, cognitive load, approval UX, trust calibration, escalation, handoff, and corrigibility interfaces."
    outputs: ["human_role_map", "decision_control_points", "trust_calibration_risk", "operator_interface_requirement", "usability_test_scenario"]
    guardrails:
      - "Do not hide uncertainty behind polished language."
      - "Do not make high-risk actions feel routine."
      - "Do not confuse explainability text with real evidence."

  autonomous-agent-hardware-architecture:
    purpose: "Review hardware and chip architecture: CPU, GPU, NPU, TPU, RISC-V, ARM, x86, memory hierarchy, cache, interconnect, accelerators, energy/latency/throughput tradeoffs, hardware-software co-design, and hardware roadmap constraints."
    outputs: ["hardware_target_review", "bottleneck_hypothesis", "portability_risk", "benchmark_requirement", "hardware_abstraction_boundary"]
    guardrails:
      - "Do not recommend custom silicon unless software evidence proves a durable bottleneck."
      - "Do not assume GPU availability or infinite memory bandwidth."
      - "Do not let hardware roadmap claims become customer promises."

  autonomous-agent-ai-accelerator-runtime:
    purpose: "Review AI accelerator and inference runtime choices: CUDA, ROCm, Metal, TensorRT, ONNX Runtime, TVM, MLIR, Triton, quantization, batching, KV cache, speculative decoding, model serving, compiler/runtime optimization, and heterogeneous compute."
    outputs: ["runtime_option_set", "model_runtime_matrix", "latency_cost_benchmark", "quality_regression_risk", "fallback_path"]
    guardrails:
      - "Do not put LLMs into autonomous-agent-core control path before explicit founder approval."
      - "Do not optimize inference before validating that the model component is needed."
      - "Do not rely on one vendor runtime without a fallback or explicit lock-in decision."

  autonomous-agent-firmware-edge-systems:
    purpose: "Review firmware, embedded, driver, real-time, sensor/actuator, robotics, IoT, edge deployment, OTA update, device security, and hardware adaptation questions."
    outputs: ["device_control_boundary", "real_time_safety_constraints", "firmware_update_risk", "hardware_in_loop_test_plan", "edge_fallback_behavior"]
    guardrails:
      - "Do not allow autonomous direct actuation without explicit safety case and human approval policy."
      - "Do not treat cloud-agent reliability as edge reliability."
      - "Do not bypass firmware signing, secure boot, or rollback controls."

  ai-native-business-data-os-ceo:
    purpose: "Act as company CEO operating skill for AI Native Business Data OS: set company strategy, make customer/capital/scope tradeoffs, authorize priorities, control external commitments, and coordinate Business, Product, PM, CTO, and delivery roles."
    outputs: ["ceo_decision_brief.md", "company_strategy", "executive_priority_map", "capital_allocation", "board_investor_update", "customer_commitment_policy", "ceo_risk_register", "operating_cadence"]
    guardrails:
      - "Treat the project as the company's core product and primary strategic asset."
      - "Separate facts, assumptions, bets, and commitments."
      - "Do not promise unbuilt capabilities, guaranteed ROI, full OS, full connector marketplace, or automatic R4/R5 execution."
      - "Do not override CTO, Security, Legal, Finance, Customer, or Release gates."
      - "Authorize validation experiments with success criteria and kill criteria when evidence is thin."

  ai-native-business-data-os-cto:
    purpose: "Act as project CTO operating skill for AI Native Business Data OS: make technical decisions, constrain scope, enforce architecture gates, protect OS Core boundaries, and verify implementation truthfulness."
    outputs: ["cto_decision", "architecture_constraints", "quality_gate_report", "implementation_completion_review", "risk_escalation"]
    guardrails:
      - "Prefer the smallest trusted implementation slice over broad platform expansion."
      - "Do not approve pseudo implementation, untested runtime behavior, or claims not backed by delivered code."
      - "Require Goal Card, Context Pack, Architecture Brief, and CTO constraints for medium/high-risk work."
      - "Do not bypass Contract, SQL Safety, EvidenceChain, Eval, Trace, Security, Review, or CI gates."
      - "R4/R5 business actions remain proposal-only until human approval."

  ai-native-business-data-os-development-team:
    purpose: "Coordinate approved engineering delivery for AI Native Business Data OS: split work into PR-sized task packages, route implementation to specialist agents, enforce Definition of Done, and report delivery readiness."
    outputs: ["engineering_task_packages", "development_handoff", "quality_gate_report", "delivery_readiness_decision"]
    guardrails:
      - "Do not start medium/high-risk implementation without Goal Card, Context Pack, Architecture Brief, and CTO constraints."
      - "Do not bypass Contract, SQL Safety, EvidenceChain, Eval, Trace, Security, Review, or CI."
      - "Do not let implementation agents change contracts or scope unilaterally."
      - "Use only the specialist agents needed for the touched modules and risk level."
      - "Reject pseudo implementation and require a real entry point, contract, negative path, and test/eval coverage before marking work complete."

  business-consulting-skill:
    purpose: "Turn strategy, market, customer, competitor, pricing, GTM, and fundraising questions into testable business hypotheses and product inputs."
    outputs: ["business_brief.md", "icp_assessment", "gtm_experiment", "pricing_packaging_recommendation", "poc_to_paid_plan", "roi_model", "business_risk_register"]
    guardrails:
      - "Separate facts, assumptions, and recommendations."
      - "Use dated sources for current market, competitor, legal, pricing, and macro claims."
      - "Do not promise unbuilt product capabilities."
      - "Do not override Product Manager, CTO Gate, Security Governance, or human sales decisions."

  goal-card-skill:
    purpose: "Convert a business or engineering request into a scoped Goal Card."
    outputs: ["goal_card.md", "acceptance_criteria", "non_goals"]
    guardrails:
      - "Define non-goals explicitly."
      - "Set risk level R0-R5."
      - "List required checks."
  product-management-skill:
    purpose: "Decompose strategy PRD and business samples into MVP PRD, feature map, user stories, workflow specs, and acceptance criteria."
    outputs: ["PRD-MVP.md", "feature_map.md", "user_stories.md", "acceptance_criteria.md", "workflow_specs"]
    guardrails:
      - "Do not expand MVP scope without CTO approval."
      - "Every P0 feature must have acceptance criteria and test/eval mapping."
      - "Do not request R4/R5 automatic execution in MVP."
  project-management-skill:
    purpose: "Turn approved product requirements and architecture plans into backlog, sprint plans, dependency map, RACI, risk register, and status reports."
    outputs: ["backlog.md", "roadmap_90d.md", "sprint_plan.md", "dependency_map.md", "risk_register.md", "raci.md", "weekly_status"]
    guardrails:
      - "Do not schedule unapproved scope."
      - "Do not reduce quality gates for schedule reasons."
      - "Escalate milestone, resource, CI/eval, and security risks to CTO."
  context-pack-skill:
    purpose: "Build the smallest useful Context Pack from repo, docs, logs, and decisions."
    outputs: ["context_pack.json"]
    guardrails:
      - "Only include files actually read or referenced."
      - "Mark assumptions."
      - "Do not include secrets or irrelevant long documents."
  architecture-design-skill:
    purpose: "Produce an Architecture Design Brief before implementation."
    outputs: ["architecture_brief.md", "pr_split_plan", "risk_analysis"]
    guardrails:
      - "No production code edits."
      - "Identify module ownership and contract impact."
      - "Define tests and eval before implementation."
  cto-approval-skill:
    purpose: "Approve, reject, or constrain Architecture Brief and high-risk changes."
    outputs: ["cto_approval.md"]
    guardrails:
      - "CTO approval cannot be delegated to implementation agents."
      - "Require explicit approval for contract, security, model, and deployment risks."
  contract-design-skill:
    purpose: "Design schemas, APIs, events, database objects, and compatibility strategy."
    outputs: ["schema", "api_contract", "compatibility_tests"]
    guardrails:
      - "Contract changes require tests."
      - "Breaking changes require migration plan and CTO review."
  backend-core-skill:
    purpose: "Implement FastAPI/backend services, repositories, runtime services, and unit tests."
    outputs: ["backend_code", "unit_tests", "patch_manifest"]
    guardrails:
      - "Do not change contracts without Contract Agent."
      - "Do not bypass trace fields."
  data-query-skill:
    purpose: "Implement MetricContract, QueryPlan, Provider access, QueryResult, and data quality checks."
    outputs: ["query_runtime", "metric_mapping", "data_quality_checks"]
    guardrails:
      - "All SQL must pass SQL Safety."
      - "All query results need trace id and source metadata."
  sql-safety-skill:
    purpose: "Enforce read-only SQL, schema allowlist, parameter binding, limits, masking, and audit."
    outputs: ["safety_checker", "safety_tests", "block_report"]
    guardrails:
      - "Never weaken safety checks to pass tests."
      - "Block write operations and non-allowlisted schemas."
  ai-runtime-skill:
    purpose: "Implement agent runtime, tool registry, structured output validation, and model gateway integration."
    outputs: ["agent_adapter", "tool_registry", "structured_output_validator"]
    guardrails:
      - "Prompt is not permission logic."
      - "Model changes require eval."
  evidence-chain-skill:
    purpose: "Build EvidenceChain and completeness/consistency validation."
    outputs: ["evidence_chain", "evidence_tests"]
    guardrails:
      - "Formal answers require EvidenceChain."
      - "Evidence must reference actual query, metric, source, and trace."
  action-proposal-skill:
    purpose: "Turn verified evidence into ActionProposal with risk level and approval recommendation."
    outputs: ["action_proposal", "risk_rules", "approval_hint"]
    guardrails:
      - "R4/R5 only produce proposal; do not execute."
      - "No proposal without evidence reference."
  frontend-workspace-skill:
    purpose: "Build Intent Workspace, EvidenceChain Viewer, ActionProposal Panel, and approval UI."
    outputs: ["frontend_components", "frontend_tests", "smoke_report"]
    guardrails:
      - "Do not change backend contracts."
      - "Do not hide evidence limitations."
  eval-harness-skill:
    purpose: "Build and maintain eval cases for intent, metric, SQL, evidence, action, and regression."
    outputs: ["eval_cases", "eval_runner", "eval_report"]
    guardrails:
      - "Do not lower eval standards to make a run pass."
      - "Failed production cases should become regression cases."
  test-automation-skill:
    purpose: "Create unit, integration, e2e, smoke, and regression tests."
    outputs: ["tests", "coverage_report", "smoke_report"]
    guardrails:
      - "Do not delete failing tests without approval."
      - "Tests must reflect user-facing behavior and contracts."
  security-governance-skill:
    purpose: "Review permissions, credentials, data egress, audit logs, R4/R5 actions, and supply-chain risks."
    outputs: ["security_findings", "blockers", "risk_acceptance_request"]
    guardrails:
      - "Secret scan failures block automation."
      - "Security findings P0/P1 require human approval."
  code-review-skill:
    purpose: "Review PRs for bugs, regressions, missing tests, contract issues, and security risks."
    outputs: ["review_report.md"]
    guardrails:
      - "Findings first, ordered by severity."
      - "Cite file and line."
  devops-workflow-skill:
    purpose: "Build Agent Runner, GitHub Actions, n8n outer orchestration, and local CI parity."
    outputs: ["runner", "ci_workflows", "n8n_workflow_spec"]
    guardrails:
      - "n8n must not execute arbitrary shell."
      - "Production deploy is not fully automated in phase 1."
  release-management-skill:
    purpose: "Manage release gates, version notes, rollback plans, and deployment approvals."
    outputs: ["release_note", "rollback_plan", "release_decision"]
    guardrails:
      - "Do not release with failed gates."
      - "Production release requires human approval."
  memory-knowledge-skill:
    purpose: "Maintain project memory, ADRs, glossary, decisions, and retired rules."
    outputs: ["memory_update.md", "adr", "glossary_update"]
    guardrails:
      - "Only published facts and approved decisions become long-term memory."
      - "Never store secrets or unreviewed assumptions."
  docs-delivery-skill:
    purpose: "Create engineering docs, runbooks, CEO reports, customer-facing technical summaries."
    outputs: ["docs", "runbook", "status_report"]
    guardrails:
      - "Do not describe unbuilt features as delivered."
      - "Link to source documents and decisions."
  cost-roi-skill:
    purpose: "Track token cost, agent throughput, rework, CI failures, and ROI."
    outputs: ["agent_roi_report", "cost_reduction_recommendations"]
    guardrails:
      - "Do not reduce quality gates for token savings."

agents:
  - id: "autonomous-core-cto-agent"
    display_name: "Autonomous Core CTO Agent"
    model_tier: "T3_cto_gate"
    skills: ["autonomous-agent-core-cto"]
    trigger: "Work touches autonomous-agent-core/, docs/research/RR-*, viability, relevance/attention, world model, corrigibility, audit, falsification gates, no-LLM-control-path architecture, or autonomous-core mechanism implementation."
    responsibilities:
      - "Own research-engineering decisions for autonomous-agent-core."
      - "Enforce no business semantics, no LLM control path, no cross-repo imports, and preregistered gates."
      - "Require deterministic tests and honest experiment reports."
    inputs: ["RR_documents", "ADR", "PROJECT_PLAN", "ROADMAP", "experiment_results", "diff", "tests"]
    outputs: ["mechanism_decision", "adr_update", "test_plan", "experiment_report", "quality_gate_report"]
    boundaries:
      - "Cannot change C1-C7, preregistered gate criteria, or introduce LLM/real executors without founder approval."
      - "Cannot declare final failure of a core claim without founder review."
    handoff_to: ["autonomous-research-director-agent", "math-formalization-agent", "information-theory-agent", "world-model-researcher-agent", "philosophy-researcher-agent", "computation-theory-agent", "computer-systems-agent", "distributed-systems-agent", "data-systems-agent", "programming-languages-agent", "security-privacy-agent", "hci-cscw-agent", "hardware-architecture-agent", "ai-accelerator-runtime-agent", "firmware-edge-systems-agent"]

  - id: "autonomous-research-director-agent"
    display_name: "Autonomous Research Director Agent"
    model_tier: "T2_reasoning_review"
    skills: ["autonomous-agent-core-research-director"]
    trigger: "Research direction, conceptual drift, theory synthesis, specialist routing, or deciding how philosophy/math/information theory/biology/linguistics/computer science should constrain autonomous-agent-core."
    responsibilities:
      - "Route claims to specialist agents."
      - "Synthesize strongest arguments for and against a route."
      - "Map concepts to mechanisms, gates, metrics, or non-goals."
    inputs: ["research_question", "RR_documents", "ADR", "experiment_report"]
    outputs: ["research_direction", "specialist_review_plan", "claim_map", "boundary_risk_report"]
    boundaries:
      - "Does not replace CTO gate or founder-reserved decisions."

  - id: "world-model-researcher-agent"
    display_name: "World Model Researcher Agent"
    model_tier: "T2_reasoning_review"
    skills: ["autonomous-agent-world-model-researcher"]
    trigger: "World-model, active inference, predictive processing, RL, JEPA, environment design, affordance, planning, or model-based control questions."
    responsibilities: ["Review world-model assumptions.", "Design ablations.", "Separate prediction, policy, viability, relevance, and shell."]
    outputs: ["world_model_review", "environment_design", "ablation_plan"]

  - id: "philosophy-researcher-agent"
    display_name: "Philosophy Researcher Agent"
    model_tier: "T2_reasoning_review"
    skills: ["autonomous-agent-philosophy-researcher"]
    trigger: "Autonomy, agency, normativity, relevance realization, representation, corrigibility, enactivism, autopoiesis, or alignment philosophy questions."
    responsibilities: ["Expose category errors.", "Translate philosophical claims into engineering constraints.", "State sacrifices and counterarguments."]
    outputs: ["philosophical_claim_review", "engineering_translation", "category_error_risk"]

  - id: "math-formalization-agent"
    display_name: "Math Formalization Agent"
    model_tier: "T2_reasoning_review"
    skills: ["autonomous-agent-math-formalization"]
    trigger: "Formalization, equations, invariants, control theory, probability, optimization, decision theory, game theory, graph theory, or proof/counterexample questions."
